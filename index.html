<style>
  :root{
    --ink:#4A3728;
    --paper:#F6EFDD;
    --paper-2:#EDE0BE;
    --teal:#6FAE5C;
    --teal-deep:#4C7A3E;
    --amber:#F4C766;
    --coral:#E8836B;
    --green:#5B9C4C;
    --line: rgba(74,55,40,0.16);
    --white:#FFFBF2;
    --s:1.12;
  }
  html{
    scrollbar-gutter: stable;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh;
    overflow-y:scroll;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .bg-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.16;
    z-index:-1;
    user-select:none;
    line-height:1;
  }

  /* 동물의 숲 스타일 헤더 */
  .board{
    background:linear-gradient(160deg, var(--teal-deep) 0%, var(--teal) 100%);
    color:var(--white);
    padding:calc(24px * var(--s)) calc(20px * var(--s)) calc(22px * var(--s));
    position:relative;
    overflow:hidden;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
    transition:padding 0.25s ease;
  }
  .board.compact{
    padding:calc(12px * var(--s)) calc(18px * var(--s)) calc(16px * var(--s));
  }
  .board::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:16px;
    background:
      radial-gradient(circle at 10px 0, transparent 10px, var(--paper) 11px) 0 0/20px 16px repeat-x;
  }
  .board-title{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:calc(28px * var(--s));
    letter-spacing:0.3px;
    margin:0 0 2px;
    transition:font-size 0.25s ease;
  }
  .board.compact .board-title{
    font-size:calc(18px * var(--s));
    margin:0;
  }
  .board-sub{
    font-family:'Gaegu', sans-serif;
    font-size:calc(13px * var(--s));
    color:var(--amber);
    margin:0;
    max-height:40px;
    overflow:hidden;
    transition:max-height 0.2s ease, opacity 0.2s ease;
  }
  .board.compact .board-sub{
    max-height:0;
    opacity:0;
    margin:0;
  }

  .passenger-row{
    display:flex;
    gap:8px;
    padding:calc(14px * var(--s)) calc(16px * var(--s)) calc(6px * var(--s));
    flex-wrap:wrap;
    align-items:center;
  }
  .family-compact-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(8px * var(--s)) calc(16px * var(--s));
    cursor:pointer;
  }
  .family-compact-who{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    font-size:calc(14px * var(--s));
  }
  .family-compact-switch{
    font-family:'Gaegu', sans-serif;
    font-size:calc(12px * var(--s));
    opacity:0.65;
  }
  .passenger-label{
    font-family:'Gaegu', sans-serif;
    font-size:calc(11px * var(--s));
    color:var(--ink);
    opacity:0.6;
    width:100%;
    margin-bottom:2px;
  }
  .chip{
    font-family:'Gowun Dodum', sans-serif;
    font-size:calc(14px * var(--s));
    padding:calc(7px * var(--s)) calc(13px * var(--s));
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    cursor:pointer;
    color:var(--ink);
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chip:active{ transform:scale(0.9); }
  .chip.active{
    background:var(--teal);
    color:var(--white);
    border-color:var(--teal);
  }
  .chip.add{
    border-style:dashed;
    color:var(--teal-deep);
  }
  .member-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border-radius:16px;
    padding:calc(8px * var(--s)) calc(14px * var(--s));
  }
  .member-chip-name{
    font-weight:700;
  }
  .member-chip-stat{
    font-size:calc(11px * var(--s));
    opacity:0.75;
  }
  .member-chip.active .member-chip-stat{
    opacity:0.9;
  }

  /* Tabs styled like ticket stubs */
  .tabs{
    display:flex;
    padding:calc(10px * var(--s)) calc(16px * var(--s)) 0;
    gap:6px;
    border-bottom:1.5px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:calc(10px * var(--s)) calc(4px * var(--s)) calc(12px * var(--s));
    font-size:calc(14px * var(--s));
    font-weight:500;
    color:var(--ink);
    opacity:0.55;
    cursor:pointer;
    border-bottom:3px solid transparent;
    background:none;
    border-left:none;border-right:none;border-top:none;
    font-family:'Gowun Dodum', sans-serif;
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }
  .tab:active{ transform:scale(0.92); }
  .tab.active{
    opacity:1;
    border-bottom:3px solid var(--amber);
    font-weight:700;
  }

  .content{
    flex:1;
    padding:calc(20px * var(--s)) calc(18px * var(--s)) calc(40px * var(--s));
  }

  .empty{
    text-align:center;
    padding:calc(50px * var(--s)) calc(20px * var(--s));
    color:var(--ink);
    opacity:0.6;
    font-size:calc(14px * var(--s));
    line-height:1.7;
  }

  /* Boarding pass flashcard */
  .pass{
    background:var(--white);
    border-radius:14px;
    box-shadow:0 10px 24px rgba(74,55,40,0.14);
    overflow:hidden;
    position:relative;
    min-height:260px;
    cursor:pointer;
    user-select:none;
  }
  .pass-top{
    background:var(--teal);
    color:var(--white);
    padding:calc(14px * var(--s)) calc(18px * var(--s));
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Gaegu', sans-serif;
    font-size:calc(11px * var(--s));
    letter-spacing:0.5px;
  }
  .pass-body{
    padding:calc(36px * var(--s)) calc(22px * var(--s)) calc(30px * var(--s));
    text-align:center;
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
  .pass-word{
    font-family:'Gaegu', sans-serif;
    font-size:calc(32px * var(--s));
    font-weight:700;
    line-height:1.25;
  }
  .pass-hint{
    font-size:calc(13px * var(--s));
    color:var(--ink);
    opacity:0.5;
  }
  .pass-example{
    font-size:calc(14px * var(--s));
    color:var(--ink);
    opacity:0.75;
    margin-top:6px;
    line-height:1.6;
  }
  .perforation{
    position:relative;
    height:0;
    border-top:2px dashed var(--line);
    margin:0 18px;
  }
  .perforation::before, .perforation::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px; height:18px;
    background:var(--paper);
    border-radius:50%;
  }
  .perforation::before{ left:-27px; }
  .perforation::after{ right:-27px; }

  .pass-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:calc(13px * var(--s)) calc(10px * var(--s));
    border-radius:10px;
    border:none;
    font-size:calc(14px * var(--s));
    font-weight:700;
    cursor:pointer;
    font-family:'Gowun Dodum', sans-serif;
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }
  .btn-know{ background:var(--green); color:var(--white); }
  .btn-again{ background:var(--coral); color:var(--white); }
  .btn-primary{ background:var(--teal-deep); color:var(--white); }
  .btn-ghost{ background:var(--white); color:var(--ink); border:1.5px solid var(--line); }
  .btn:active{ opacity:0.9; transform:scale(0.9); }
  .btn.listening{ animation: micPulse 1.2s infinite; }
  @keyframes micPulse{
    0%{ box-shadow:0 0 0 0 rgba(232,131,107,0.5); }
    70%{ box-shadow:0 0 0 14px rgba(232,131,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(232,131,107,0); }
  }

  .progress-line{
    font-family:'Gaegu', sans-serif;
    font-size:calc(12px * var(--s));
    opacity:0.55;
    text-align:center;
    margin-top:14px;
  }

  /* Quiz */
  .quiz-q{
    background:var(--white);
    border-radius:14px;
    padding:calc(22px * var(--s)) calc(20px * var(--s));
    box-shadow:0 8px 18px rgba(74,55,40,0.10);
    text-align:center;
    margin-bottom:16px;
  }
  .quiz-q-label{
    font-family:'Gaegu', sans-serif;
    font-size:calc(11px * var(--s));
    opacity:0.5;
    margin-bottom:8px;
  }
  .quiz-q-word{
    font-family:'Gaegu', sans-serif;
    font-size:calc(26px * var(--s));
    font-weight:700;
  }
  .quiz-q-ko{
    font-weight:700;
    font-size:calc(17px * var(--s));
    color:var(--coral);
    margin:8px 0 16px;
    line-height:1.5;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:calc(14px * var(--s)) calc(16px * var(--s));
    margin-bottom:10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:calc(15px * var(--s));
    font-family:'Gowun Dodum', sans-serif;
    cursor:pointer;
    color:var(--ink);
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .option:active:not(:disabled){ transform:scale(0.97); }
  .option.correct{ border-color:var(--green); background:#EAF4EE; }
  .option.wrong{ border-color:var(--coral); background:#FBEBE7; }
  .option:disabled{ cursor:default; }
  .match-btn{
    font-size:calc(13px * var(--s));
    padding:calc(12px * var(--s)) calc(10px * var(--s));
    text-align:center;
  }
  .match-btn.selected-match{
    border-color:var(--teal);
    background:#EAF3F1;
  }
  .speak-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:calc(34px * var(--s));
    height:calc(34px * var(--s));
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:calc(16px * var(--s));
    cursor:pointer;
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .speak-btn:active{ transform:scale(0.88); }

  .quiz-score{
    text-align:center;
    font-family:'Gaegu', sans-serif;
    font-size:calc(13px * var(--s));
    opacity:0.6;
    margin-bottom:16px;
  }

  /* Word list manage */
  .form-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  input[type=text], select{
    padding:calc(12px * var(--s)) calc(14px * var(--s));
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:calc(15px * var(--s));
    font-family:'Gowun Dodum', sans-serif;
    background:var(--white);
    color:var(--ink);
  }
  input[type=text]:focus, select:focus{ outline:2px solid var(--teal); }
  label{ font-size:calc(12px * var(--s)); opacity:0.6; }

  .word-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(12px * var(--s)) calc(14px * var(--s));
    background:var(--white);
    border-radius:10px;
    margin-bottom:8px;
    border:1px solid var(--line);
  }
  .word-item-text{ font-size:calc(14px * var(--s)); }
  .word-item-en{ font-weight:700; }
  .word-item-ko{ opacity:0.6; margin-left:6px; }
  .del-btn{
    background:none;
    border:none;
    color:var(--coral);
    font-size:calc(13px * var(--s));
    cursor:pointer;
    font-family:'Gowun Dodum', sans-serif;
  }

  /* Stats */
  .stat-card{
    background:var(--white);
    border-radius:12px;
    padding:calc(16px * var(--s)) calc(18px * var(--s));
    margin-bottom:10px;
    border:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .stat-name{ font-size:calc(14px * var(--s)); font-weight:700; }
  .stat-detail{ font-size:calc(12px * var(--s)); opacity:0.55; margin-top:2px; }

  .home-hello{font-family:'Gaegu',sans-serif;font-size:calc(25px * var(--s));font-weight:700;margin-bottom:4px;}
  .home-date{font-size:calc(13px * var(--s));opacity:.58;margin-bottom:16px;}
  .today-card{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:calc(18px * var(--s));box-shadow:0 8px 22px rgba(74,55,40,.09);}
  .today-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
  .today-title{font-family:'Gaegu',sans-serif;font-size:calc(20px * var(--s));font-weight:700;}
  .today-time{font-size:calc(12px * var(--s));color:var(--teal-deep);font-weight:700;background:rgba(111,174,92,.13);padding:5px 9px;border-radius:999px;white-space:nowrap;}
  .today-item{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px dashed var(--line);font-size:calc(14px * var(--s));}
  .today-item:first-of-type{border-top:0;}
  .today-count{font-family:'Gaegu',sans-serif;font-size:calc(16px * var(--s));font-weight:700;color:var(--teal-deep);}
  .today-progress{height:9px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin:15px 0 17px;}
  .today-progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:inherit;transition:width .25s;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .mini-card{background:rgba(255,251,242,.78);border:1.5px solid var(--line);border-radius:14px;padding:14px;}
  .mini-label{font-size:calc(12px * var(--s));opacity:.6;margin-bottom:5px;}
  .mini-value{font-family:'Gaegu',sans-serif;font-size:calc(18px * var(--s));font-weight:700;}
  .mastery-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .session-step{font-size:calc(13px * var(--s));font-weight:700;color:var(--teal-deep);margin-bottom:10px;}
  .security-card{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .role-badge{font-size:calc(11px * var(--s));padding:3px 7px;border-radius:999px;background:rgba(244,199,102,.28);margin-left:5px;}
  .pos-tag{font-family:'Gaegu', sans-serif;font-size:calc(12px * var(--s));font-weight:700;padding:2px 9px;border-radius:999px;display:inline-block;margin:4px 0;}
  .sync-note{font-size:calc(12px * var(--s));opacity:.58;line-height:1.6;margin-top:8px;}
  .family-hero{background:linear-gradient(145deg,#3F7440,#78B665);color:var(--white);border-radius:18px;padding:calc(18px * var(--s));box-shadow:0 10px 24px rgba(63,116,64,.2);}
  .family-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .family-tree{font-size:calc(42px * var(--s));line-height:1;}
  .mission-bar{height:12px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin:14px 0 7px;}
  .mission-bar>span{display:block;height:100%;background:var(--amber);border-radius:inherit;transition:width .3s;}
  .rank-list{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .rank-row{display:grid;grid-template-columns:34px 42px 1fr auto;align-items:center;gap:9px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:12px;}
  .rank-row.me{border-color:var(--teal);box-shadow:0 5px 14px rgba(76,122,62,.11);}
  .rank-no{font-family:'Gaegu',sans-serif;font-size:calc(19px * var(--s));font-weight:700;text-align:center;}
  .rank-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);font-size:21px;}
  .rank-name{font-size:calc(14px * var(--s));font-weight:700;}
  .rank-meta{font-size:calc(11px * var(--s));opacity:.58;margin-top:2px;}
  .rank-score{font-family:'Gaegu',sans-serif;font-size:calc(16px * var(--s));font-weight:700;color:var(--teal-deep);text-align:right;}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 18px;}
  .week-day{text-align:center;font-size:calc(11px * var(--s));opacity:.64;}
  .day-mark{width:31px;height:31px;margin:6px auto 0;border-radius:10px;display:grid;place-items:center;background:var(--paper-2);font-size:15px;}
  .day-mark.done{background:var(--teal);color:var(--white);}
  .day-mark.today{outline:2px solid var(--amber);outline-offset:2px;}
  .trend-row{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:calc(12px * var(--s));}
  .trend-bar{height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden;}
  .trend-bar>span{display:block;height:100%;background:var(--teal);border-radius:inherit;}
  .course-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .course-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-family:'Gowun Dodum',sans-serif;transition:transform .18s,border-color .18s;}
  .course-card:active{transform:scale(.97);}
  .course-card:hover{border-color:var(--teal);}
  .course-emoji{font-size:30px;margin-bottom:7px;}
  .course-name{font-family:'Gaegu',sans-serif;font-size:calc(17px * var(--s));font-weight:700;}
  .course-meta{font-size:calc(11px * var(--s));opacity:.6;margin-top:3px;}
  .course-bar{height:7px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin-top:10px;}
  .course-bar>span{display:block;height:100%;background:var(--teal);border-radius:inherit;}
  .study-toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .study-toolbar .btn{padding:9px 8px;font-size:calc(12px * var(--s));}
  .difficulty-badge{display:inline-block;font-size:calc(11px * var(--s));padding:4px 8px;border-radius:999px;background:rgba(244,199,102,.24);margin-right:5px;}
  .shadow-compare{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:15px;margin-top:12px;line-height:1.6;}
  .shadow-label{font-size:calc(11px * var(--s));opacity:.55;margin-bottom:3px;}
  .growth-hero{background:linear-gradient(145deg,#FFF7DD,#E8F4E2);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin-bottom:14px;}
  .growth-avatar{width:72px;height:72px;border-radius:24px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:44px;box-shadow:0 8px 18px rgba(74,55,40,.1);}
  .growth-title{font-family:'Gaegu',sans-serif;font-size:calc(20px * var(--s));font-weight:700;color:var(--teal-deep);}
  .growth-track{height:9px;background:rgba(74,55,40,.1);border-radius:999px;overflow:hidden;margin:9px 0 5px;}
  .growth-track>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amber),var(--green));}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .badge-card{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;min-height:92px;}
  .badge-card.locked{filter:grayscale(1);opacity:.42;}
  .badge-icon{font-size:29px;line-height:1.15;}
  .badge-name{font-family:'Gaegu',sans-serif;font-size:calc(13px * var(--s));font-weight:700;margin-top:5px;}
  .badge-desc{font-size:calc(9px * var(--s));opacity:.58;margin-top:2px;line-height:1.35;}
  .collection-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px;}
  .collection-slot{border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;background:var(--paper-2);}
  .collection-slot.unlocked{border-width:2px;}
  .collection-emoji{font-size:calc(24px * var(--s)); line-height:1.1;}
  .collection-slot:not(.unlocked) .collection-emoji{opacity:.35;}
  .collection-name{font-family:'Gaegu',sans-serif;font-size:calc(10px * var(--s));font-weight:700;margin-top:4px;opacity:.85;}
  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px;}
  .report-metric{background:var(--paper-2);border-radius:13px;padding:12px;}
  .report-metric strong{display:block;font-family:'Gaegu',sans-serif;font-size:calc(21px * var(--s));color:var(--teal-deep);margin-top:3px;}
  .recommend-card{background:linear-gradient(135deg,#EEF6E9,#FFF8E7);border:1.5px solid var(--line);border-radius:16px;padding:15px;margin-bottom:18px;}
  .village-row{display:flex;justify-content:center;align-items:flex-end;gap:8px;font-size:34px;min-height:62px;margin:12px 0 3px;}
  .character-picker{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px;}
  .character-choice{width:39px;height:39px;border-radius:13px;border:1.5px solid var(--line);background:var(--white);font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0;}
  .character-choice.selected{border-color:var(--teal);background:#EAF4E6;box-shadow:0 0 0 2px rgba(76,122,62,.13);}
  .member-character{font-size:18px;margin-right:3px;vertical-align:-1px;}
  .stat-num{
    font-family:'Gaegu', sans-serif;
    font-size:calc(16px * var(--s));
    font-weight:700;
  }
  .stat-num.good{ color:var(--green); }
  .stat-num.bad{ color:var(--coral); }

  .section-title{
    font-family:'Gaegu', sans-serif;
    font-size:calc(18px * var(--s));
    font-weight:700;
    margin:0 0 14px;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--teal-deep);
    color:var(--white);
    padding:calc(10px * var(--s)) calc(18px * var(--s));
    border-radius:999px;
    font-size:calc(13px * var(--s));
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:50;
  }
  .toast.show{ opacity:1; }
  .confetti-piece{
    position:fixed;
    top:-24px;
    pointer-events:none;
    z-index:999;
    animation-name:confetti-fall;
    animation-timing-function:cubic-bezier(.25,.46,.45,.94);
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) rotate(600deg); opacity:0; }
  }
  .combo-widget{
    position:fixed;
    bottom:calc(86px * var(--s));
    right:calc(16px * var(--s));
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    border-radius:999px;
    padding:calc(6px * var(--s)) calc(13px * var(--s));
    box-shadow:0 6px 16px rgba(74,55,40,0.2);
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    z-index:60;
    opacity:0;
    transform:scale(0.7);
    transition:opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  .combo-widget.show{ opacity:1; transform:scale(1); }
  .combo-widget #comboChar{ font-size:calc(22px * var(--s)); display:inline-block; line-height:1; }
  .combo-widget #comboCount{ font-size:calc(14px * var(--s)); color:var(--coral); display:none; }
  .combo-widget.bounce #comboChar{ animation: combo-bounce 0.5s ease; }
  .combo-widget.wobble #comboChar{ animation: combo-wobble 0.4s ease; }
  @keyframes combo-bounce{
    0%{ transform:translateY(0) scale(1); }
    30%{ transform:translateY(-9px) scale(1.2); }
    55%{ transform:translateY(0) scale(0.95); }
    75%{ transform:translateY(-3px) scale(1.05); }
    100%{ transform:translateY(0) scale(1); }
  }
  @keyframes combo-wobble{
    0%,100%{ transform:rotate(0); }
    25%{ transform:rotate(-14deg); }
    75%{ transform:rotate(14deg); }
  }
  .pet-hopping{ animation: pet-hop 0.42s ease-in-out infinite; }
  @keyframes pet-hop{
    0%{ transform:translateY(0) scaleY(1) scaleX(1); }
    35%{ transform:translateY(-32%) scaleY(1.08) scaleX(0.94); }
    55%{ transform:translateY(-32%) scaleY(1.08) scaleX(0.94); }
    100%{ transform:translateY(0) scaleY(0.92) scaleX(1.05); }
  }
  .pet-walking{ animation: pet-walk 0.5s ease-in-out infinite; }
  @keyframes pet-walk{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-6%) rotate(-3deg); }
    75%{ transform:translateY(-6%) rotate(3deg); }
  }
  .pet-idle-wobble{ animation: pet-idle-wobble 1.1s ease-in-out infinite; }
  @keyframes pet-idle-wobble{
    0%,100%{ transform:translateY(0) rotate(0deg) scaleY(1); }
    50%{ transform:translateY(-4%) rotate(-4deg) scaleY(1.03); }
  }

  /* ===== 반응형 ===== */
  /* 아주 작은 화면(구형 소형폰 등)에서는 살짝만 축소 */
  @media (max-width:359px){
    :root{ --s:1.03; }
    .content{ padding-left:12px; padding-right:12px; }
  }

  /* 태블릿/데스크톱 공통: 화면 가운데 카드 형태로 띄우고, 내부는 스크롤 */
  @media (min-width:560px){
    body{
      padding:32px 16px;
    }
    .app{
      width:100%;
      min-height:calc(100vh - 64px);
      border-radius:28px;
      box-shadow:0 24px 60px rgba(74,55,40,0.18);
      overflow:hidden;
    }
    .content{ overflow-y:auto; }
    .board{ border-radius:0; }
  }
  /* 태블릿: 화면이 커지는 만큼 전체적으로 커짐 */
  @media (min-width:560px) and (max-width:899px){
    :root{ --s:1.29; }
    .app{ max-width:560px; height:calc(100vh - 64px); }
  }
  /* 작은 데스크톱 */
  @media (min-width:900px) and (max-width:1199px){
    :root{ --s:1.46; }
    .app{ max-width:660px; height:calc(100vh - 64px); }
  }
  /* 큰 데스크톱 모니터 */
  @media (min-width:1200px){
    :root{ --s:1.62; }
    .app{ max-width:740px; height:calc(100vh - 64px); }
  }
</style>
</head>
<body>
<div class="bg-deco" style="top:6%; left:3%; font-size:46px;">🍃</div>
<div class="bg-deco" style="top:16%; right:2%; font-size:54px;">☁️</div>
<div class="bg-deco" style="bottom:22%; left:2%; font-size:50px;">🌿</div>
<div class="bg-deco" style="bottom:8%; right:5%; font-size:42px;">☁️</div>
<div class="bg-deco" style="top:48%; right:-2%; font-size:38px;">🍀</div>
<div class="app">
  <div class="board" id="boardHeader">
    <p class="board-title">🦊 가족 영어 학습장</p>
    <p class="board-sub">가족 영어 단어 · 회화 암기</p>
  </div>

  <div class="passenger-row" id="passengerRow">
    <div class="passenger-label">가족 선택</div>
  </div>

  <div class="tabs">

function computeStreak(history){
  let cursor=new Date();cursor.setHours(0,0,0,0);
  if(!dayActivity(history?.[dateKey(cursor)])){cursor.setDate(cursor.getDate()-1);}
  let streak=0;
  for(let i=0;i<400;i++){if(!dayActivity(history?.[dateKey(cursor)]))break;streak++;cursor.setDate(cursor.getDate()-1);}
  return streak;
}

const PET_STAGE_THRESHOLDS = [
  {stage:1, min:0, label:'알'},
  {stage:2, min:3, label:'아기'},
  {stage:3, min:7, label:'어린이'},
  {stage:4, min:14, label:'청소년'},
  {stage:5, min:30, label:'완전체'},
];
function petStageFromStreak(streakDays){
  let stage = 1;
  PET_STAGE_THRESHOLDS.forEach(t=>{ if(streakDays >= t.min) stage = t.stage; });
  return stage;
}
function computeGrowthStatus(history){
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  let daysSinceActive = 0;
  const searchCursor = new Date(cursor);
  while(daysSinceActive <= 400 && !dayActivity(history?.[dateKey(searchCursor)])){
    daysSinceActive++;
    searchCursor.setDate(searchCursor.getDate()-1);
  }
  let streak = 0;
  const streakCursor = new Date(searchCursor);
  for(let i=0;i<400;i++){
    if(!dayActivity(history?.[dateKey(streakCursor)])) break;
    streak++;
    streakCursor.setDate(streakCursor.getDate()-1);
  }
  const reset = daysSinceActive > 5;
  const sickDay = (!reset && daysSinceActive>=1) ? daysSinceActive : 0;
  const effectiveStreak = reset ? 0 : streak;
  const stage = petStageFromStreak(effectiveStreak);
  const stageInfo = PET_STAGE_THRESHOLDS.find(t=>t.stage===stage);
  return {stage, stageLabel: stageInfo.label, streak: effectiveStreak, sickDay, reset};
}

function computeBestStreak(history){
  const keys=Object.keys(history||{}).filter(k=>dayActivity(history[k])>0).sort();let best=0,current=0,previous=null;

  return best;
}

const hasWidgetStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key, shared){
  if(hasWidgetStorage){
    try{ return await window.storage.get(key, shared); }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem('fea:' + key);
    return raw !== null ? {key, value: raw, shared} : null;
  }catch(e){ return null; }
}

async function storageSet(key, value, shared){
  if(hasWidgetStorage){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.setItem('fea:' + key, value);
    return {key, value, shared};
  }catch(e){ return null; }
}

function memberFingerprint(list){
  return JSON.stringify((list||[]).map(m=>({name:m.name,role:m.role,character:m.character,pinHash:m.pinHash||null,pinSalt:m.pinSalt||null})).sort((a,b)=>a.name.localeCompare(b.name,'ko')));

function randomSalt(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPin(pin, salt){
  const input = new TextEncoder().encode(salt + ':' + pin);
  if(crypto.subtle){
    const digest = await crypto.subtle.digest('SHA-256', input);
    return Array.from(new Uint8Array(digest), b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h = 2166136261;
  input.forEach(b=>{ h ^= b; h = Math.imul(h, 16777619); });
  return 'legacy-' + (h >>> 0).toString(16);
}
async function setMemberPin(member, pin){
  member.pinSalt = randomSalt();
  member.pinHash = await hashPin(pin, member.pinSalt);
  delete member.pin;
}
async function verifyMemberPin(member, pin){
  if(member.pinHash && member.pinSalt) return (await hashPin(pin, member.pinSalt)) === member.pinHash;
  if(member.pin && member.pin === pin){
    await setMemberPin(member, pin);
    await saveMembers();
    return true;
  }
  return !member.pinHash && !member.pin && !pin;
}

function inferConversationMeta(word,index){
  const w=Object.assign({},word);
  if(!w.category){
    if(index<=10) w.category='greeting';
    else if(index<=16) w.category='food';
    else if(index<=21) w.category='shopping';
    else if(index<=25 || (index>=57&&index<=60)) w.category='travel';
    else if(index>=36&&index<=40) w.category='family';
    else if(index>=46&&index<=49) w.category='school';
    else if(index>=54&&index<=56) w.category='health';
    else w.category='daily';
    const en=(w.en||'').toLowerCase();
    if(/restaurant|reservation|seat taken|wallet|show me the way|watch your step/.test(en)) w.category='travel';
    if(/allergic|headache|feel better|take care of yourself/.test(en)) w.category='health';
    if(/bill|treat today|it's on me/.test(en)) w.category='food';
    if(/phone|call you|text you/.test(en)) w.category='daily';
  }
  if(!w.difficulty){
    const count=(w.en||'').trim().split(/\s+/).filter(Boolean).length;
    w.difficulty=count<=4?'basic':count<=7?'daily':'advanced';
  }
  return w;
}

  {id:"gm2",level:1,title:"인칭대명사 (I/you/he/she)",explain:"사람이나 사물을 가리키는 말이에요. 나=I, 너=you, 그=he, 그녀=she, 그것=it.",examples:[{en:"He is my brother.",ko:"그는 내 형이다."},{en:"It is a cat.",ko:"그것은 고양이다."}],practice:[{q:"___ is my mother.",options:["She","Her","He's","Its"],answer:"She"},{q:"___ am reading a book.",options:["I","Me","My","I'm not"],answer:"I"}]},
  {id:"gm3",level:1,title:"지시대명사 (this/that)",explain:"가까운 것은 this(이것), 먼 것은 that(저것)을 써요. 복수는 these/those예요.",examples:[{en:"This is my bag.",ko:"이것은 내 가방이다."},{en:"Those are birds.",ko:"저것들은 새들이다."}],practice:[{q:"___ is my pencil.",options:["This","These","Those","They"],answer:"This"},{q:"___ are my shoes.",options:["This","That","These","It"],answer:"These"}]},
  {id:"gm4",level:1,title:"명사의 복수형",explain:"대부분 -s를 붙이지만, -s/-x/-ch/-sh로 끝나면 -es, 자음+y는 y를 i로 바꾸고 -es를 붙여요.",examples:[{en:"I have two dogs.",ko:"나는 개 두 마리가 있다."},{en:"There are five boxes.",ko:"상자가 다섯 개 있다."}],practice:[{q:"I have three ___.",options:["book","books","bookes","bookies"],answer:"books"},{q:"She has two ___.",options:["baby","babys","babies","babes"],answer:"babies"}]},
  {id:"gm5",level:1,title:"관사 (a/an/the)",explain:"처음 말하는 하나는 a/an(모음 앞엔 an), 이미 말했거나 특정한 것은 the를 써요.",examples:[{en:"I saw a dog.",ko:"나는 개 한 마리를 보았다."},{en:"The dog was cute.",ko:"그 개는 귀여웠다."}],practice:[{q:"I ate ___ apple.",options:["a","an","the","-"],answer:"an"},{q:"Close ___ door, please.",options:["a","an","the","-"],answer:"the"}]},
  {id:"gm6",level:1,title:"일반동사 현재형",explain:"I/you/we/they 뒤에는 동사원형을 그대로 써요. 좋아하다=like, 가다=go.",examples:[{en:"I like pizza.",ko:"나는 피자를 좋아한다."},{en:"They go to school.",ko:"그들은 학교에 간다."}],practice:[{q:"I ___ soccer every day.",options:["play","plays","played","playing"],answer:"play"},{q:"We ___ English.",options:["study","studies","studied","studying"],answer:"study"}]},
  {id:"gm7",level:1,title:"3인칭 단수 동사 (-s)",explain:"주어가 He/She/It일 때는 동사에 -s나 -es를 붙여요.",examples:[{en:"She likes music.",ko:"그녀는 음악을 좋아한다."},{en:"He watches TV.",ko:"그는 TV를 본다."}],practice:[{q:"He ___ to school by bus.",options:["go","goes","going","gone"],answer:"goes"},{q:"It ___ every morning.",options:["rain","rains","raining","rained"],answer:"rains"}]},
  {id:"gm8",level:1,title:"소유격 (my/your/his)",explain:"누구의 것인지 나타내는 말이에요. 나의=my, 너의=your, 그의=his, 그녀의=her.",examples:[{en:"This is my book.",ko:"이것은 나의 책이다."},{en:"That is her cat.",ko:"저것은 그녀의 고양이다."}],practice:[{q:"This is ___ car.",options:["I","me","my","mine"],answer:"my"},{q:"Is that ___ dog?",options:["he","his","him","he's"],answer:"his"}]},
  {id:"gm9",level:1,title:"There is / There are",explain:"무언가 있다고 말할 때 써요. 하나면 There is, 여럿이면 There are.",examples:[{en:"There is a cat on the sofa.",ko:"소파 위에 고양이가 있다."},{en:"There are three books.",ko:"책이 세 권 있다."}],practice:[{q:"___ a pen on the desk.",options:["There is","There are","It is","They are"],answer:"There is"},{q:"___ many students in the room.",options:["There is","There are","It is","This is"],answer:"There are"}]},
  {id:"gm10",level:1,title:"의문문 기본 (Do/Are)",explain:"일반동사 질문은 Do/Does로, be동사 질문은 Am/Is/Are로 문장을 시작해요.",examples:[{en:"Do you like apples?",ko:"너는 사과를 좋아하니?"},{en:"Is she your sister?",ko:"그녀는 네 여동생이니?"}],practice:[{q:"___ you like coffee?",options:["Do","Does","Are","Is"],answer:"Do"},{q:"___ he a doctor?",options:["Do","Does","Is","Are"],answer:"Is"}]},
  {id:"gm11",level:2,title:"현재진행형 (be + -ing)",explain:"지금 하고 있는 일을 말할 때 써요. am/is/are + 동사ing.",examples:[{en:"I am eating lunch.",ko:"나는 점심을 먹고 있다."},{en:"They are playing soccer.",ko:"그들은 축구를 하고 있다."}],practice:[{q:"She ___ studying now.",options:["is","are","am","be"],answer:"is"},{q:"We ___ watching a movie.",options:["is","am","are","be"],answer:"are"}]},
  {id:"gm12",level:2,title:"과거형 (규칙동사 -ed)",explain:"동사에 -ed를 붙여 과거를 나타내요. 발음/철자 규칙에 주의해요.",examples:[{en:"I played soccer yesterday.",ko:"나는 어제 축구를 했다."},{en:"She studied hard.",ko:"그녀는 열심히 공부했다."}],practice:[{q:"I ___ TV last night.",options:["watch","watched","watches","watching"],answer:"watched"},{q:"He ___ his room.",options:["clean","cleaned","cleans","cleaning"],answer:"cleaned"}]},
  {id:"gm13",level:2,title:"과거형 (불규칙동사)",explain:"go→went, eat→ate, see→saw처럼 형태가 완전히 바뀌는 동사들이 있어요, 외워야 해요.",examples:[{en:"I went to the park.",ko:"나는 공원에 갔다."},{en:"She saw a movie.",ko:"그녀는 영화를 보았다."}],practice:[{q:"I ___ breakfast at 7.",options:["eat","ate","eats","eaten"],answer:"ate"},{q:"He ___ to bed early.",options:["go","went","goes","going"],answer:"went"}]},
  {id:"gm14",level:2,title:"미래형 (will / be going to)",explain:"앞으로 할 일은 will이나 be going to로 나타내요.",examples:[{en:"I will call you tomorrow.",ko:"내일 전화할게."},{en:"She is going to visit Paris.",ko:"그녀는 파리를 방문할 예정이다."}],practice:[{q:"I ___ help you.",options:["will","would","am","was"],answer:"will"},{q:"We ___ going to travel.",options:["is","am","are","be"],answer:"are"}]},
  {id:"gm15",level:2,title:"조동사 can",explain:"~할 수 있다는 능력이나 허락을 나타내요. can 뒤에는 동사원형을 써요.",examples:[{en:"I can swim.",ko:"나는 수영할 수 있다."},{en:"Can I go out?",ko:"나가도 될까요?"}],practice:[{q:"She ___ speak English.",options:["can","cans","canned","could not"],answer:"can"},{q:"___ you help me?",options:["Can","Cans","Can't","Could not"],answer:"Can"}]},
  {id:"gm16",level:2,title:"형용사와 부사",explain:"형용사는 명사를 꾸미고, 부사는 동사·형용사를 꾸며요. 부사는 보통 형용사+ly.",examples:[{en:"She is a fast runner.",ko:"그녀는 빠른 주자다."},{en:"She runs fast.",ko:"그녀는 빨리 달린다."}],practice:[{q:"He is a ___ student.",options:["careful","carefully","care","cared"],answer:"careful"},{q:"He drives ___.",options:["careful","carefully","care","cared"],answer:"carefully"}]},
  {id:"gm17",level:2,title:"비교급 (-er / more)",explain:"짧은 단어는 -er, 긴 단어는 more를 붙여서 '더 ~한'을 표현해요.",examples:[{en:"This book is bigger than that one.",ko:"이 책이 저것보다 더 크다."},{en:"She is more careful than him.",ko:"그녀가 그보다 더 신중하다."}],practice:[{q:"This is ___ than that.",options:["big","bigger","biggest","more big"],answer:"bigger"},{q:"Math is ___ than art for me.",options:["difficult","difficulter","more difficult","most difficult"],answer:"more difficult"}]},
  {id:"gm18",level:2,title:"최상급 (-est / most)",explain:"셋 이상 중 '가장 ~한'을 나타낼 때 -est나 most를 붙이고 the를 함께 써요.",examples:[{en:"He is the tallest in class.",ko:"그는 반에서 가장 키가 크다."},{en:"It's the most exciting movie.",ko:"가장 신나는 영화다."}],practice:[{q:"She is the ___ in her family.",options:["tall","taller","tallest","more tall"],answer:"tallest"},{q:"This is the ___ question.",options:["difficult","more difficult","most difficult","difficultest"],answer:"most difficult"}]},
  {id:"gm19",level:2,title:"전치사 (in/on/at)",explain:"장소·시간을 나타내요. 넓은 공간/월·년=in, 표면/요일·날짜=on, 좁은 지점/시각=at.",examples:[{en:"I live in Seoul.",ko:"나는 서울에 산다."},{en:"See you at 5 o'clock.",ko:"5시에 보자."}],practice:[{q:"The cat is ___ the table.",options:["in","on","at","to"],answer:"on"},{q:"I get up ___ 7 a.m.",options:["in","on","at","to"],answer:"at"}]},
  {id:"gm20",level:2,title:"빈도부사 (always/often/never)",explain:"얼마나 자주 하는지 나타내며, be동사 뒤/일반동사 앞에 위치해요.",examples:[{en:"I always brush my teeth.",ko:"나는 항상 이를 닦는다."},{en:"She is never late.",ko:"그녀는 절대 늦지 않는다."}],practice:[{q:"He ___ eats breakfast.",options:["always","is always","always is","be always"],answer:"always"},{q:"They ___ late for school.",options:["never are","are never","never","not never"],answer:"are never"}]},
  {id:"gm21",level:3,title:"의문사 (what/who/where/when/why/how)",explain:"구체적인 정보를 물을 때 문장 맨 앞에 써요.",examples:[{en:"What is your name?",ko:"네 이름이 뭐니?"},{en:"Where do you live?",ko:"어디에 사니?"}],practice:[{q:"___ is she? - She's my sister.",options:["What","Who","Where","When"],answer:"Who"},{q:"___ do you go to school? - By bus.",options:["What","Who","How","Why"],answer:"How"}]},
  {id:"gm22",level:3,title:"명령문",explain:"동사원형으로 시작해서 지시나 요청을 나타내요. 부정은 Don't를 앞에 붙여요.",examples:[{en:"Open the window.",ko:"창문을 열어라."},{en:"Don't be late.",ko:"늦지 마라."}],practice:[{q:"___ your hands before eating.",options:["Wash","Washes","Washing","Washed"],answer:"Wash"},{q:"___ touch that!",options:["Not","No","Don't","Doesn't"],answer:"Don't"}]},
  {id:"gm23",level:3,title:"부정문 총정리",explain:"be동사는 not만 붙이고, 일반동사는 don't/doesn't + 동사원형을 써요.",examples:[{en:"I am not tired.",ko:"나는 피곤하지 않다."},{en:"She doesn't like coffee.",ko:"그녀는 커피를 안 좋아한다."}],practice:[{q:"I ___ like spicy food.",options:["am not","don't","doesn't","not"],answer:"don't"},{q:"He ___ a doctor.",options:["isn't","doesn't","don't","not"],answer:"isn't"}]},
  {id:"gm24",level:3,title:"접속사 (and/but/or/so)",explain:"단어나 문장을 연결해요. and(그리고), but(그러나), or(또는), so(그래서).",examples:[{en:"I like tea and coffee.",ko:"나는 차와 커피를 좋아한다."},{en:"I was tired, so I slept.",ko:"피곤해서 잤다."}],practice:[{q:"I like apples ___ bananas.",options:["and","but","or","so"],answer:"and"},{q:"It was raining, ___ I stayed home.",options:["and","but","or","so"],answer:"so"}]},
  {id:"gm25",level:3,title:"가산명사 vs 불가산명사",explain:"셀 수 있는 명사는 단수/복수가 있고, 셀 수 없는 명사(물, 정보 등)는 항상 단수형이에요.",examples:[{en:"I need some water.",ko:"물이 좀 필요하다."},{en:"I have two apples.",ko:"사과 두 개가 있다."}],practice:[{q:"I need ___ information.",options:["a","an","some","many"],answer:"some"},{q:"She has ___ friends.",options:["much","a little","many","a lot of water"],answer:"many"}]},
  {id:"gm26",level:3,title:"some / any",explain:"긍정문에는 some, 부정문·의문문에는 any를 주로 써요.",examples:[{en:"I have some money.",ko:"나는 돈이 좀 있다."},{en:"Do you have any questions?",ko:"질문 있나요?"}],practice:[{q:"I don't have ___ time.",options:["some","any","much","many"],answer:"any"},{q:"Would you like ___ tea?",options:["some","any","no","not"],answer:"some"}]},
  {id:"gm27",level:3,title:"부가의문문",explain:"말한 내용을 확인할 때 문장 끝에 짧게 붙여요. 긍정문엔 부정으로, 부정문엔 긍정으로.",examples:[{en:"You are tired, aren't you?",ko:"너 피곤하지, 그렇지 않니?"},{en:"She isn't here, is she?",ko:"그녀는 여기 없지, 그렇지?"}],practice:[{q:"He can swim, ___?",options:["can he","can't he","does he","doesn't he"],answer:"can't he"},{q:"You don't like it, ___?",options:["do you","don't you","are you","aren't you"],answer:"do you"}]},
  {id:"gm28",level:3,title:"감탄문 (What/How)",explain:"What+명사, How+형용사/부사로 놀람이나 감탄을 나타내요.",examples:[{en:"What a beautiful day!",ko:"정말 아름다운 날이다!"},{en:"How kind you are!",ko:"너 정말 친절하구나!"}],practice:[{q:"___ a great idea!",options:["What","How","Who","When"],answer:"What"},{q:"___ fast he runs!",options:["What","How","Which","Whose"],answer:"How"}]},
  {id:"gm29",level:3,title:"동명사 기초 (동사+ing = ~하는 것)",explain:"동사에 -ing를 붙이면 '~하는 것'이라는 명사 역할을 해요.",examples:[{en:"Swimming is fun.",ko:"수영하는 것은 재밌다."},{en:"I enjoy reading books.",ko:"나는 책 읽는 것을 즐긴다."}],practice:[{q:"___ is my hobby.",options:["Cook","Cooking","Cooked","To cooking"],answer:"Cooking"},{q:"She likes ___ pictures.",options:["draw","draws","drawing","drew"],answer:"drawing"}]},
  {id:"gm30",level:3,title:"to부정사 기초 (to + 동사원형)",explain:"'~하는 것', '~하기 위해'라는 뜻으로 쓰이는 to+동사원형이에요.",examples:[{en:"I want to go home.",ko:"나는 집에 가고 싶다."},{en:"She studies to pass the exam.",ko:"그녀는 시험에 합격하기 위해 공부한다."}],practice:[{q:"I need ___ some rest.",options:["take","to take","taking","took"],answer:"to take"},{q:"He came here ___ me.",options:["help","to help","helping","helped"],answer:"to help"}]},
  {id:"gm31",level:4,title:"현재완료 - 경험 (have/has + p.p.)",explain:"지금까지의 경험을 나타내요. '~해 본 적이 있다'는 뜻으로 ever/never와 자주 써요.",examples:[{en:"I have been to Japan.",ko:"나는 일본에 가본 적이 있다."},{en:"She has never eaten sushi.",ko:"그녀는 초밥을 먹어본 적이 없다."}],practice:[{q:"I ___ seen that movie before.",options:["have","has","had","having"],answer:"have"},{q:"He ___ never visited Korea.",options:["have","has","had","having"],answer:"has"}]},
  {id:"gm32",level:4,title:"현재완료 - 계속/완료/결과",explain:"계속(since/for), 완료(just/already/yet), 결과 등 다양한 의미로 쓰여요.",examples:[{en:"I have lived here for 5 years.",ko:"나는 여기서 5년째 살고 있다."},{en:"She has just finished her homework.",ko:"그녀는 방금 숙제를 끝냈다."}],practice:[{q:"I have known him ___ 2020.",options:["for","since","during","from"],answer:"since"},{q:"We have lived here ___ ten years.",options:["for","since","ago","by"],answer:"for"}]},
  {id:"gm33",level:4,title:"조동사 must / should",explain:"must는 강한 의무(~해야 한다), should는 권유·충고(~하는 게 좋다)를 나타내요.",examples:[{en:"You must wear a seatbelt.",ko:"안전벨트를 매야 한다."},{en:"You should see a doctor.",ko:"병원에 가보는 게 좋겠다."}],practice:[{q:"Students ___ study hard.",options:["must","should not","don't","are"],answer:"must"},{q:"You ___ apologize to her.",options:["should","must not","doesn't","isn't"],answer:"should"}]},
  {id:"gm34",level:4,title:"to부정사의 3가지 용법",explain:"명사적(주어/목적어), 형용사적(명사 수식), 부사적(목적/이유) 용법이 있어요.",examples:[{en:"To learn English is fun. (명사적)",ko:"영어를 배우는 것은 재밌다."},{en:"I have a lot of work to do. (형용사적)",ko:"할 일이 많다."}],practice:[{q:"I have something ___ you.",options:["tell","to tell","telling","told"],answer:"to tell"},{q:"She was happy ___ the news.",options:["hear","to hear","hearing","heard"],answer:"to hear"}]},
  {id:"gm35",level:4,title:"동명사 vs to부정사",explain:"enjoy, finish, avoid 등은 동명사만, want, decide, hope 등은 to부정사만 목적어로 취해요.",examples:[{en:"I enjoy playing tennis.",ko:"나는 테니스 치는 것을 즐긴다."},{en:"I want to travel abroad.",ko:"나는 해외여행을 하고 싶다."}],practice:[{q:"She finished ___ her homework.",options:["do","to do","doing","did"],answer:"doing"},{q:"He decided ___ a new car.",options:["buy","to buy","buying","bought"],answer:"to buy"}]},
  {id:"gm36",level:4,title:"접속사 that절",explain:"that은 '~라는 것'이라는 뜻으로 문장 전체를 명사처럼 이끌어요. 생략 가능해요.",examples:[{en:"I think that she is right.",ko:"나는 그녀가 옳다고 생각한다."},{en:"I know he is honest.",ko:"나는 그가 정직하다는 것을 안다."}],practice:[{q:"I believe ___ you can do it.",options:["that","what","which","who"],answer:"that"},{q:"She said ___ she was tired.",options:["that","what","who","whose"],answer:"that"}]},
  {id:"gm37",level:4,title:"few / a few / little / a little",explain:"few/a few는 셀 수 있는 명사, little/a little은 셀 수 없는 명사에 써요. a가 없으면 부정적 의미.",examples:[{en:"I have a few friends.",ko:"친구가 몇 명 있다(긍정적)."},{en:"I have little time.",ko:"시간이 거의 없다(부정적)."}],practice:[{q:"I have ___ money left.",options:["few","a few","little","many"],answer:"little"},{q:"She has ___ books on the shelf.",options:["little","a little","few","much"],answer:"few"}]},
  {id:"gm38",level:4,title:"재귀대명사 (myself/yourself)",explain:"주어와 목적어가 같을 때 쓰는 '~자신'이라는 뜻의 대명사예요.",examples:[{en:"I hurt myself.",ko:"나는 내 자신을 다치게 했다."},{en:"She made it herself.",ko:"그녀는 그것을 직접 만들었다."}],practice:[{q:"He introduced ___ to us.",options:["him","his","himself","he"],answer:"himself"},{q:"Take care of ___.",options:["you","your","yourself","yours"],answer:"yourself"}]},
  {id:"gm39",level:4,title:"관계대명사 who / which",explain:"who는 사람, which는 사물·동물을 대신하며 앞의 명사(선행사)를 꾸며줘요.",examples:[{en:"I know the girl who lives next door.",ko:"나는 옆집에 사는 소녀를 안다."},{en:"This is the book which I bought.",ko:"이것은 내가 산 책이다."}],practice:[{q:"The man ___ called you is my uncle.",options:["who","which","whose","whom"],answer:"who"},{q:"I lost the pen ___ you gave me.",options:["who","which","whose","whom"],answer:"which"}]},
  {id:"gm40",level:4,title:"지각동사 (see/hear + 목적어 + 동사원형)",explain:"보다·듣다 등의 지각동사는 목적어 뒤에 동사원형이나 -ing를 써요.",examples:[{en:"I saw him cross the street.",ko:"나는 그가 길을 건너는 것을 보았다."},{en:"I heard her sing.",ko:"나는 그녀가 노래하는 것을 들었다."}],practice:[{q:"I saw him ___ the ball.",options:["kick","kicks","to kick","kicked"],answer:"kick"},{q:"She heard the birds ___.",options:["sing","sings","to sing","sang"],answer:"sing"}]},
  {id:"gm41",level:5,title:"수동태 (be + p.p.)",explain:"'~되다, ~당하다'는 뜻으로 be동사+과거분사로 만들며, 행위자는 by로 나타내요.",examples:[{en:"The window was broken by him.",ko:"창문이 그에 의해 깨졌다."},{en:"This song is loved by many people.",ko:"이 노래는 많은 사람들에게 사랑받는다."}],practice:[{q:"The cake ___ eaten by the kids.",options:["was","were","is","are"],answer:"was"},{q:"English ___ spoken all over the world.",options:["is","are","was","were"],answer:"is"}]},
  {id:"gm42",level:5,title:"관계대명사 that / whose",explain:"that은 who/which 대신 쓸 수 있고, whose는 소유격 관계대명사예요.",examples:[{en:"I have a friend whose father is a doctor.",ko:"나는 아버지가 의사인 친구가 있다."},{en:"This is the house that I live in.",ko:"이곳이 내가 사는 집이다."}],practice:[{q:"I know a girl ___ hobby is painting.",options:["who","which","whose","whom"],answer:"whose"},{q:"This is the movie ___ made me cry.",options:["who","that","whose","whom"],answer:"that"}]},
  {id:"gm43",level:5,title:"관계부사 (when/where/why)",explain:"시간(when), 장소(where), 이유(why)를 나타내는 절을 이끌며 「전치사+관계대명사」를 대신해요.",examples:[{en:"This is the place where I was born.",ko:"이곳이 내가 태어난 곳이다."},{en:"I remember the day when we first met.",ko:"우리가 처음 만난 날을 기억한다."}],practice:[{q:"Tell me the reason ___ you were late.",options:["when","where","why","which"],answer:"why"},{q:"This is the house ___ I grew up.",options:["when","where","why","which"],answer:"where"}]},
  {id:"gm44",level:5,title:"명사절 접속사 (that/whether/if)",explain:"'~인지 아닌지'는 whether/if, '~라는 것'은 that으로 명사절을 이끌어요.",examples:[{en:"I wonder if she will come.",ko:"그녀가 올지 궁금하다."},{en:"I don't know whether it is true.",ko:"그것이 사실인지 모르겠다."}],practice:[{q:"I'm not sure ___ he is right.",options:["that","whether","who","which"],answer:"whether"},{q:"She said ___ she was busy.",options:["that","if","whether","who"],answer:"that"}]},
  {id:"gm45",level:5,title:"부사절 접속사 (because/although/when)",explain:"이유(because), 양보(although), 시간(when) 등을 나타내는 절을 연결해요.",examples:[{en:"I stayed home because it rained.",ko:"비가 와서 집에 있었다."},{en:"Although he was tired, he kept working.",ko:"피곤했지만 계속 일했다."}],practice:[{q:"I was late ___ the traffic was bad.",options:["because","although","when","if"],answer:"because"},{q:"___ she is young, she is very wise.",options:["Because","Although","When","If"],answer:"Although"}]},
  {id:"gm46",level:5,title:"원급 비교 (as ~ as)",explain:"'~만큼 ~한'이라는 뜻으로 as와 as 사이에 형용사/부사 원형을 넣어요.",examples:[{en:"She is as tall as her brother.",ko:"그녀는 오빠만큼 키가 크다."},{en:"He runs as fast as a rabbit.",ko:"그는 토끼만큼 빨리 달린다."}],practice:[{q:"This bag is as ___ as that one.",options:["heavy","heavier","heaviest","more heavy"],answer:"heavy"},{q:"He is not as ___ as his sister.",options:["tall","taller","tallest","tall than"],answer:"tall"}]},
  {id:"gm47",level:5,title:"5형식 문장 (make/keep + 목적격보어)",explain:"목적어를 어떻게 만들거나 유지시키는지 나타내며, 목적격보어로 형용사가 와요.",examples:[{en:"This song makes me happy.",ko:"이 노래는 나를 행복하게 만든다."},{en:"Keep the room clean.",ko:"방을 깨끗하게 유지해라."}],practice:[{q:"The news made her ___.",options:["sad","sadly","sadness","to sad"],answer:"sad"},{q:"Please keep the door ___.",options:["open","opened","opening","to open"],answer:"open"}]},
  {id:"gm48",level:5,title:"감정을 나타내는 분사 (-ing/-ed)",explain:"감정을 일으키면 -ing(흥미로운), 감정을 느끼면 -ed(흥미를 느끼는)를 써요.",examples:[{en:"The movie was boring.",ko:"그 영화는 지루했다(영화가 지루하게 만듦)."},{en:"I was bored during the movie.",ko:"나는 영화 보는 동안 지루함을 느꼈다."}],practice:[{q:"The news was very ___.",options:["surprise","surprising","surprised","surprises"],answer:"surprising"},{q:"I was ___ to hear the news.",options:["surprise","surprising","surprised","surprises"],answer:"surprised"}]},
  {id:"gm49",level:5,title:"간접의문문",explain:"의문사가 있는 의문문이 다른 문장 속에 들어갈 때는 '의문사+주어+동사' 어순이 돼요.",examples:[{en:"I don't know what he wants.",ko:"나는 그가 무엇을 원하는지 모른다."},{en:"Tell me where you live.",ko:"네가 어디 사는지 말해줘."}],practice:[{q:"Do you know ___ she lives?",options:["where does","where","does she","she does"],answer:"where"},{q:"I wonder ___ he is.",options:["who is","who","is he","he is"],answer:"who"}]},
  {id:"gm50",level:5,title:"부정대명사 (one/another/other)",explain:"one(같은 종류의 하나), another(또 다른 하나), the other(나머지 하나)를 구분해서 써요.",examples:[{en:"I lost my pen. I need a new one.",ko:"펜을 잃어버렸다. 새 것이 필요하다."},{en:"I have two pens. One is red, the other is blue.",ko:"펜이 두 개 있다. 하나는 빨갛고 나머지는 파랗다."}],practice:[{q:"This shirt is too small. Show me a bigger ___.",options:["it","one","another","other"],answer:"one"},{q:"I have three cats. One is black, and the ___ two are white.",options:["another","other","others","the other"],answer:"other"}]},
  {id:"gm51",level:6,title:"사역동사 (make/have/let)",explain:"'~하게 시키다'는 뜻으로 목적어 뒤에 동사원형을 써요.",examples:[{en:"She made me clean the room.",ko:"그녀는 나에게 방을 청소하게 시켰다."},{en:"Let me help you.",ko:"제가 도와드리게 해주세요."}],practice:[{q:"My mom made me ___ my homework.",options:["do","did","to do","doing"],answer:"do"},{q:"Please let me ___ that.",options:["explain","explains","to explain","explained"],answer:"explain"}]},
  {id:"gm52",level:6,title:"간접의문문 심화",explain:"의문사가 없는 경우엔 if/whether를 써서 '~인지'를 나타내는 명사절을 만들어요.",examples:[{en:"Can you tell me if he is coming?",ko:"그가 오는지 말해줄 수 있니?"},{en:"I asked her whether she was okay.",ko:"나는 그녀에게 괜찮은지 물었다."}],practice:[{q:"I wonder ___ it will rain tomorrow.",options:["that","if","who","which"],answer:"if"},{q:"Do you know ___ she is married?",options:["that","whether","who","which"],answer:"whether"}]},
  {id:"gm53",level:6,title:"분사구문 (~하면서, ~해서)",explain:"접속사와 주어를 생략하고 동사를 -ing로 바꿔 문장을 간결하게 만들어요.",examples:[{en:"Walking down the street, I saw her.",ko:"길을 걷다가 그녀를 보았다."},{en:"Feeling tired, she went to bed early.",ko:"피곤해서 그녀는 일찍 잤다."}],practice:[{q:"___ his homework, he watched TV.",options:["Finish","Finishing","Finished","To finish"],answer:"Finishing"},{q:"___ in Korea, she speaks Korean well.",options:["Born","Bearing","Bore","To bear"],answer:"Born"}]},
  {id:"gm54",level:6,title:"가정법 과거 (If + 과거, would)",explain:"현재 사실과 반대되는 상상을 나타내요. If절엔 과거형, 주절엔 would/could+동사원형.",examples:[{en:"If I were rich, I would travel the world.",ko:"내가 부자라면 세계여행을 할 텐데."},{en:"If she knew, she would help.",ko:"그녀가 안다면 도와줄 텐데."}],practice:[{q:"If I ___ you, I would apologize.",options:["am","was","were","be"],answer:"were"},{q:"If he had time, he ___ come.",options:["will","would","can","must"],answer:"would"}]},
  {id:"gm55",level:6,title:"강조구문 (It is ~ that)",explain:"문장의 특정 부분을 강조할 때 It is/was ~ that 사이에 강조할 말을 넣어요.",examples:[{en:"It was John that broke the window.",ko:"창문을 깬 것은 바로 존이었다."},{en:"It is money that matters most.",ko:"가장 중요한 것은 바로 돈이다."}],practice:[{q:"It was ___ who called me last night.",options:["she","her","hers","herself"],answer:"she"},{q:"It ___ yesterday that I met him.",options:["is","was","be","being"],answer:"was"}]},
  {id:"gm56",level:6,title:"관계대명사 생략",explain:"목적격 관계대명사(who(m)/which/that)는 종종 생략할 수 있어요.",examples:[{en:"The book (that) I read was great.",ko:"내가 읽은 책은 훌륭했다."},{en:"The man (whom) I met was kind.",ko:"내가 만난 남자는 친절했다."}],practice:[{q:"The movie ___ we watched was fun.",options:["who","(생략 가능)","whose","-ing"],answer:"(생략 가능)"},{q:"She is the person ___ I trust most.",options:["whose","(생략 가능)","which is","what"],answer:"(생략 가능)"}]},
  {id:"gm57",level:6,title:"부정어 도치 (Never/Little)",explain:"부정어(Never, Little 등)가 문장 맨 앞에 오면 주어와 동사(조동사)가 도치돼요.",examples:[{en:"Never have I seen such a thing.",ko:"그런 것은 본 적이 없다."},{en:"Little did I know the truth.",ko:"진실을 거의 몰랐다."}],practice:[{q:"Never ___ I felt so happy.",options:["have","has","did","do"],answer:"have"},{q:"Rarely ___ she late for school.",options:["is","was","did","does"],answer:"is"}]},
  {id:"gm58",level:6,title:"관계대명사 what (~하는 것)",explain:"선행사를 포함한 관계대명사로 '~하는 것'이라는 뜻이며 the thing which와 같아요.",examples:[{en:"This is what I want.",ko:"이것이 내가 원하는 것이다."},{en:"I don't understand what he said.",ko:"나는 그가 말한 것을 이해 못 한다."}],practice:[{q:"___ she said surprised everyone.",options:["That","What","Which","Who"],answer:"What"},{q:"Tell me ___ happened.",options:["that","what","who","whose"],answer:"what"}]},
  {id:"gm59",level:6,title:"숙어 too ~ to / so ~ that",explain:"too+형용사+to는 '너무 ~해서 할 수 없다', so~that은 '너무 ~해서 ~하다'는 뜻이에요.",examples:[{en:"He is too young to drive.",ko:"그는 너무 어려서 운전할 수 없다."},{en:"She was so tired that she fell asleep.",ko:"너무 피곤해서 잠들었다."}],practice:[{q:"It was ___ cold to go outside.",options:["so","too","very","such"],answer:"too"},{q:"She was ___ happy that she cried.",options:["too","so","very much","such a"],answer:"so"}]},
  {id:"gm60",level:6,title:"동격의 콤마/of",explain:"명사를 콤마나 of로 부연 설명하는 것을 동격이라고 해요.",examples:[{en:"Seoul, the capital of Korea, is huge.",ko:"한국의 수도인 서울은 크다."},{en:"The fact that he lied surprised me.",ko:"그가 거짓말했다는 사실이 놀라웠다."}],practice:[{q:"My brother, ___ is a doctor, lives in Busan.",options:["who","whose","whom","that -"],answer:"who"},{q:"I heard the news ___ she passed the exam.",options:["which","that","who","whose"],answer:"that"}]},
  {id:"gm61",level:7,title:"시제일치",explain:"주절이 과거면 종속절도 대개 과거나 과거완료로 맞춰줘요.",examples:[{en:"She said that she was busy.",ko:"그녀는 바쁘다고 말했다."},{en:"I thought he had already left.",ko:"나는 그가 이미 떠났다고 생각했다."}],practice:[{q:"He said he ___ tired.",options:["is","was","be","being"],answer:"was"},{q:"She told me she ___ finished it already.",options:["has","have","had","having"],answer:"had"}]},
  {id:"gm62",level:7,title:"화법 전환 (직접화법→간접화법)",explain:"따옴표 속 말을 전달할 때 인칭·시제·부사를 바꿔줘요. said \"I am\" → said (that) she was.",examples:[{en:"He said, \"I am busy.\" → He said that he was busy.",ko:"그는 바쁘다고 말했다."},{en:"She said, \"I will go.\" → She said that she would go.",ko:"그녀는 가겠다고 말했다."}],practice:[{q:"She said, \"I like it.\" → She said that she ___ it.",options:["like","likes","liked","liking"],answer:"liked"},{q:"He said, \"I can help.\" → He said that he ___ help.",options:["can","could","will","would have"],answer:"could"}]},
  {id:"gm63",level:7,title:"병렬구조",explain:"and, or, but로 연결되는 요소들은 문법적으로 같은 형태여야 해요.",examples:[{en:"I like reading, writing, and swimming.",ko:"나는 읽기, 쓰기, 수영을 좋아한다."},{en:"She is smart and kind.",ko:"그녀는 똑똑하고 친절하다."}],practice:[{q:"I enjoy hiking, swimming, and ___.",options:["run","to run","ran","running"],answer:"running"},{q:"He is honest, diligent, and ___.",options:["kind","kindly","kindness","to kind"],answer:"kind"}]},
  {id:"gm64",level:7,title:"조동사 + have + p.p.",explain:"과거 사실에 대한 추측·후회를 나타내요. must have(~했음이 틀림없다), should have(~했어야 했는데).",examples:[{en:"He must have forgotten.",ko:"그는 잊어버린 게 틀림없다."},{en:"You should have told me.",ko:"나에게 말했어야 했는데."}],practice:[{q:"She ___ have missed the bus.",options:["must","should not","may","can"],answer:"must"},{q:"I ___ have studied harder.",options:["should","must not","can","are"],answer:"should"}]},
  {id:"gm65",level:7,title:"부정대명사 (each/every/all/most)",explain:"each/every는 단수 취급, all/most는 뒤 명사에 따라 단복수가 달라져요.",examples:[{en:"Each student has a book.",ko:"각 학생은 책이 있다."},{en:"All the students are here.",ko:"모든 학생이 여기 있다."}],practice:[{q:"Every student ___ a chance.",options:["have","has","having","had"],answer:"has"},{q:"Most of the water ___ gone.",options:["is","are","were","have"],answer:"is"}]},
  {id:"gm66",level:7,title:"재귀대명사 강조 용법",explain:"재귀대명사가 '직접, 스스로'라는 뜻으로 강조할 때 쓰이며 생략해도 문장이 성립해요.",examples:[{en:"I did it myself.",ko:"내가 직접 그것을 했다."},{en:"The president himself came.",ko:"대통령이 직접 왔다."}],practice:[{q:"She fixed the car ___.",options:["her","herself","hers","she"],answer:"herself"},{q:"The teacher ___ explained it.",options:["him","himself","his","he"],answer:"himself"}]},
  {id:"gm67",level:7,title:"도치 기초 (부사구 도치)",explain:"장소·방향의 부사구가 문두에 오면 주어와 동사의 순서가 바뀌기도 해요.",examples:[{en:"Here comes the bus.",ko:"버스가 온다."},{en:"Down came the rain.",ko:"비가 쏟아졌다."}],practice:[{q:"___ the bell.",options:["Here it comes","Here comes it","It comes here","Comes here it"],answer:"Here it comes"},{q:"There ___ a loud noise.",options:["was","were","did","has"],answer:"was"}]},
  {id:"gm68",level:7,title:"관계대명사 what 심화",explain:"what절이 주어/목적어/보어로 쓰이며 '~하는 것'을 나타내요, 완전한 문장이 아닌 불완전한 절이 뒤따라요.",examples:[{en:"What matters is your effort.",ko:"중요한 것은 너의 노력이다."},{en:"This is not what I ordered.",ko:"이것은 내가 주문한 것이 아니다."}],practice:[{q:"___ he needs is more time.",options:["That","What","Which","Who"],answer:"What"},{q:"I couldn't believe ___ I saw.",options:["that","what","who","whose"],answer:"what"}]},
  {id:"gm69",level:7,title:"생략구문",explain:"반복되는 어구는 문맥상 알 수 있으면 생략할 수 있어요.",examples:[{en:"She can swim, and I can (swim), too.",ko:"그녀는 수영할 수 있고, 나도 그렇다."},{en:"He wanted to go, but she didn't (want to go).",ko:"그는 가고 싶어했지만 그녀는 아니었다."}],practice:[{q:"I can drive, and so ___ she.",options:["can","does","is","do"],answer:"can"},{q:"He didn't finish, but I ___.",options:["did","do","was","am"],answer:"did"}]},
  {id:"gm70",level:7,title:"비교급 강조 (much/even/far)",explain:"비교급을 강조할 때 much, even, far, a lot 등을 비교급 앞에 써요 (very는 사용 불가).",examples:[{en:"This is much better than that.",ko:"이것이 저것보다 훨씬 낫다."},{en:"She is even taller than her dad.",ko:"그녀는 아빠보다도 더 크다."}],practice:[{q:"Today is ___ colder than yesterday.",options:["very","much","so","too"],answer:"much"},{q:"This test is ___ more difficult.",options:["very","far","so","too"],answer:"far"}]},
  {id:"gm71",level:8,title:"분사구문의 시제 (완료분사구문)",explain:"주절보다 먼저 일어난 일은 Having + p.p.로 나타내요.",examples:[{en:"Having finished his work, he went home.",ko:"일을 끝낸 후 그는 집에 갔다."},{en:"Having lived there, she knew the area well.",ko:"그곳에 살아봤기에 그녀는 그 지역을 잘 알았다."}],practice:[{q:"___ his homework, he went out to play.",options:["Finish","Finishing","Having finished","To finish"],answer:"Having finished"},{q:"___ never seen snow, she was excited.",options:["Have","Having","Has","To have"],answer:"Having"}]},
  {id:"gm72",level:8,title:"독립분사구문",explain:"분사구문의 주어가 주절의 주어와 다를 때는 분사 앞에 그 주어를 따로 써줘요.",examples:[{en:"It being cold, we stayed inside.",ko:"추워서 우리는 안에 있었다."},{en:"The sun having set, they went home.",ko:"해가 진 후 그들은 집에 갔다."}],practice:[{q:"___ raining, the game was canceled.",options:["It","It being","It was","Being"],answer:"It being"},{q:"Weather permitting, we ___ go hiking.",options:["will","would have","having","to"],answer:"will"}]},
  {id:"gm73",level:8,title:"with 분사구문 (부대상황)",explain:"'~한 채로'라는 동시상황을 with+명사+분사로 나타내요.",examples:[{en:"She sat with her eyes closed.",ko:"그녀는 눈을 감은 채 앉아있었다."},{en:"He spoke with his arms crossed.",ko:"그는 팔짱을 낀 채 말했다."}],practice:[{q:"He slept with the TV ___.",options:["on","turning on","turned on","to turn on"],answer:"on"},{q:"She stood with her arms ___.",options:["cross","crossing","crossed","to cross"],answer:"crossed"}]},
  {id:"gm74",level:8,title:"도치 심화 (부정어구+조동사)",explain:"Not only, Seldom, Hardly 같은 부정어구가 문두에 오면 도치가 일어나요.",examples:[{en:"Not only did he apologize, but he also helped.",ko:"그는 사과했을 뿐 아니라 도와주기도 했다."},{en:"Hardly had I arrived when it started to rain.",ko:"도착하자마자 비가 오기 시작했다."}],practice:[{q:"Not only ___ she smart, but also kind.",options:["is","was","did","does"],answer:"is"},{q:"Seldom ___ he complain.",options:["do","does","did","is"],answer:"does"}]},
  {id:"gm75",level:8,title:"생략구문 심화 (비교구문 생략)",explain:"비교구문(as~as, than)에서 반복되는 동사·명사는 생략되는 경우가 많아요.",examples:[{en:"She is taller than I (am).",ko:"그녀는 나보다 크다."},{en:"He works as hard as she (works).",ko:"그는 그녀만큼 열심히 일한다."}],practice:[{q:"He runs faster than I ___.",options:["do","am","was","does"],answer:"do"},{q:"She is as busy as he ___.",options:["is","do","was","does"],answer:"is"}]},
  {id:"gm76",level:8,title:"동격의 that절",explain:"fact, news, idea 등 추상명사 뒤에 that절이 와서 내용을 설명해줘요.",examples:[{en:"The fact that she won surprised us.",ko:"그녀가 이겼다는 사실이 우리를 놀라게 했다."},{en:"I have no idea that he is here.",ko:"그가 여기 있다는 걸 몰랐다."}],practice:[{q:"The news ___ he passed made her happy.",options:["which","that","who","what"],answer:"that"},{q:"There is no evidence ___ he lied.",options:["which","that","who","what"],answer:"that"}]},
  {id:"gm77",level:8,title:"계속적 용법의 관계대명사",explain:"콤마 뒤에 오는 관계대명사는 선행사에 대한 추가 설명을 하며, that은 쓸 수 없어요.",examples:[{en:"I met Tom, who was very kind.",ko:"나는 톰을 만났는데, 그는 매우 친절했다."},{en:"She gave me a book, which I loved.",ko:"그녀는 나에게 책을 줬는데, 나는 그것을 좋아했다."}],practice:[{q:"He has two sons, ___ are doctors.",options:["that","who","which","whom"],answer:"who"},{q:"I bought a car, ___ turned out to be faulty.",options:["that","which","who","whose"],answer:"which"}]},
  {id:"gm78",level:8,title:"so ~ that / such ~ that",explain:"so는 형용사/부사와, such는 명사(구)와 함께 써서 '너무 ~해서 ~하다'를 나타내요.",examples:[{en:"It was so hot that we stayed inside.",ko:"너무 더워서 우리는 안에 있었다."},{en:"It was such a hot day that we stayed inside.",ko:"너무 더운 날이라 우리는 안에 있었다."}],practice:[{q:"It was ___ good movie that I watched it twice.",options:["so","such a","so a","such"],answer:"such a"},{q:"She spoke ___ fast that I couldn't understand.",options:["so","such","such a","too"],answer:"so"}]},
  {id:"gm79",level:8,title:"복합관계사 (whoever/whatever)",explain:"'누구든지, 무엇이든지'라는 뜻으로 명사절이나 양보의 부사절을 이끌어요.",examples:[{en:"Whoever comes first can choose.",ko:"누구든 먼저 오는 사람이 고를 수 있다."},{en:"Whatever happens, I will support you.",ko:"무슨 일이 있어도 널 응원할게."}],practice:[{q:"___ wins the game will get a prize.",options:["Whoever","Whomever","Whatever","However"],answer:"Whoever"},{q:"___ hard it is, don't give up.",options:["Whatever","However","Whoever","Whichever"],answer:"However"}]},
  {id:"gm80",level:8,title:"가정법 미래 (if ~ should)",explain:"실현 가능성이 아주 낮은 미래의 일을 가정할 때 If + should를 써요.",examples:[{en:"If it should rain, we will cancel the picnic.",ko:"혹시 비가 오면 소풍을 취소할 것이다."},{en:"If he should call, tell him I'm out.",ko:"혹시 그가 전화하면 나 없다고 해줘."}],practice:[{q:"If it ___ rain tomorrow, we'll stay home.",options:["should","would","were","was"],answer:"should"},{q:"If she ___ change her mind, let me know.",options:["should","would","was","did"],answer:"should"}]},
  {id:"gm81",level:9,title:"가정법 도치 (Were/Had/Should)",explain:"if가 생략되면 주어와 동사(Were/Had/Should)의 순서가 바뀌어요.",examples:[{en:"Were I rich, I would travel.",ko:"내가 부자라면 여행할 텐데."},{en:"Had I known, I would have helped.",ko:"알았더라면 도와줬을 텐데."}],practice:[{q:"___ I you, I would apologize.",options:["Am","Was","Were","Be"],answer:"Were"},{q:"___ she studied harder, she would have passed.",options:["Did","Had","Was","Were"],answer:"Had"}]},
  {id:"gm82",level:9,title:"혼합가정법",explain:"과거의 조건이 현재에 영향을 미칠 때, if절은 과거완료, 주절은 현재형 조동사를 써요.",examples:[{en:"If I had studied harder, I would be a doctor now.",ko:"더 열심히 공부했다면 지금 의사일 텐데."},{en:"If she had left earlier, she would be here now.",ko:"일찍 떠났다면 지금 여기 있을 텐데."}],practice:[{q:"If he had saved money, he ___ rich now.",options:["would be","would have been","will be","was"],answer:"would be"},{q:"If I had taken that job, I ___ happier now.",options:["would have been","would be","will be","am"],answer:"would be"}]},
  {id:"gm83",level:9,title:"준동사 총정리 (부정/시제/의미상 주어)",explain:"to부정사·동명사·분사의 부정은 not을 앞에, 의미상 주어는 for/of+목적격으로 나타내요.",examples:[{en:"It is important for you to be honest.",ko:"네가 정직한 것이 중요하다."},{en:"It was kind of you to help.",ko:"도와줘서 친절했다."}],practice:[{q:"She told him ___ to be late.",options:["not","no","don't","never to"],answer:"not"},{q:"It is necessary ___ us to arrive early.",options:["for","of","to","by"],answer:"for"}]},
  {id:"gm84",level:9,title:"관계사 vs 접속사 구별",explain:"관계사 뒤는 불완전한 문장, 접속사(that 등) 뒤는 완전한 문장이 와요.",examples:[{en:"This is the book that I read. (관계대명사, 불완전)",ko:"이것은 내가 읽은 책이다."},{en:"I know that he is honest. (접속사, 완전)",ko:"나는 그가 정직하다는 것을 안다."}],practice:[{q:"I heard the news ___ she got married.",options:["which","that","who","whom"],answer:"that"},{q:"The pen ___ I lost was expensive.",options:["that","which(불완전)","that절 완전","both A and B"],answer:"which(불완전)"}]},
  {id:"gm85",level:9,title:"삽입구문",explain:"문장 중간에 부가 정보(I think, as it were 등)가 삽입돼 원래 문장 구조에 영향을 주지 않아요.",examples:[{en:"She is, I believe, the best candidate.",ko:"그녀는, 내가 믿기로는, 최고의 후보다."},{en:"The book, as you can see, is old.",ko:"이 책은, 보시다시피, 오래됐다."}],practice:[{q:"He is, ___ think, honest.",options:["I","that I","which I","who I"],answer:"I"},{q:"This, ___ we know, is true.",options:["as","that","which","what"],answer:"as"}]},
  {id:"gm86",level:9,title:"명사절 vs 형용사절 관계사",explain:"선행사가 있으면 관계대명사(형용사절), 선행사가 없고 '~하는 것'이면 what(명사절)을 써요.",examples:[{en:"I like the way that he speaks. (형용사절)",ko:"나는 그가 말하는 방식을 좋아한다."},{en:"What he said was true. (명사절)",ko:"그가 말한 것은 사실이었다."}],practice:[{q:"___ surprised me most was his honesty.",options:["That","What","Which","Who"],answer:"What"},{q:"This is the reason ___ she left.",options:["what","why","which is","how"],answer:"why"}]},
  {id:"gm87",level:9,title:"어순 도치 심화 (only+부사구)",explain:"Only+부사(구)가 문두에 오면 주어-동사가 도치돼요.",examples:[{en:"Only then did I realize the truth.",ko:"그때서야 나는 진실을 깨달았다."},{en:"Only after trying did she succeed.",ko:"시도한 후에야 그녀는 성공했다."}],practice:[{q:"Only later ___ he understand the problem.",options:["did","does","he did","was"],answer:"did"},{q:"Only by working hard ___ you succeed.",options:["can","you can","will","you will"],answer:"can"}]},
  {id:"gm88",level:9,title:"as의 다양한 용법",explain:"as는 시간(~할 때), 이유(~때문에), 양보(비록~), 비교(~처럼) 등 여러 뜻으로 쓰여요.",examples:[{en:"As I was walking, it began to rain. (시간)",ko:"걷고 있을 때 비가 오기 시작했다."},{en:"Young as he is, he is wise. (양보)",ko:"그는 어리지만 현명하다."}],practice:[{q:"___ she was tired, she kept working. (양보)",options:["As","Because","Though","So"],answer:"Though"},{q:"___ he grew older, he became wiser. (~함에 따라)",options:["As","Because","Although","So"],answer:"As"}]},
  {id:"gm89",level:9,title:"부정 구문 (not always, few/little)",explain:"not always는 부분부정('항상 ~한 것은 아니다'), few/little은 거의 없다는 완전부정에 가까운 의미예요.",examples:[{en:"Money doesn't always bring happiness.",ko:"돈이 항상 행복을 가져다주는 것은 아니다."},{en:"Few people know the truth.",ko:"진실을 아는 사람이 거의 없다."}],practice:[{q:"Rich people are ___ happy.",options:["not always","never","not never","always not"],answer:"not always"},{q:"___ students passed the exam.",options:["Few","A few","Little","Much"],answer:"Few"}]},
  {id:"gm90",level:9,title:"동사구 수동태",explain:"give up, look after 같은 동사구는 하나의 단위로 취급해서 수동태를 만들어요.",examples:[{en:"The problem was looked into carefully.",ko:"그 문제는 신중히 조사되었다."},{en:"The plan was given up.",ko:"그 계획은 포기되었다."}],practice:[{q:"The baby is taken care ___ by her mom.",options:["of","by","with","for"],answer:"of"},{q:"The meeting was put ___ until next week.",options:["off","of","by","away"],answer:"off"}]},
  {id:"gm91",level:10,title:"수일치 오류찾기",explain:"주어와 동사의 수를 일치시켜야 해요. 특히 수식어구 뒤에서 실수하기 쉬워요.",examples:[{en:"The list of items (is) on the table. (was → is 아님, is 맞음)",ko:"목록은 테이블 위에 있다."},{en:"Each of the students has a book.",ko:"학생들 각각은 책이 있다."}],practice:[{q:"The number of students ___ increasing.",options:["is","are","were","have been"],answer:"is"},{q:"A number of students ___ absent today.",options:["is","are","was","has been"],answer:"are"}]},
  {id:"gm92",level:10,title:"시제 오류찾기",explain:"문맥에 맞지 않는 시제를 찾아내는 연습이에요. since는 현재완료와, ago는 과거와 함께 써요.",examples:[{en:"I have lived here since 2020. (o)",ko:"나는 2020년부터 여기 살고 있다."},{en:"I lived here two years ago. (o)",ko:"나는 2년 전에 여기 살았다."}],practice:[{q:"I have seen that movie ___.",options:["yesterday","last week","ago","already"],answer:"already"},{q:"She moved here ___.",options:["since 2019","for 3 years","two years ago","yet"],answer:"two years ago"}]},
  {id:"gm93",level:10,title:"관계사 오류찾기",explain:"관계대명사 뒤 문장이 완전한지 불완전한지로 which/that vs what을 구별해요.",examples:[{en:"This is the movie which I watched. (o, 불완전)",ko:"이것은 내가 본 영화다."},{en:"Tell me what you want. (o, 불완전+선행사 없음)",ko:"네가 원하는 것을 말해줘."}],practice:[{q:"This is the book ___ changed my life.",options:["what","that","who","whom"],answer:"that"},{q:"I don't understand ___ he means.",options:["that","which","what","who"],answer:"what"}]},
  {id:"gm94",level:10,title:"준동사 오류찾기",explain:"동사가 두 개 연속으로 오는 오류, to부정사/동명사 선택 오류를 찾아요.",examples:[{en:"She enjoys to read books. (x) → enjoys reading books (o)",ko:"그녀는 책 읽는 것을 즐긴다."},{en:"I want going home. (x) → I want to go home (o)",ko:"나는 집에 가고 싶다."}],practice:[{q:"She avoided ___ him at the party.",options:["meet","to meet","meeting","met"],answer:"meeting"},{q:"He hopes ___ abroad next year.",options:["study","to study","studying","studied"],answer:"to study"}]},
  {id:"gm95",level:10,title:"병렬구조 오류찾기",explain:"and/or/but로 연결된 것들의 형태가 안 맞는 오류를 찾는 연습이에요.",examples:[{en:"I like swimming, running, and to bike. (x) → and biking (o)",ko:"나는 수영, 달리기, 자전거 타기를 좋아한다."},{en:"She is smart and works hard. (o)",ko:"그녀는 똑똑하고 열심히 일한다."}],practice:[{q:"He likes to read, to write, and ___.",options:["draw","drawing","to draw","drew"],answer:"to draw"},{q:"The plan was simple, cheap, and ___.",options:["effective","effectively","effectiveness","to effect"],answer:"effective"}]},
  {id:"gm96",level:10,title:"전치사 오류찾기",explain:"동사·형용사와 함께 쓰이는 전치사는 정해져 있어서 자주 헷갈려요.",examples:[{en:"I am interested in music. (o)",ko:"나는 음악에 관심이 있다."},{en:"She is good at math. (o)",ko:"그녀는 수학을 잘한다."}],practice:[{q:"He is afraid ___ spiders.",options:["of","in","at","for"],answer:"of"},{q:"I'm looking forward ___ seeing you.",options:["to","for","at","of"],answer:"to"}]},
  {id:"gm97",level:10,title:"비교구문 오류찾기",explain:"비교급에 more/most 중복 사용, than/as 짝 오류 등을 찾아요.",examples:[{en:"She is more prettier than me. (x) → prettier (o)",ko:"그녀는 나보다 더 예쁘다."},{en:"This is the most best movie. (x) → the best (o)",ko:"이것이 최고의 영화다."}],practice:[{q:"This phone is ___ than that one.",options:["more expensive","more expensiver","expensiver","most expensive"],answer:"more expensive"},{q:"He is the ___ student in class.",options:["smart","smarter","smartest","more smart"],answer:"smartest"}]},
  {id:"gm98",level:10,title:"가정법 오류찾기",explain:"if절과 주절의 시제 짝이 맞는지 확인하는 연습이에요 (과거-would, 과거완료-would have).",examples:[{en:"If I was you, I would go. (구어체, 격식체는 were)",ko:"내가 너라면 갈 텐데."},{en:"If I had known, I would have helped. (o)",ko:"알았더라면 도와줬을 텐데."}],practice:[{q:"If she ___ harder, she would pass.",options:["study","studies","studied","had studied"],answer:"studied"},{q:"If I had known, I ___ come earlier.",options:["will","would","would have","had"],answer:"would have"}]},
  {id:"gm99",level:10,title:"종합 오류 찾기 1",explain:"여러 문법 요소가 섞인 문장에서 오류를 찾아내는 종합 연습이에요.",examples:[{en:"Neither of the answers are correct. (x) → is correct (o)",ko:"둘 다 답이 정답이 아니다."},{en:"He is one of the smartest student. (x) → students (o)",ko:"그는 가장 똑똑한 학생 중 한 명이다."}],practice:[{q:"Neither of the students ___ present.",options:["is","are","were","have been"],answer:"is"},{q:"She is one of the best ___ in school.",options:["singer","singers","singing","sang"],answer:"singers"}]},
  {id:"gm100",level:10,title:"종합 오류 찾기 2",explain:"실전에서 자주 나오는 여러 문법 포인트를 한 번에 점검해요.",examples:[{en:"Not only he is smart but also kind. (x) → is he (o, 도치)",ko:"그는 똑똑할 뿐 아니라 친절하다."},{en:"There is many reasons. (x) → are (o)",ko:"많은 이유가 있다."}],practice:[{q:"Not only ___ funny, but also very kind.",options:["he is","is he","he was","was he"],answer:"is he"},{q:"There ___ several reasons for this.",options:["is","are","was","has"],answer:"are"}]},
];
let vocabProgress = {}; // wordId -> {correct, wrong}
let vocabCompletedDays = []; // [1,2,...]
let vocabSession = null;
let vocabView = 'days'; // 'days' | 'session' | 'wrongnote'
const vocabProgressKey = (name) => 'vocab-progress:' + name;
const vocabDaysKey = (name) => 'vocab-days:' + name;

// ===== 문법 탭 상태 (로컬 전용 저장 - Firebase 학습 번들 스키마에는 포함하지 않음) =====
let grammarProgress = {}; // pointId -> {correct, wrong}
let grammarCompletedLevels = []; // [1,2,...]
let grammarSession = null;
let grammarView = 'levels'; // 'levels' | 'wrongnote'
const grammarProgressKey = (name) => 'grammar-progress:' + name;
const grammarLevelsKey = (name) => 'grammar-levels:' + name;

async function loadGrammarState(name){
  try{
    const p = await storageGet(grammarProgressKey(name), false);
    grammarProgress = p ? JSON.parse(p.value) : {};
  }catch(e){ grammarProgress = {}; }
  try{
    const l = await storageGet(grammarLevelsKey(name), false);
    grammarCompletedLevels = l ? JSON.parse(l.value) : [];
  }catch(e){ grammarCompletedLevels = []; }
}
async function saveGrammarProgress(){
  if(!currentUser) return;
  await storageSet(grammarProgressKey(currentUser), JSON.stringify(grammarProgress), false);
}
async function saveGrammarLevels(){
  if(!currentUser) return;
  await storageSet(grammarLevelsKey(currentUser), JSON.stringify(grammarCompletedLevels), false);
}
function recordGrammarCorrect(id){
  const p = grammarProgress[id] || {correct:0, wrong:0};
  const wasNew = !(p.correct||0);
  const recovered = p.lastResult === 'wrong';
  p.correct = (p.correct||0)+1;
  p.lastResult = 'correct';
  grammarProgress[id] = p;
  awardPoints(wasNew ? 10 : recovered ? 5 : 3);
  markDaily('practice', 1);
  touchLearningMeta();
  queueLearningSync();
  saveGrammarProgress();
  syncScoreToFirebase();
}

  if(!petEl) return;
  petClearMotionClass(petEl);

  if(!img) return;
  img.style.transition = 'transform 0.25s ease';

function startRoomAnimation(bgImg, petEl, petSize, furnEl){
  stopRoomAnimation();
  if(petEl){
    petEl.innerHTML = renderPetWidget(petSize || 64);
    petEl.style.position = 'absolute';
    petEl.style.left = petState.x + '%';
    petEl.style.bottom = petState.y + '%';
    petEl.style.transition = 'left 0.16s linear, bottom 0.16s linear, transform 0.3s ease';
    petEl.style.zIndex = '5';
  }
  if(furnEl) renderFurnitureOverlay(furnEl);
  petState.mode = 'idle';
  petState.idleTicks = 4;
  petApplyIdleAppearance(petEl);
  roomTimer = setInterval(()=>{
    if(petState.mode === 'idle'){
      petState.idleTicks--;
      if(petState.idleTicks <= 0) petPickNewTarget(petEl);
      return;
    }
    const dx = petState.targetX - petState.x;
    const dy = petState.targetY - petState.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 1.5){
      petState.mode = 'idle';
      petState.idleTicks = 12 + Math.floor(Math.random()*28); // 약 2~6.5초 정지
      petBounce(petEl);
      if(Math.random() < 0.6) petShowBubble(petEl);
      return;
    }
    const speed = 0.9;
    petState.x += (dx/dist) * speed;
    petState.y += (dy/dist) * speed * 0.45;
    if(Math.abs(dx) > 0.3) petState.dir = dx < 0 ? -1 : 1;
    if(petEl){
      petEl.style.left = petState.x + '%';
      petEl.style.bottom = petState.y + '%';
      const depthScale = 0.85 + (petState.y - PET_Y_MIN) / (PET_Y_MAX - PET_Y_MIN) * 0.3;
      petEl.style.transform = `scaleX(${petState.dir * depthScale}) scaleY(${depthScale})`;
    }
  }, 160);
}

function recordVocabWrong(id){
  const p = vocabProgress[id] || {correct:0, wrong:0, stage:0};
  p.wrong = (p.wrong||0)+1;
  p.stage = Math.max(0, (p.stage||0)-1);
  p.lastSeen = Date.now();
  p.nextReview = Date.now();
  p.lastResult = 'wrong';
  vocabProgress[id] = p;
  if(vocabSession) vocabSession.wrongThisSession.add(id);
  markDaily('wrong', 1);
  saveVocabProgress();
}
function recordVocabCorrect(id){
  const p = vocabProgress[id] || {correct:0, wrong:0, stage:0};
  const wasNew = !(p.correct||0);
  const wasReview = !wasNew && (p.nextReview||0) <= Date.now();
  const recovered = (p.lastResult === 'wrong');
  p.correct = (p.correct||0)+1;
  p.stage = Math.min(5, (p.stage||0)+1);
  p.lastSeen = Date.now();
  p.nextReview = addDays(Date.now(), SRS_INTERVALS[p.stage]);
  p.lastResult = 'correct';
  vocabProgress[id] = p;
  awardPoints(wasNew ? 10 : recovered ? 5 : 3);
  markDaily(wasNew ? 'newWords' : wasReview ? 'reviews' : 'practice', 1);
  saveVocabProgress();
}

function touchLearningMeta(){ learningMeta.updatedAt = Date.now(); }
function awardPoints(amount){
  learningMeta.points=(learningMeta.points||0)+amount;
  markDaily('points',amount);
  credits = (credits||0) + Math.max(1, Math.round(amount/2));
  saveCredits();
}
function markDaily(field, amount){
  const key = todayKey();
  dailyHistory[key] = dailyHistory[key] || {newWords:0,reviews:0,conversation:0,correct:0,wrong:0};
  dailyHistory[key][field] = (dailyHistory[key][field]||0) + amount;
  if(field !== 'wrong') dailyHistory[key].correct = (dailyHistory[key].correct||0) + (field==='newWords'||field==='reviews'||field==='practice'||field==='conversation' ? amount : 0);
  const saveUser=currentUser;
  const snapshot=JSON.stringify(dailyHistory);
  clearTimeout(dailySaveTimer);
  dailySaveTimer=setTimeout(()=>storageSet(dailyHistoryKey(saveUser),snapshot,false),40);
}
function recordConversationResult(id, correct){
  const p = progress[id] || {correct:0,wrong:0,lastSeen:0,stage:0,nextReview:0};
  if(correct) p.correct=(p.correct||0)+1;
  else p.wrong=(p.wrong||0)+1;
  trackConversationOutcome(p,correct);
  progress[id] = p;
  return p;
}
function trackConversationOutcome(p, correct){
  if(correct){
    const recovered=p.lastResult==='wrong';
    awardPoints(recovered?5:(p.correct===1?10:3));
    markDaily('conversation',1);
    p.stage=Math.min(5,(p.stage||0)+1);
    p.nextReview=addDays(Date.now(),SRS_INTERVALS[p.stage]);
    p.lastResult='correct';
  }else{
    markDaily('wrong',1);
    p.stage=Math.max(0,(p.stage||0)-1);
    p.nextReview=Date.now();
    p.lastResult='wrong';
  }
  p.lastSeen=Date.now();
}

async function loadMemberLearningData(name){
  await Promise.all([loadProgress(name),loadVocabState(name),loadGrammarState(name),loadRoomState(name)]);
  try{ const h=await storageGet(dailyHistoryKey(name),false); dailyHistory=h?JSON.parse(h.value):{}; }catch(e){ dailyHistory={}; }
  try{
    const m=await storageGet(learningMetaKey(name),false);
    learningMeta=m?JSON.parse(m.value):{updatedAt:0,points:null};
  }catch(e){ learningMeta={updatedAt:0,points:null}; }
  if(learningMeta.points==null){
    learningMeta.points=Object.values(progress).reduce((s,p)=>s+(p.correct||0),0)+Object.values(vocabProgress).reduce((s,p)=>s+(p.correct||0),0);
  }
  const local = learningBundle();
  if(fbDb){
    try{
      const snap = await fbDb.ref('family/learning/' + firebaseMemberKey(name)).once('value');
      const remote = snap.val();
      if(remote && (remote.meta?.updatedAt||0) > (local.meta?.updatedAt||0)){
        applyLearningBundle(remote);
        await persistLearningLocal(name);
      }else if((local.meta?.updatedAt||0) > 0){
        await fbDb.ref('family/learning/' + firebaseMemberKey(name)).set(local);
      }
    }catch(e){}
  }
}
function queueLearningSync(){

    await storageSet(learningMetaKey(syncUser),JSON.stringify(snapshot.meta),false);
    if(fbDb){ try{ await fbDb.ref('family/learning/' + firebaseMemberKey(syncUser)).set(snapshot); }catch(e){} }
  },250);
}
