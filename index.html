/* ================= 문제 만들기 ================= */
const STOP = new Set('a an the is are am was were be been i you he she it we they my your his her its our their to of in on at for and or but do does did not this that me us them can will would could should with so if'.split(' '));
const words = s => s.split(/\s+/).filter(Boolean);
const clean = w => w.toLowerCase().replace(/[^a-z']/g, '');
function pickBlank(sent){
  const ws = words(sent);
  const cand = ws.map((w, i) => ({w, i, c:clean(w)})).filter(x => x.c.length >= 3 && !STOP.has(x.c));
  const pool = cand.length ? cand : ws.map((w, i) => ({w, i, c:clean(w)})).filter(x => x.c.length >= 2);
  if(!pool.length) return null;
  return pool.sort((a, b) => b.c.length - a.c.length)[Math.floor(Math.random() * Math.min(2, pool.length))];
}
function vocabQ(w, type){
  const key = 'v:' + w.id;
  // 보기는 같은 학년 단어에서 고른다 (같은 품사 우선)
  const gradeMates = VOCAB.filter(x => x.id !== w.id && x.grade === w.grade);
  const others = gradeMates.length >= 3 ? gradeMates : VOCAB.filter(x => x.id !== w.id);
  const same = others.filter(x => x.pos === w.pos);
  const pool = same.length >= 3 ? same : others;
  if(type === 'en2ko'){
    const opts = shuffle([w.ko].concat(sample(pool, 3, x => x.ko === w.ko).map(x => x.ko)));
    return {type:'choice', key, title:'이 단어의 뜻은?', prompt:w.en, promptEn:true, speakText:w.en, opts, answer:w.ko, show:`${w.en} = ${w.ko}`, who:'chagok'};
  }
  if(type === 'ko2en'){
    const opts = shuffle([w.en].concat(sample(pool, 3, x => x.en === w.en).map(x => x.en)));
    return {type:'choice', key, title:'영어로 뭐라고 할까요?', prompt:w.ko, opts, optEn:true, answer:w.en, show:`${w.ko} = ${w.en}`, speakAnswer:w.en, who:'chagok'};
  }
  // listen
  const opts = shuffle([w.en].concat(sample(pool, 3, x => x.en === w.en).map(x => x.en)));
  return {type:'listen', key, title:'들리는 단어를 고르세요', speakText:w.en, opts, optEn:true, answer:w.en, show:`${w.en} = ${w.ko}`};
}
function convQ(c, type){
  const key = 'c:' + c.id;
  const others = CONV.filter(x => x.id !== c.id);
  if(type === 'ko2en'){
    const opts = shuffle([c.en].concat(sample(others, 2).map(x => x.en)));
    return {type:'choice', key, title:'이 말을 영어로 하면?', prompt:c.ko, opts, optEn:true, answer:c.en, show:c.en, speakAnswer:c.en, who:'yeongcha'};
  }
  if(type === 'listen'){
    const opts = shuffle([c.ko].concat(sample(others, 2).map(x => x.ko)));
    return {type:'listen', key, title:'무슨 뜻일까요?', speakText:c.en, opts, answer:c.ko, show:`${c.en} = ${c.ko}`};
  }
  if(type === 'blank'){
    const b = pickBlank(c.en);
    if(!b) return convQ(c, 'tiles');
    const ws = words(c.en);
    const pre = ws.slice(0, b.i).join(' '), post = ws.slice(b.i + 1).join(' ');
    const lead = b.w.match(/^[^A-Za-z']*/)[0], tail = b.w.match(/[^A-Za-z']*$/)[0];
    const core = b.w.slice(lead.length, b.w.length - tail.length || undefined);
    const pool = [...new Set(CONV.flatMap(x => words(x.en).map(clean)).filter(x => x.length >= 3 && x !== b.c && !STOP.has(x)))];
    const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
    let ans = b.i === 0 ? core : core.toLowerCase(), others = sample(pool.filter(x => x !== ans.toLowerCase()), 3);
    if(b.i === 0) others = others.map(cap);
    const opts = shuffle([ans].concat(others));
    return {type:'blank', key, title:'빈칸에 들어갈 말은?', pre, post:post, lead, tail, ko:c.ko, opts, answer:ans, show:c.en, speakAnswer:c.en};
  }
  if(type === 'speak') return {type:'speak', key, title:'소리 내어 말해 보세요', en:c.en, ko:c.ko, show:c.en};
  // tiles
  return tilesQ(key, c.en, c.ko, 'yeongcha');
}
function tilesQ(key, en, ko, who){
  const ws = words(en);
  let extra = [];
  if(ws.length <= 6){
    const pool = [...new Set(CONV.flatMap(x => words(x.en)).filter(w => !ws.map(clean).includes(clean(w)) && clean(w).length >= 2))];
    extra = sample(pool, ws.length <= 3 ? 2 : 1);
  }
  return {type:'tiles', key, title:'영어 문장으로 만들어 보세요', prompt:ko, words:ws, bank:shuffle(ws.concat(extra)), answer:en, show:en, speakAnswer:en, who};
}
function gramQ(g, type, pi){
  const key = 'g:' + g.id;
  if(type === 'practice'){
    const p = g.practice[pi];
    return {type:'choice', key, title:'빈칸에 알맞은 것은?', prompt:p.q.replace(/_{2,}/g, '___'), promptEn:true, opts:shuffle(p.options), optEn:true, answer:p.answer, show:p.q.replace(/_{2,}/, p.answer), speakAnswer:p.q.replace(/_{2,}/, p.answer), who:'ttuk', tag:g.title};
  }
  const ex = g.examples[pi % g.examples.length];
  if(type === 'mean'){
    const pool = GRAM.filter(x => x.id !== g.id).flatMap(x => x.examples);
    const opts = shuffle([ex.ko].concat(sample(pool, 2).map(x => x.ko)));
    return {type:'choice', key, title:'이 문장의 뜻은?', prompt:ex.en, promptEn:true, speakText:ex.en, opts, answer:ex.ko, show:`${ex.en} = ${ex.ko}`, who:'ttuk', tag:g.title};
  }
  return tilesQ(key, ex.en, ex.ko, 'ttuk');
}
function questionsFor(key, n){
  const s = key[0], it = byId[key];
  if(s === 'v') return shuffle(['en2ko','ko2en','listen']).slice(0, n).map(t => vocabQ(it, t));
  if(s === 'c'){
    if(n === 1) return [convQ(it, rand(['ko2en','listen','blank','tiles']))];
    const types = shuffle(['ko2en','listen','blank']).slice(0, Math.max(0, n - 1));
    types.push('tiles');
    if(n >= 3 && settings.speak && SR && Math.random() < .5) types[0] = 'speak';
    return types.map(t => convQ(it, t));
  }
  const qs = [gramQ(it, 'practice', 0), gramQ(it, 'practice', 1), gramQ(it, rand(['mean','tiles']), Math.floor(Math.random() * 2))];
  return shuffle(qs).slice(0, n);
}
function buildLesson(s, unit){
  const out = [];
  if(unit === 'review'){
    const keys = wrongList(s).slice(0, 12);
    keys.forEach(k => out.push(...questionsFor(k, 1)));
    return {items:shuffle(out), title:'오답 복습'};
  }
  const u = UNITS[s][unit];
  if(u.summit){
    const all = s === 'v' ? VOCAB.map(x => 'v:' + x.id) : s === 'c' ? CONV.map(x => 'c:' + x.id) : GRAM.map(x => 'g:' + x.id);
    sample(all, 15).forEach(k => out.push(...questionsFor(k, 1)));
    return {items:out, title:'정상 테스트', summit:true};
  }
  const keys = u.items.map(id => s + ':' + id);
  // 단어는 5개씩 4묶음, 회화·문법은 2묶음
  const size = s === 'v' ? 5 : Math.ceil(keys.length / 2);
  const groups = [];
  for(let i = 0; i < keys.length; i += size) groups.push(keys.slice(i, i + size));
  groups.forEach((grp, gi) => {
    grp.forEach(k => out.push({type:'intro', key:k, phase:'새로 배우기'}));
    let qs = [];
    if(s === 'v'){
      grp.forEach(k => qs.push(...questionsFor(k, 1)));
      qs = shuffle(qs);
      qs.push({type:'match', keys:grp.slice(0, 5), title:'짝을 맞춰 보세요'});
    }else if(s === 'c'){
      grp.forEach(k => qs.push(...questionsFor(k, 3)));
      qs = shuffle(qs);
    }else{
      grp.forEach(k => qs.push(...questionsFor(k, 3)));
      qs = shuffle(qs);
    }
    // 두 번째 묶음부터는 앞에서 배운 것 복습 문제 몇 개 섞기
    if(gi > 0){ sample(groups.slice(0, gi).flat(), s === 'v' ? 2 : 3).forEach(k => qs.splice(Math.floor(Math.random() * (qs.length + 1)), 0, ...questionsFor(k, 1))); }
    out.push(...qs);
  });
  return {items:out, title:u.title};
}

/* ================= 레슨 진행 ================= */
let lessonOpen = false, L = null;
function startLesson(s, unit){
  const built = buildLesson(s, unit);
  if(!built.items.length){ toast('복습할 문제가 없어요'); return; }
  sfx.tap();
  L = {s, unit, q:built.items, total:built.items.length, done:0, ok:0, bad:0, combo:0, cheers:0, first:0, firstOk:0, m50:false, m85:false, title:built.title, summit:built.summit,
       start:Date.now(), lastAct:Date.now(), sec:0, firstTry:{}, noSpeak:false, cur:null, ui:null, state:'answer'};
  lessonOpen = true;
  const el = document.createElement('div');
  el.className = 'lesson'; el.id = 'lesson';
  el.innerHTML = `<div class="lesson-in"><div class="lhead"><button class="x" id="lx">✕</button><div class="bar"><i id="lbar" style="width:0"></i></div></div>
    <div class="phase" id="lphase"></div><div class="stage" id="stage"></div>
    <div class="lfoot" id="lfoot"><div class="fb" id="fb"></div><button class="btn wide" id="lbtn" disabled>확인</button></div></div>`;
  document.body.appendChild(el);
  $('#lx').onclick = () => { if(confirm('지금 그만두면 이 칸은 완공되지 않아요. 그만할까요?')) closeLesson(); };
  $('#lbtn').onclick = onMain;
  // 결과 표시 중 아래 결과 영역을 누르면 기다리지 않고 바로 다음 문제
  $('#fb').onclick = () => { if(L && L.state === 'fb'){ act(); onMain(); } };
  L.timer = setInterval(tick, 1000);
  next();
}
function tick(){
  if(!L) return;
  if(Date.now() - L.lastAct < 60000 && !document.hidden){ L.sec++; day().sec = (day().sec || 0) + 1; }
}
const act = () => { if(L) L.lastAct = Date.now(); };
function closeLesson(){
  if(L){ clearInterval(L.timer); clearTimeout(L.adv); }
  stopSR(); stopSpeech();
  saveData();
  const el = $('#lesson'); if(el) el.remove();
  lessonOpen = false; L = null;
  updateTop(); render();
}
function progressBar(){ $('#lbar').style.width = Math.min(100, L.done / L.total * 100) + '%'; }
function next(){
  if(!L.q.length){ finish(); return; }
  clearTimeout(L.adv);
  L.cur = L.q.shift();
  L.state = 'answer';
  const f = $('#lfoot'); f.className = 'lfoot'; $('#fb').innerHTML = '';
  const b = $('#lbtn'); b.className = 'btn wide'; b.textContent = '확인'; b.disabled = true;
  $('#lphase').textContent = L.cur.phase || (L.cur.retry ? '다시 한 번!' : (L.cur.tag || L.title));
  progressBar();
  L.ui = R[L.cur.type](L.cur);
  if(L.cur.noCheck){ b.textContent = '계속'; b.disabled = false; L.state = 'info'; }
  // 답을 누르면 바로 채점되는 문제는 '확인' 버튼을 숨긴다
  b.style.display = AUTO.has(L.cur.type) && L.state === 'answer' ? 'none' : '';
  if(L.cur.type === 'cheer'){ b.style.display = 'none'; autoNext(1700); }
  $('#stage').scrollTop = 0;
}
function autoNext(ms){
  clearTimeout(L.adv);
  const me_ = L;
  L.adv = setTimeout(() => { if(L === me_ && (L.state === 'fb' || L.state === 'info')) onMain(); }, ms);
}
const AUTO = new Set(['choice', 'listen', 'blank', 'tiles', 'match']);
function setReady(v){ if(L && L.state === 'answer') $('#lbtn').disabled = !v; }
function onMain(){
  act();
  if(L.state === 'info'){ sfx.tap(); if(L.cur.type === 'intro' || L.cur.type === 'cheer'){ if(L.cur.type === 'intro') L.done++; } next(); return; }
  if(L.state === 'answer'){ const r = L.ui.check(); if(r) feedback(r); return; }
  if(L.state === 'fb'){ if(L.pendingCheer){ L.q.unshift(L.pendingCheer); L.pendingCheer = null; } next(); }
}
function feedback(r){
  L.state = 'fb';
  const ok = r.ok, q = L.cur;
  const keys = q.type === 'match' ? q.keys : [q.key];
  keys.forEach(k => { if(k) mark(k, ok, L.unit === 'review'); });
  if(!q.retry){ L.first++; if(ok) L.firstOk++; }
  const t = day();
  if(ok){ L.ok++; L.combo++; t.ok = (t.ok || 0) + 1; L.done++; sfx.ok(); }
  else{
    L.bad++; L.combo = 0; t.bad = (t.bad || 0) + 1; sfx.bad();
    const again = Object.assign({}, q, {retry:true});
    if(again.opts) again.opts = shuffle(again.opts);
    if(again.bank) again.bank = shuffle(again.bank);
    L.q.splice(Math.min(L.q.length, 3 + Math.floor(Math.random() * 3)), 0, again);
    L.total++;
  }
  const f = $('#lfoot'); f.className = 'lfoot ' + (ok ? 'good' : 'bad');
  let buddy = '';
  if(Math.random() < (ok ? .3 : .4)){ const w = rand(WHO); buddy = `<div class="buddy">${cv(w, ok ? 'cheer' : 'sad')}<span>${rand(LINES[ok ? 'ok' : 'bad'])}</span></div>`; }
  const ans = q.show ? `<div class="a">${ok ? '' : '정답: '}<span class="${/[a-z]/i.test(q.show) ? 'en' : ''}">${esc(q.show)}</span></div>` : '';
  $('#fb').innerHTML = buddy + `<div class="t">${ok ? rand(['정답!','좋아요!','완벽해요!','영차!']) : '아쉬워요'}</div>` + (r.note ? `<div class="a">${esc(r.note)}</div>` : '') + ans;
  // '계속하기' 없이 잠시 결과를 보여준 뒤 자동으로 다음 문제 (틀리면 정답 볼 시간을 조금 더)
  const b = $('#lbtn'); b.style.display = 'none';
  autoNext(ok ? 1100 : 2400);
  if(q.speakAnswer && settings.sound) setTimeout(() => speak(q.speakAnswer), 250);
  progressBar();
  L.pendingCheer = ok ? cheerTrigger() : null;
}
function cheerTrigger(){
  if(L.q.length < 3 || L.cheers >= 3) return null;
  const pct = L.done / L.total;
  let text = null, sub = '';
  if(!L.m50 && pct >= .5){ L.m50 = true; text = '벌써 절반 왔어요!'; sub = '빌딩이 절반 올라갔어요'; }
  else if(!L.m85 && pct >= .85){ L.m85 = true; text = '거의 다 왔어요!'; sub = '마지막까지 영차영차'; }
  else if(L.combo >= 7 && L.combo % 7 === 0){ text = `연속 ${L.combo}개 정답!`; sub = '오늘 아주 튼튼하게 짓고 있어요 🔥'; }
  if(!text) return null;
  L.cheers++;
  return {type:'cheer', who:rand(WHO), text, sub, noCheck:true, phase:'응원 타임'};
}
function finish(){
  clearInterval(L.timer);
  const s = L.s, acc = L.first ? Math.round(L.firstOk / L.first * 100) : 100;
  let newBrick = false;
  if(typeof L.unit === 'number' && !D.done[s].includes(L.unit)){
    if(!L.summit || acc >= 70){ D.done[s].push(L.unit); newBrick = true; }
  }
  saveData();
  sfx.win();
  const min = Math.floor(L.sec / 60), secs = L.sec % 60;
  const who = SUBJ[s].who;
  const passFail = L.summit && !newBrick && !D.done[s].includes(SUM(s));
  $('#lphase').textContent = '';
  $('#lbar').style.width = '100%';
  $('#stage').innerHTML = `<div class="result">
    ${newBrick ? `<div><div class="newwin"></div></div>` : ''}
    <div class="cbubble">${passFail ? '정답률 70%면 정상이에요. 한 번 더!' : newBrick ? (L.summit ? '빌딩 완공! 🏆' : `${esc(brickName(s, L.unit))} 불 켜기 완료!`) : '복습 완료! 더 단단해졌어요'}</div>
    <div class="cbig">${chara(newBrick ? rand(WHO) : who, passFail ? 'sad' : acc >= 70 ? 'cheer' : 'happy')}</div>
    <div class="stats"><div class="stat"><div class="k">정답률</div><div class="v">${acc}%</div></div><div class="stat"><div class="k">걸린 시간</div><div class="v">${min}:${String(secs).padStart(2, '0')}</div></div><div class="stat"><div class="k">연속 학습</div><div class="v">🔥${streakOf(D.days)}</div></div></div>
    <p class="muted">오늘 공부한 시간 ${Math.floor((day().sec || 0) / 60)}분 / 목표 ${GOAL_MIN}분</p></div>`;
  const f = $('#lfoot'); f.className = 'lfoot'; $('#fb').innerHTML = '';
  const b = $('#lbtn'); b.style.display = ''; b.disabled = false; b.className = 'btn wide'; b.textContent = '빌딩으로 돌아가기';
  L.state = 'end';
  b.onclick = () => { b.onclick = onMain; closeLesson(); };
}

/* ================= 문제 화면 (R[type]) ================= */
const R = {};
const spkBtn = t => `<button class="spk" data-say="${esc(t)}">🔊</button>`;
function bindSpk(root){ root.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); act(); speak(b.dataset.say); }); }

      <div class="ko" style="margin-top:12px">${esc(it.ko)}</div>

  }
  $('#stage').innerHTML = `<div class="prompt" style="margin-bottom:12px">${cv(SUBJ[s].who, 'wow')}<div class="say">${rand(s === 'g' ? ['뚝딱! 오늘의 조립 규칙이에요','이 규칙만 알면 문장이 착착 맞춰져요'] : s === 'c' ? ['이 말 자주 써요!','소리 내서 따라 해봐요'] : ['새 단어 하나!','한 번 듣고, 한 번 따라 해봐요'])}</div></div>` + html;
  bindSpk($('#stage'));
  if(settings.sound) setTimeout(() => speak(s === 'g' ? it.examples[0].en : it.en), 300);

R.cheer = q => {
  $('#stage').innerHTML = `<div class="cheer"><div class="cbubble">${esc(q.text)}</div><div class="cbig">${chara(q.who, 'cheer')}</div><div class="cname">${NAMES[q.who]}</div><div class="csub">${esc(q.sub || '')}</div></div>`;
  sfx.ok();
  return {check:() => null};
};
function optionList(q, container){
  let sel = null;
  container.innerHTML = q.opts.map((o, i) => `<button class="opt ${q.optEn ? 'en' : ''}" data-i="${i}">${esc(o)}</button>`).join('');
  container.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(L.state !== 'answer') return;
    act(); sfx.tap();
    container.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); sel = q.opts[+b.dataset.i];
    setReady(true);
    onMain();   // 누르는 즉시 정답 확인
  });
  return {
    get:() => sel,
    lock:(ok) => container.querySelectorAll('.opt').forEach(x => { x.disabled = true; const v = q.opts[+x.dataset.i]; if(v === q.answer) x.classList.add('good'); else if(v === sel && !ok) x.classList.add('wrong'); })
  };
}
R.choice = q => {
  const sayHtml = q.promptEn ? `<div class="say en">${esc(q.prompt)} ${q.speakText ? spkBtn(q.speakText) : ''}</div>` : `<div class="say">${esc(q.prompt)}</div>`;
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div><div class="prompt">${cv(q.who || SUBJ[L.s].who, 'happy')}${sayHtml}</div><div class="opts" id="opts"></div>`;
  bindSpk($('#stage'));
  if(q.speakText && settings.sound) setTimeout(() => speak(q.speakText), 250);
  const ol = optionList(q, $('#opts'));
  return {check:() => { const v = ol.get(); if(v == null) return null; const ok = v === q.answer; ol.lock(ok); return {ok}; }};
};
R.listen = q => {
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div><div class="listen-big"><button id="pl">🔊</button><button class="slow" id="pls">🐢</button></div><div class="opts" id="opts"></div>`;
  $('#pl').onclick = () => { act(); speak(q.speakText); };
  $('#pls').onclick = () => { act(); speak(q.speakText, .6); };
  setTimeout(() => speak(q.speakText), 300);
  const ol = optionList(Object.assign({}, q, {noSay:true}), $('#opts'));
  return {check:() => { const v = ol.get(); if(v == null) return null; const ok = v === q.answer; ol.lock(ok); return {ok}; }};
};
R.blank = q => {
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div>
    <div class="blank-sent">${esc(q.pre)} ${esc(q.lead)}<u id="bl">&nbsp;</u>${esc(q.tail)} ${esc(q.post)}</div><div class="hint-ko">${esc(q.ko)}</div><div class="opts" id="opts"></div>`;
  const ol = optionList(Object.assign({}, q, {optEn:true}), $('#opts'));
  $('#opts').addEventListener('click', () => { const v = ol.get(); if(v) $('#bl').textContent = v; });
  return {check:() => { const v = ol.get(); if(v == null) return null; const ok = clean(v) === clean(q.answer); ol.lock(ok); return {ok}; }};
};
R.tiles = q => {
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div><div class="prompt">${cv(q.who || 'yeongcha', 'happy')}<div class="say">${esc(q.prompt)}</div></div>
    <div class="answer-line" id="ansl"></div><div class="bank" id="bank"></div>`;
  const picked = [];
  const bank = $('#bank'), line = $('#ansl');
  bank.innerHTML = q.bank.map((w, i) => `<button class="tile" data-i="${i}">${esc(w)}</button>`).join('');
  function draw(){
    line.innerHTML = picked.map((i, p) => `<button class="tile" data-p="${p}">${esc(q.bank[i])}</button>`).join('');
    bank.querySelectorAll('.tile').forEach(b => b.classList.toggle('used', picked.includes(+b.dataset.i)));
    line.querySelectorAll('.tile').forEach(b => b.onclick = () => { if(L.state !== 'answer') return; act(); sfx.tap(); picked.splice(+b.dataset.p, 1); draw(); });
    setReady(picked.length > 0);
  }
  bank.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if(L.state !== 'answer') return;
    const i = +b.dataset.i; if(picked.includes(i)) return;
    act(); sfx.tap(); picked.push(i); speak(q.bank[i], 1.05); draw();
    if(picked.length === q.words.length) setTimeout(() => { if(L && L.cur === q && L.state === 'answer') onMain(); }, 250);
  });
  draw();
  return {check:() => {
    if(!picked.length) return null;
    const got = picked.map(i => clean(q.bank[i])).filter(Boolean).join(' ');
    const want = q.words.map(clean).filter(Boolean).join(' ');
    return {ok:got === want};
  }};
};
R.match = q => {
  const its = q.keys.map(k => byId[k]);
  const left = shuffle(its.map(w => ({id:w.id, t:w.en}))), right = shuffle(its.map(w => ({id:w.id, t:w.ko})));
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div><div class="match" id="mt">${left.map((x, i) => `<button class="opt en" data-s="l" data-id="${x.id}" style="grid-column:1;grid-row:${i + 1}">${esc(x.t)}</button>`).join('')}${right.map((x, i) => `<button class="opt" data-s="r" data-id="${x.id}" style="grid-column:2;grid-row:${i + 1}">${esc(x.t)}</button>`).join('')}</div>`;
  let sel = null, left_ = its.length, miss = 0;
  $('#mt').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(L.state !== 'answer' || b.classList.contains('gone')) return;
    act();
    if(b.dataset.s === 'l') speak(b.textContent, 1);
    if(!sel || sel.dataset.s === b.dataset.s){ $('#mt').querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; sfx.tap(); return; }
    if(sel.dataset.id === b.dataset.id){
      sfx.pop(); const a = sel; [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); });
      setTimeout(() => { a.classList.add('gone'); b.classList.add('gone'); }, 260);
      sel = null; left_--;
      if(!left_){ setTimeout(() => { if(L && L.state === 'answer') feedback({ok:true, note:miss ? `${miss}번 헷갈렸지만 다 맞췄어요` : '한 번에 다 맞췄어요!'}); }, 380); }
    }else{
      miss++; sfx.soft(); const a = sel; [a, b].forEach(x => x.classList.add('wrong'));
      setTimeout(() => { [a, b].forEach(x => x.classList.remove('wrong', 'sel')); }, 450); sel = null;
    }
  });
  $('#lbtn').textContent = '짝을 모두 맞춰요';
  return {check:() => null};
};
R.speak = q => {
  if(L.noSpeak || !SR || !settings.speak){ const alt = convQ(byId[q.key], 'tiles'); L.cur = alt; return R.tiles(alt); }
  $('#stage').innerHTML = `<div class="qtitle">${esc(q.title)}</div><div class="prompt">${cv('yeongcha', 'happy')}<div class="say en">${esc(q.en)} ${spkBtn(q.en)}</div></div>
    <div class="hint-ko">${esc(q.ko)}</div><button class="mic" id="mic">🎙️</button><div class="heard" id="heard">마이크를 누르고 말해 보세요</div><button class="skip" id="skip">지금은 말하기 어려워요</button>`;
  bindSpk($('#stage'));
  let result = null;
  $('#mic').onclick = () => {
    act();
    const m = $('#mic');
    if(m.classList.contains('rec')){ stopSR(); return; }
    m.classList.add('rec'); $('#heard').textContent = '듣고 있어요…';
    listenOnce(text => {
      m.classList.remove('rec');
      if(!L || L.cur !== q) return;
      if(text == null){ $('#heard').textContent = '잘 안 들렸어요. 다시 눌러 주세요'; return; }
      const score = similarity(q.en, text);
      result = score;
      $('#heard').innerHTML = `들린 말: <b>${esc(text)}</b>`;
      setReady(true);
      if(score >= .6) onMain();
    });
  };
  $('#skip').onclick = () => { act(); L.noSpeak = true; stopSR(); L.done++; toast('이번 레슨에서는 말하기를 건너뛸게요'); next(); };
  return {check:() => { if(result == null) return null; const ok = result >= .6; return {ok, note:ok ? `${Math.round(result * 100)}% 비슷하게 들렸어요` : '조금만 더 또박또박!'}; }};
};
function similarity(a, b){
  const A = words(a).map(clean).filter(Boolean), B = words(b).map(clean).filter(Boolean);
  if(!A.length) return 0;
  let hit = 0; const pool = B.slice();
  A.forEach(w => { const i = pool.indexOf(w); if(i >= 0){ hit++; pool.splice(i, 1); } });
  return hit / A.length;
}

/* ================= 소리 (둥글고 부드러운 효과음) · 음성 ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state !== 'running'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
// 안드로이드(갤럭시) 대비: 첫 터치 때 소리 장치를 깨우고, 무음 소리를 한 번 재생해 둔다
let audioUnlocked = false;
function unlockAudio(){
  const c = ac();
  if(c && !audioUnlocked){
    try{
      const buf = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
      src.buffer = buf; src.connect(c.destination); src.start(0);
    }catch(e){}
  }
  if(!audioUnlocked && window.speechSynthesis){
    try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'en-US'; speechSynthesis.speak(u); }catch(e){}
  }
  audioUnlocked = true;
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { unlockAudio(); if(AC && AC.state !== 'running') ac(); }, {capture:true, passive:true}));
document.addEventListener('visibilitychange', () => { if(!document.hidden && AC) ac(); });
// 대체 경로: 웹오디오가 안 켜지는 폰(일부 보급형 갤럭시 등)을 위해 같은 소리를 WAV로 미리 만들어 <audio>로 재생
const wavCache = {};
function renderWav(freqs, step, vol, decay){
  const rate = 22050, len = decay || step * 2.2, total = Math.ceil((t0off + (freqs.length - 1) * step + len + .05) * rate);
  const data = new Float32Array(total);
  freqs.forEach((f, i) => {
    const st = Math.floor((t0off + i * step) * rate);
    [[f, 1], [f / 2, .55], [f * 2, .12]].forEach(([fr, m]) => {
      for(let n = 0; n < len * rate && st + n < total; n++){
        const t = n / rate;
        const env = t < .014 ? t / .014 : Math.exp(Math.log(.0001) * (t - .014) / (len - .014));
        data[st + n] += Math.sin(2 * Math.PI * fr * t) * env * vol * m;
      }
    });
  });
  // 고음을 살짝 깎아 둥글게(1차 저역 통과)
  const k = 1 - Math.exp(-2 * Math.PI * 1300 / rate); let y = 0;
  const pcm = new DataView(new ArrayBuffer(44 + total * 2));
  const w = (o, str) => { for(let i = 0; i < str.length; i++) pcm.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); pcm.setUint32(4, 36 + total * 2, true); w(8, 'WAVEfmt '); pcm.setUint32(16, 16, true); pcm.setUint16(20, 1, true); pcm.setUint16(22, 1, true);
  pcm.setUint32(24, rate, true); pcm.setUint32(28, rate * 2, true); pcm.setUint16(32, 2, true); pcm.setUint16(34, 16, true); w(36, 'data'); pcm.setUint32(40, total * 2, true);
  for(let i = 0; i < total; i++){ y += k * (data[i] - y); pcm.setInt16(44 + i * 2, Math.max(-1, Math.min(1, y * 1.6)) * 32767, true); }
  return URL.createObjectURL(new Blob([pcm], {type:'audio/wav'}));
}
const t0off = 0.01;
function playWav(key, args){
  try{
    if(!wavCache[key]) wavCache[key] = renderWav(...args);
    const a = new Audio(wavCache[key]); a.volume = 1;
    const p = a.play(); if(p && p.catch) p.catch(() => {});
  }catch(e){}
}
// 히라미드와 같은 효과음: 사인파 + 한 옥타브 아래(두께감) + 작은 윗배음, 고음 필터로 둥글게
function tone(freqs, step, vol, decay){
  if(!settings.sound) return;
  try{
    const c = ac();
    if(!c || c.state !== 'running'){ playWav(freqs.join('-') + '_' + step + '_' + vol, [freqs, step, vol, decay]); return; }
    const t0 = c.currentTime + 0.01;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300; lp.Q.value = 0.4;
    lp.connect(c.destination);
    freqs.forEach((f, i) => {
      const t = t0 + i * step, len = decay || step * 2.2;
      [[f, 1], [f / 2, .55], [f * 2, .12]].forEach(pr => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = pr[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol * pr[1], t + 0.014);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + len + 0.02);
      });
    });
  }catch(e){}
}

  win:() => tone([392, 494, 587, 784], .15, .18, .55),
  pop:() => tone([440], .05, .15, .16),   // 짝 맞추기 한 쌍 성공

};
let voice = null, voiceList = [];
function pickVoice(){
  try{
    voiceList = speechSynthesis.getVoices();
    const vs = voiceList.filter(v => /^en([-_]|$)/i.test(v.lang));
    voice = vs.find(v => /samantha|ava|allison|google us english/i.test(v.name))
         || vs.find(v => /en[-_]US/i.test(v.lang) && v.localService)
         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
  }catch(e){}
}
try{
  pickVoice();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  else speechSynthesis.onvoiceschanged = pickVoice;
}catch(e){}
let lastUtter = null, speakTimer = null;
function speak(text, rate){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    if(!voiceList.length) pickVoice();
    const ss = speechSynthesis;
    const go = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voice ? voice.lang.replace('_', '-') : 'en-US';
      if(voice) u.voice = voice;
      u.rate = rate || .9; u.volume = 1;
      lastUtter = u;                  // 크롬 버그: 참조를 안 잡아 두면 중간에 끊기는 경우가 있음
      try{ ss.resume(); }catch(e){}
      ss.speak(u);
    };
    checkVoiceOnce();
    clearTimeout(speakTimer);
    // 안드로이드 크롬은 cancel() 직후 바로 speak()하면 소리가 씹히는 문제가 있어 잠깐 쉬었다가 말한다
    if(ss.speaking || ss.pending){ ss.cancel(); speakTimer = setTimeout(go, 120); }
    else go();
  }catch(e){}
}
let voiceWarned = false;
function checkVoiceOnce(){
  if(voiceWarned || !window.speechSynthesis) return;
  setTimeout(() => {
    pickVoice();
    if(voiceWarned) return;
    if(!voiceList.filter(v => /^en([-_]|$)/i.test(v.lang)).length){
      voiceWarned = true;
      toast('이 폰에 영어 음성이 없어 읽어주기가 안 나와요 · 가족 탭 → 소리 테스트 참고');
    }
  }, 1500);
}
function stopSpeech(){ try{ clearTimeout(speakTimer); if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){} }
function soundReport(){
  const en = voiceList.filter(v => /^en([-_]|$)/i.test(v.lang));

    tts: !!window.speechSynthesis,

  };
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null;
function listenOnce(cb){
  stopSpeech();
  try{
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3;
    let done = false;
    rec.onresult = e => { done = true; const alts = Array.from(e.results[0]).map(a => a.transcript); cb(alts[0] || ''); };
    rec.onerror = () => { if(!done){ done = true; cb(null); } };
    rec.onend = () => { if(!done){ done = true; cb(null); } };
    rec.start();
  }catch(e){ cb(null); }
}
function stopSR(){ try{ rec && rec.stop(); }catch(e){} rec = null; }
