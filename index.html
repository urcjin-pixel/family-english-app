  if(wordsNeedSave) await saveWords();
  try{
    const m = await storageGet(memberKey(), true);
    const parsed = m ? JSON.parse(m.value) : [];
    membersNeedSave = parsed.some(item=>typeof item==='string'||!item.character);
    // 이전 버전 데이터(이름 문자열만 저장) 호환: {name, pin:null} 형태로 변환
    members = normalizeMembers(parsed);
    if(members.length === 0){
      // 최초 실행: '장진우'를 관리자로 미리 생성해서 고정
      members = [{name:'장진우', role:'admin', character:CHARACTER_OPTIONS[0].id}];
      membersNeedSave = true;
    }
  }catch(e){ members = []; }
  try{
    const b = await storageGet(batchKey(), true);
    currentBatch = b ? (parseInt(b.value, 10) || 1) : 1;
  }catch(e){ currentBatch = 1; }
  if((await migrateMemberPins())||membersNeedSave) await saveMembers();
  startFirebaseListener();
  renderPassengers();
  render();
}

async function saveBatch(){
  await storageSet(batchKey(), String(currentBatch), true);
}

// 현재 세트에 속하거나, 이전 세트에서 아직 오답이 더 많은(복습이 덜 된) 단어를 "학습 활성" 상태로 취급
function isWordActive(w){
  if((w.batch || 1) === currentBatch) return true;
  const pr = progress[w.id];
  return !!(pr && (pr.wrong||0) > (pr.correct||0));
}
function getActiveWords(){
  return words.filter(isWordActive);
}

async function saveMembers(removedNames){
  await syncMembersToFirebase(removedNames);
  await storageSet(memberKey(), JSON.stringify(members), true);
}
async function syncMembersToFirebase(removedNames){
  if(!fbDb){
    return;
  }
  try{
    // 여러 기기가 동시에 접속해 있을 때, 이 기기의 오래된 캐시가 다른 기기가 방금
    // 반영한 값(예: 방금 설정한 관리자 PIN)을 덮어써 버리는 것을 막기 위해
    // Firebase의 최신 값을 먼저 읽어와 이름 기준으로 병합한 뒤 저장한다.
    const snap = await fbDb.ref('family/memberList').once('value');
    const remote = snap.val();
    let remoteList = normalizeMembers(Array.isArray(remote) ? remote.filter(Boolean) : Object.values(remote || {}).filter(Boolean));
    if(removedNames && removedNames.length){
      remoteList = remoteList.filter(m=>!removedNames.includes(m.name));
    }
    const byName = new Map();
    remoteList.forEach(m=>byName.set(m.name, Object.assign({}, m)));
    members.forEach(m=>{
      const prev = byName.get(m.name) || {};
      byName.set(m.name, {
        name: m.name,
        role: m.role || prev.role || 'learner',
        character: characterInfo(m.character || prev.character).id,
        pinHash: m.pinHash || prev.pinHash || null,
        pinSalt: m.pinSalt || prev.pinSalt || null
      });
    });
    members = Array.from(byName.values());
    const safeMembers = members.map(({name,role,character,pinHash,pinSalt})=>({name,role:role||'learner',character:characterInfo(character).id,pinHash:pinHash||null,pinSalt:pinSalt||null}));
    await fbDb.ref('family/memberList').set(safeMembers);
  }catch(e){}
}

function pickNextWord(sourceOverride){
  if(words.length===0) return null;
  const pool = sourceOverride || getActiveWords();
  const source = pool.length ? pool : words;
  // weight by wrong count and staleness
  const weighted = source.map(w=>{
    const p = progress[w.id] || {correct:0, wrong:0, lastSeen:0};
    const weight = 1 + p.wrong*2 - Math.min(p.correct,3)*0.3;
    return {w, weight: Math.max(weight, 0.2)};
  });
  const total = weighted.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(const x of weighted){
    r -= x.weight;
    if(r<=0) return x.w.id;
  }
  return weighted[0].w.id;
}

function getTodayPlan(){
  const now = Date.now();
  const key=todayKey();
  const day=dailyHistory[key]||(dailyHistory[key]={newWords:0,reviews:0,conversation:0,correct:0,wrong:0});
  if(day.plan){
    return {review:(day.plan.reviewIds||[]).map(id=>VOCAB_WORDS.find(w=>w.id===id)).filter(Boolean),fresh:(day.plan.newIds||[]).map(id=>VOCAB_WORDS.find(w=>w.id===id)).filter(Boolean),conversation:5};
  }
  const review = VOCAB_WORDS.filter(w=>{
    const p=vocabProgress[w.id]; return p && (p.correct||p.wrong) && (p.nextReview||0)<=now;
  }).sort((a,b)=>(vocabProgress[a.id].nextReview||0)-(vocabProgress[b.id].nextReview||0)).slice(0,7);
  const fresh = VOCAB_WORDS.filter(w=>{ const p=vocabProgress[w.id]; return !p || !(p.correct||0); }).slice(0,10);
  day.plan={reviewIds:review.map(w=>w.id),newIds:fresh.map(w=>w.id)};
  if(currentUser) storageSet(dailyHistoryKey(currentUser),JSON.stringify(dailyHistory),false);
  return {review,fresh,conversation:5};
}
function getTodayGrammarPlan(){
  const lvl = nextUnlockedGrammarLevel();
  const points = GRAMMAR_POINTS.filter(g=>g.level===lvl);
  let fresh = points.filter(g=>!(grammarProgress[g.id]?.correct));
  if(fresh.length===0) fresh = points;
  return shuffle([...fresh]).slice(0,2);
}

function advanceTodayPhase(){
  const s=todaySession;
  if(!s) return;
  const hasGrammar = s.grammarIds && s.grammarIds.length;
  if(!s.phase){ s.phase=s.reviewIds.length?'review':s.newIds.length?'new':hasGrammar?'grammar':'conversation'; s.index=0; }
  if(s.phase==='review' && s.index>=s.reviewIds.length){ s.phase=s.newIds.length?'new':hasGrammar?'grammar':'conversation'; s.index=0; s.currentQ=null; }
  if(s.phase==='new' && s.index>=s.newIds.length){ s.phase=hasGrammar?'grammar':'conversation'; s.index=0; s.currentQ=null; }
  if(s.phase==='grammar' && s.index>=(hasGrammar?s.grammarIds.length:0)){ s.phase='conversation'; s.index=0; s.currentQ=null; }
  if(s.phase==='conversation' && s.index>=s.convRemaining){ s.phase='done'; s.currentQ=null; }
}

function getConversationPool(filter=conversationFilter){
  if(filter==='review'){
    const now=Date.now();
    return words.filter(w=>{const p=progress[w.id];return p&&(p.lastResult==='wrong'||(p.nextReview||Infinity)<=now);});
  }
  return filter==='all'?words:words.filter(w=>w.category===filter);
}
function conversationCourseStats(id){
  const pool=getConversationPool(id);
  const now=Date.now();
  const learned=pool.filter(w=>{const p=progress[w.id];return p&&((p.correct||0)+(p.wrong||0)>0);}).length;
  const mastered=pool.filter(w=>(progress[w.id]?.stage||0)>=4).length;
  const due=pool.filter(w=>{const p=progress[w.id];return p&&(p.lastResult==='wrong'||(p.nextReview||Infinity)<=now);}).length;
  return {total:pool.length,learned,mastered,due,pct:pool.length?Math.round(mastered/pool.length*100):0};
}

function renderStudyQuestion(c){
  const coursePool=getConversationPool();
  if(coursePool.length < 1){
    c.innerHTML = '<div class="empty">지금 복습할 회화가 없어요.<br>다른 코스를 선택해 주세요.</div>';
    return;
  }
  if(!studyState){
    const activePool = coursePool.filter(isWordActive);
    const source = activePool.length ? activePool : coursePool;
    const questionWords = source.filter(w=>w.en.trim().endsWith('?'));
    const listenWords = questionWords.filter(w=>SPEAK_ANSWER_BANK[w.en]);
    const blankEligible = source.some(w=>tokenizeSentence(w.en).some(isBlankCandidate));
    const modes = ['quiz'];
    if(blankEligible) modes.push('blank');
    if(questionWords.length > 0) modes.push('speak');
    if(listenWords.length > 0) modes.push('listen');
    const mode = modes[Math.floor(Math.random()*modes.length)];
    if(mode === 'blank'){
      const bWord = pickBlankWord(source);
      const q = bWord ? buildBlankQuestion(bWord) : null;
      if(q){
        studyState = Object.assign({mode:'blank'}, q);
      }else{
        const wordId = pickNextWord(source);
        const qWord = words.find(w=>w.id===wordId);
        studyState = Object.assign({mode:'quiz'}, buildQuizQuestion(qWord));
      }
    }else if(mode === 'speak'){
      const weighted = questionWords.map(w=>{
        const pr = progress[w.id] || {correct:0, wrong:0};
        const weight = 1 + (pr.wrong||0)*2 - Math.min(pr.correct||0,3)*0.3;
        return {w, weight: Math.max(weight, 0.2)};
      });
      const total = weighted.reduce((s,x)=>s+x.weight,0);
      let r = Math.random()*total;
      let chosen = weighted[0].w;
      for(const x of weighted){ r -= x.weight; if(r<=0){ chosen = x.w; break; } }
      speakState = {wordId: chosen.id, transcript:'', listening:false, loading:false, result:null};
      studyState = {mode:'speak', wordId: chosen.id};
    }else if(mode === 'listen'){
      const weighted = listenWords.map(w=>{
        const pr = progress[w.id] || {correct:0, wrong:0};
        const weight = 1 + (pr.wrong||0)*2 - Math.min(pr.correct||0,3)*0.3;
        return {w, weight: Math.max(weight, 0.2)};
      });
      const total = weighted.reduce((s,x)=>s+x.weight,0);
      let r = Math.random()*total;
      let chosen = weighted[0].w;
      for(const x of weighted){ r -= x.weight; if(r<=0){ chosen = x.w; break; } }
      studyState = Object.assign({mode:'listen', revealed:false, played:false}, buildListenQuestion(chosen));
    }else{
      const wordId = pickNextWord(source);
      const word = words.find(w=>w.id===wordId);
      studyState = Object.assign({mode:'quiz'}, buildQuizQuestion(word));
    }
  }
  if(studyState.mode === 'speak'){
    return renderSpeak(c);
  }
  if(studyState.mode === 'listen'){
    return renderStudyListen(c);
  }
  const word = words.find(w=>w.id===studyState.wordId);
  if(!word){ studyState = null; return render(); }
  const p = progress[word.id] || {correct:0, wrong:0};
  const scoreHtml = `<div class="quiz-score">정답 ${Object.values(progress).reduce((s,x)=>s+(x.correct||0),0)} · 오답 ${Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0)}</div>`;
  const modeTag = `<div style="font-family:'Gaegu', sans-serif; font-size:calc(11px * var(--s)); opacity:0.68; margin-bottom:8px;"><span class="difficulty-badge">${DIFFICULTY_LABELS[word.difficulty]||'일상'}</span>STUDY · ${studyState.mode==='quiz' ? '4지선다' : '빈칸 채우기'}</div>`;

  if(studyState.mode === 'quiz'){
    c.innerHTML = `
      ${modeTag}${scoreHtml}
      <div class="quiz-q">
        <div class="quiz-q-label">이 뜻에 맞는 영어 표현은?</div>
        <div class="quiz-q-word">${escapeHtml(word.ko)}</div>
      </div>
      <div id="studyOptions"></div>
    `;
    const optWrap = document.getElementById('studyOptions');
    studyState.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt;
      b.onclick = async ()=>{
        if(studyState.answered) return;
        studyState.answered = true;
        const correct = opt === word.en;
        if(correct){ p.correct = (p.correct||0)+1; b.classList.add('correct'); sfxCorrect(); }
        else{
          p.wrong = (p.wrong||0)+1;
          b.classList.add('wrong');
          sfxWrong();
          [...optWrap.children].forEach(ch=>{ if(ch.textContent===word.en) ch.classList.add('correct'); });
        }
        trackConversationOutcome(p, correct);
        progress[word.id] = p;
        await saveProgress();
        [...optWrap.children].forEach(ch=>ch.disabled=true);
        setTimeout(()=>{ studyState = null; sfxNext(); render(); }, 900);
      };
      optWrap.appendChild(b);
    });
  }else{
    const sentenceHtml = studyState.tokens.map((tok, i)=>{
      if(i===studyState.blankIndex) return '<span style="display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);text-align:center;">&nbsp;</span>';
      return escapeHtml(tok);
    }).join('');
    c.innerHTML = `
      ${modeTag}${scoreHtml}
      <div class="quiz-q">
        <div class="quiz-q-label">빈칸에 알맞은 단어는?</div>
        <div class="quiz-q-ko">${escapeHtml(word.ko)}</div>
        <div class="quiz-q-word" style="font-size:calc(20px * var(--s));line-height:1.6;">${sentenceHtml}</div>
      </div>
      <div id="studyOptions"></div>
    `;
    const optWrap = document.getElementById('studyOptions');
    studyState.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt;
      b.onclick = async ()=>{
        if(studyState.answered) return;
        studyState.answered = true;
        const correct = opt.toLowerCase() === studyState.answer.toLowerCase();
        if(correct){ p.correct = (p.correct||0)+1; b.classList.add('correct'); sfxCorrect(); }
        else{
          p.wrong = (p.wrong||0)+1;
          b.classList.add('wrong');
          sfxWrong();
          [...optWrap.children].forEach(ch=>{ if(ch.textContent.toLowerCase()===studyState.answer.toLowerCase()) ch.classList.add('correct'); });
        }
        trackConversationOutcome(p, correct);
        progress[word.id] = p;
        await saveProgress();
        [...optWrap.children].forEach(ch=>ch.disabled=true);
        setTimeout(()=>{ studyState = null; sfxNext(); render(); }, 900);
      };
      optWrap.appendChild(b);
    });
  }
}

function buildQuizQuestion(word){
  const pool = words.filter(w=>w.id!==word.id);
  shuffle(pool);
  const distractors = pool.slice(0,3).map(w=>w.en);
  const options = shuffle([word.en, ...distractors]);
  return {wordId: word.id, options, answered:false};
}

function buildListenQuestion(word){
  const bank = SPEAK_ANSWER_BANK[word.en];
  const correctText = bank.modelAnswer;
  const otherAnswers = Object.keys(SPEAK_ANSWER_BANK)
    .filter(k=>k!==word.en)
    .map(k=>SPEAK_ANSWER_BANK[k].modelAnswer);
  shuffle(otherAnswers);
  const distractors = otherAnswers.slice(0,3);
  const options = shuffle([correctText, ...distractors]);
  return {wordId: word.id, options, correctText, answered:false};
}

        });
      }
      trackConversationOutcome(p, correct);
      progress[word.id] = p;
      await saveProgress();
      [...optWrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        quizState = null;
        render();
      }, 900);
      render_scoreOnly();
    };
    optWrap.appendChild(b);
  });
}

// ---- 빈칸 채우기 모드 ----
const BLANK_STOPWORDS = new Set(['a','an','the','is','are','am','was','were','be','been','being',
  'i','you','he','she','it','we','they','my','your','his','her','its','our','their',
  'this','that','these','those','to','of','in','on','at','for','with','from','as',
  'and','but','or','so','not','no','do','does','did','has','have','had','will','would',
  'can','could','should','if','than','then','too','very','just','me','him','us','them',
  'up','out','about','into','over','again','there','here','who','what','when','where','how']);

function tokenizeSentence(sentence){
  // 알파벳(작은따옴표 포함) 토큰과 그 외(공백/구두점) 토큰을 순서대로 분리
  return sentence.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
}

function isBlankCandidate(token){
  const t = token.toLowerCase();
  return /^[a-z']+$/.test(t) && t.length >= 3 && !BLANK_STOPWORDS.has(t);
}

function buildBlankQuestion(word){
  const tokens = tokenizeSentence(word.en);
  let candidateIdx = [];
  tokens.forEach((tok, i)=>{ if(isBlankCandidate(tok)) candidateIdx.push(i); });
  if(candidateIdx.length===0){
    // 완화된 조건으로 재시도 (길이 2 이상, 불용어 제외 없이)
    tokens.forEach((tok, i)=>{ if(/^[A-Za-z']+$/.test(tok) && tok.length>=2) candidateIdx.push(i); });
  }
  if(candidateIdx.length===0) return null;
  const blankIndex = candidateIdx[Math.floor(Math.random()*candidateIdx.length)];
  const answer = tokens[blankIndex];

  // 다른 문장들에서 오답 후보 수집
  const pool = new Map(); // lowercase -> original casing
  words.forEach(w=>{
    if(w.id===word.id) return;
    tokenizeSentence(w.en).forEach(tok=>{
      if(isBlankCandidate(tok) && tok.toLowerCase() !== answer.toLowerCase()){
        if(!pool.has(tok.toLowerCase())) pool.set(tok.toLowerCase(), tok);
      }
    });
  });
  let distractors = shuffle([...pool.values()]).slice(0,3);
  const fallbackBank = ['happy','quickly','dinner','station','weather','friend','morning','trip','money','store'];
  let fi = 0;
  while(distractors.length < 3 && fi < fallbackBank.length){
    const cand = fallbackBank[fi++];
    if(cand.toLowerCase() !== answer.toLowerCase() && !distractors.includes(cand)) distractors.push(cand);
  }
  const options = shuffle([answer, ...distractors]);
  return {wordId: word.id, tokens, blankIndex, answer, options, answered:false};
}

function pickBlankWord(sourceOverride){
  const activePool = sourceOverride || getActiveWords();
  const source = activePool.length ? activePool : words;
  const candidates = source.filter(w=>{
    const tokens = tokenizeSentence(w.en);
    return tokens.some(isBlankCandidate);
  });
  if(candidates.length===0) return null;
  // 학습 진도가 낮은(오답이 많은) 문장이 더 자주 나오도록 가중치 적용
  const weighted = candidates.map(w=>{
    const p = progress[w.id] || {correct:0, wrong:0};
    const weight = 1 + (p.wrong||0)*2 - Math.min(p.correct||0,3)*0.3;
    return {w, weight: Math.max(weight, 0.2)};
  });
  const total = weighted.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(const x of weighted){
    r -= x.weight;
    if(r<=0) return x.w;
  }
  return weighted[0].w;
}

function renderBlank(c){
  const eligible = words.filter(w=>tokenizeSentence(w.en).some(isBlankCandidate));
  if(eligible.length < 4){
    c.innerHTML = '<div class="empty">빈칸 문제를 만들려면 3단어 이상인 문장이<br>4개 이상 있어야 해요. 단어장에서 문장을 추가해 주세요.</div>';
    return;
  }
  if(!blankState){
    let word = pickBlankWord();
    let q = word ? buildBlankQuestion(word) : null;
    let tries = 0;
    while(!q && tries < 5){
      word = pickBlankWord();
      q = word ? buildBlankQuestion(word) : null;
      tries++;
    }
    if(!q){
      c.innerHTML = '<div class="empty">빈칸 문제를 만들 수 있는 문장이 부족해요.</div>';
      return;
    }
    blankState = q;
  }
  const word = words.find(w=>w.id===blankState.wordId);
  const p = progress[word.id] || {correct:0, wrong:0};
  const sentenceHtml = blankState.tokens.map((tok, i)=>{
    if(i===blankState.blankIndex) return '<span style="display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);text-align:center;">&nbsp;</span>';
    return escapeHtml(tok);
  }).join('');
  c.innerHTML = `
    <div class="quiz-score">정답 ${Object.values(progress).reduce((s,x)=>s+(x.correct||0),0)} · 오답 ${Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0)}</div>
    <div class="quiz-q">
      <div class="quiz-q-label">빈칸에 알맞은 단어는? · ${escapeHtml(word.ko)}</div>
      <div class="quiz-q-word" style="font-size:calc(20px * var(--s));line-height:1.6;">${sentenceHtml}</div>
    </div>
    <div id="blankOptions"></div>
  `;
  const optWrap = document.getElementById('blankOptions');
  blankState.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = async ()=>{
      if(blankState.answered) return;
      blankState.answered = true;
      const correct = opt.toLowerCase() === blankState.answer.toLowerCase();
      if(correct){
        p.correct = (p.correct||0)+1;
        b.classList.add('correct');
      }else{
        p.wrong = (p.wrong||0)+1;
        b.classList.add('wrong');
        [...optWrap.children].forEach(ch=>{
          if(ch.textContent.toLowerCase()===blankState.answer.toLowerCase()) ch.classList.add('correct');
        });
      }
      trackConversationOutcome(p, correct);
      progress[word.id] = p;
      await saveProgress();
      [...optWrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        blankState = null;
        render();
      }, 900);
    };
    optWrap.appendChild(b);
  });
}

// ---- 말하기 연습 모드 (음성 인식 + 오프라인 표현 판별) ----
function getSpeechRecognitionClass(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function startRecognition(){
  const SR = getSpeechRecognitionClass();
  if(!SR || !speakState) return;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.onresult = (e)=>{
    let text = '';
    for(let i=0;i<e.results.length;i++){
      text += e.results[i][0].transcript;
    }
    if(speakState) speakState.transcript = text;
    const el = document.getElementById('speakAnswer');
    if(el) el.value = text;
  };
  recognition.onerror = ()=>{
    if(speakState) speakState.listening = false;
    toast('마이크 인식에 문제가 있어요. 직접 입력해도 괜찮아요.');
    render();
  };
  recognition.onend = ()=>{
    if(speakState) speakState.listening = false;
    render();
  };
  speakState.listening = true;
  try{ recognition.start(); }
  catch(e){ speakState.listening = false; }
  render();
}

function stopRecognition(){
  if(recognition){
    try{ recognition.stop(); }catch(e){}
  }
}

function setupShadowing(filter='all'){
  let pool=getConversationPool(filter);
  if(!pool.length) pool=words.slice();
  pool=pool.slice().sort((a,b)=>{
    const pa=progress[a.id]||{},pb=progress[b.id]||{};
    return ((pb.wrong||0)*2-(pb.correct||0))-((pa.wrong||0)*2-(pa.correct||0));
  });
  shadowState={wordIds:pool.map(w=>w.id),index:0,transcript:'',listening:false,checked:false,logged:false,filter};
  conversationView='shadowing';
  render();
}
function normalizeSpoken(text){
  return String(text||'').toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
}
function shadowMatch(target,actual){
  const targetWords=normalizeSpoken(target).split(' ').filter(w=>w.length>2&&!BLANK_STOPWORDS.has(w));
  const actualWords=new Set(normalizeSpoken(actual).split(' '));
  if(!targetWords.length) return normalizeSpoken(target)===normalizeSpoken(actual);
  return targetWords.filter(w=>actualWords.has(w)).length/targetWords.length>=0.6;
}
function startShadowRecognition(){
  const SR=getSpeechRecognitionClass();
  if(!SR||!shadowState)return;
  recognition=new SR();recognition.lang='en-US';recognition.interimResults=true;recognition.maxAlternatives=1;
  recognition.onresult=e=>{let value='';for(let i=0;i<e.results.length;i++)value+=e.results[i][0].transcript;if(shadowState)shadowState.transcript=value;const input=document.getElementById('shadowAnswer');if(input)input.value=value;};
  recognition.onerror=()=>{if(shadowState)shadowState.listening=false;toast('마이크 인식에 문제가 있어요. 직접 입력해도 괜찮아요.');render();};
  recognition.onend=()=>{if(shadowState)shadowState.listening=false;render();};
  shadowState.listening=true;try{recognition.start();}catch(e){shadowState.listening=false;}render();
}
function logShadowPractice(word){
  if(!shadowState||shadowState.logged)return;
  const p=progress[word.id]||{correct:0,wrong:0,stage:0,nextReview:0};
  p.shadowing=(p.shadowing||0)+1;p.lastSeen=Date.now();progress[word.id]=p;
  shadowState.logged=true;awardPoints(2);markDaily('shadowing',1);saveProgress();
}
function renderShadowing(c){
  if(!shadowState||!shadowState.wordIds.length){conversationView='courses';return renderConversationCourses(c);}
  const word=words.find(w=>w.id===shadowState.wordIds[shadowState.index]);
  if(!word){shadowState.index++;if(shadowState.index>=shadowState.wordIds.length){conversationView='courses';shadowState=null;}return render();}
  const SR=getSpeechRecognitionClass();
  const matched=shadowState.checked&&shadowMatch(word.en,shadowState.transcript);
  c.innerHTML=`<div class="study-toolbar"><button class="btn btn-ghost" id="shadowBack">← 코스</button><button class="btn btn-ghost" id="shadowListen">🔊 듣기</button><button class="btn btn-ghost" id="shadowSlow">🐢 천천히</button></div>
    <div class="pass" style="cursor:default"><div class="pass-top"><span>🎧 쉐도잉</span><span>${shadowState.index+1}/${shadowState.wordIds.length}</span></div><div class="pass-body"><div class="pass-word" style="font-size:calc(23px * var(--s))">${escapeHtml(word.en)}</div><div class="pass-hint">${escapeHtml(word.ko)}</div></div></div>
    <div class="form-row" style="margin-top:16px"><label>듣고 그대로 말해보세요</label><input type="text" id="shadowAnswer" value="${escapeHtml(shadowState.transcript)}" placeholder="음성 인식 결과를 확인할 수 있어요"></div>
    ${SR?`<button class="btn ${shadowState.listening?'btn-again listening':'btn-primary'}" id="shadowMic" style="width:100%">${shadowState.listening?'🎙️ 듣는 중...':'🎤 따라 말하기'}</button>`:`<div class="sync-note">이 브라우저에서는 직접 입력해 연습할 수 있어요.</div>`}
    <button class="btn btn-ghost" id="shadowCheck" style="width:100%;margin-top:9px">표현 확인</button>
    ${shadowState.checked?`<div class="shadow-compare"><div style="font-weight:700;color:${matched?'var(--green)':'var(--coral)'}">${matched?'✅ 핵심 표현이 잘 인식되었어요.':'🌱 몇 단어가 다르게 인식됐어요. 원문을 듣고 다시 말해보세요.'}</div><div class="shadow-label" style="margin-top:12px">내가 말한 문장</div><div>${escapeHtml(shadowState.transcript||'인식된 문장이 없어요.')}</div><div class="shadow-label" style="margin-top:10px">원문</div><div>${escapeHtml(word.en)}</div></div><div class="study-toolbar" style="margin-top:10px"><button class="btn btn-ghost" id="shadowRetry">다시 말하기</button><button class="btn btn-primary" id="shadowNext">다음 문장</button></div>`:''}`;
  document.getElementById('shadowBack').onclick=()=>{if(recognition)try{recognition.stop();}catch(e){}conversationView='courses';conversationFilter='all';shadowState=null;render();};
  document.getElementById('shadowListen').onclick=()=>speak(word.en);
  document.getElementById('shadowSlow').onclick=()=>speak(word.en,.72);
  const input=document.getElementById('shadowAnswer');input.oninput=()=>{shadowState.transcript=input.value;shadowState.checked=false;};
  if(SR)document.getElementById('shadowMic').onclick=()=>shadowState.listening?stopRecognition():startShadowRecognition();
  document.getElementById('shadowCheck').onclick=()=>{shadowState.transcript=input.value.trim();if(!shadowState.transcript){toast('문장을 말하거나 입력해 주세요');return;}shadowState.checked=true;logShadowPractice(word);render();};
  if(shadowState.checked){
    document.getElementById('shadowRetry').onclick=()=>{shadowState.transcript='';shadowState.checked=false;render();};
    document.getElementById('shadowNext').onclick=()=>{shadowState.index=(shadowState.index+1)%shadowState.wordIds.length;shadowState.transcript='';shadowState.checked=false;shadowState.logged=false;sfxNext();render();};
  }
}

async function gradeSpeakAnswer(word, answer, p){
  try{
    const ansLower = answer.toLowerCase();
    const bank = SPEAK_ANSWER_BANK[word.en];
    let appropriate, modelAnswer;
    if(bank){
      appropriate = bank.keywords.some(k=>ansLower.includes(k.toLowerCase()));
      modelAnswer = bank.modelAnswer;
    }else{
      // 정답 은행에 없는 문장(직접 추가한 질문 등)은 성실하게 영어로 답했는지만 확인
      const wc = ansLower.split(/\s+/).filter(Boolean).length;
      appropriate = wc >= 2 && /[a-z]/.test(ansLower);
      modelAnswer = word.example || word.en;
    }
    const feedback = appropriate
      ? '자연스러운 대답이에요!'
      : '조금 다른 대답이 필요해 보여요. 모범 답안을 확인해보세요.';
    if(!speakState) return;
    speakState.result = { appropriate, feedback, model_answer: modelAnswer };
    speakState.loading = false;
    if(appropriate){ p.correct = (p.correct||0)+1; sfxCorrect(); }
    else{ p.wrong = (p.wrong||0)+1; sfxWrong(); }
    trackConversationOutcome(p, appropriate);
    progress[word.id] = p;
    await saveProgress();
    render();
  }catch(e){
    if(!speakState) return;
    speakState.loading = false;
    speakState.result = { error:true };
    render();
  }
}

      <button class="btn btn-primary" id="submitSpeak" style="width:100%;" ${speakState.loading ? 'disabled' : ''}>${speakState.loading ? '판별 중...' : '판별하기'}</button>
    `;
  }

  c.innerHTML = `
    <div class="pass" style="cursor:default;">
      <div class="pass-top"><span>🌿 말하기 연습</span><span>🍀 ${(p.correct||0)}개 성공</span></div>
      <div class="pass-body">
        <div class="pass-word" style="font-size:calc(24px * var(--s));">${escapeHtml(word.en)}</div>
        <div class="pass-hint">${escapeHtml(word.ko)}</div>
      </div>
    </div>
    <div style="margin-top:18px;">${bottomHtml}</div>
  `;

  if(!speakState.result){
    const answerInput = document.getElementById('speakAnswer');
    answerInput.oninput = ()=>{ speakState.transcript = answerInput.value; };
    if(SR){
      document.getElementById('micBtn').onclick = ()=>{
        if(speakState.listening){ stopRecognition(); }
        else{ startRecognition(); }
      };
    }
    document.getElementById('submitSpeak').onclick = async ()=>{
      const answer = document.getElementById('speakAnswer').value.trim();
      if(!answer){ toast('답변을 말하거나 입력해 주세요'); return; }
      if(speakState.listening) stopRecognition();
      speakState.loading = true;
      render();
      await gradeSpeakAnswer(word, answer, p);
    };
  }else if(!speakState.result.error){
    document.getElementById('nextSpeak').onclick = ()=>{
      speakState = null;
      studyState = null;
      sfxNext();
      render();
    };
  }else{
    document.getElementById('retrySpeak').onclick = ()=>{
      speakState.result = null;
      render();
    };
  }
}

  if(vocabView === 'wrongnote'){

  if(!vocabSession){

  if(vocabSession.phase === 'flash') return renderVocabFlash(c);

  if(vocabSession.phase === 'choice1' || vocabSession.phase === 'choice2' || vocabSession.phase === 'retry') return renderVocabChoice(c);

}

function startMatchPhase(){
  const s = vocabSession;
  s.phase = 'match';
  const shuffled = shuffle([...s.wordIds]);
  s.matchGroups = [];
  for(let i=0;i<shuffled.length;i+=5){
    s.matchGroups.push(shuffled.slice(i,i+5));
  }
  s.matchGroupIndex = 0;
  setupMatchRound();
  render();
}

function setupMatchRound(){
  const s = vocabSession;
  const ids = s.matchGroups[s.matchGroupIndex];
  const wordsInGroup = ids.map(id=>VOCAB_WORDS.find(w=>w.id===id));
  s.matchState = {
    leftItems: shuffle(wordsInGroup.map(w=>({id:w.id, text:w.en}))),
    rightItems: shuffle(wordsInGroup.map(w=>({id:w.id, text:w.ko}))),
    selectedLeft: null,
    selectedRight: null,
    matchedIds: new Set(),
  };
}

function renderVocabMatch(c){
  const s = vocabSession;
  const theme = dayTheme(s.day); activeReactionEmoji = theme.emoji;
  const ms = s.matchState;
  const totalGroups = s.matchGroups.length;
  const leftHtml = ms.leftItems.map(item=>{
    const matched = ms.matchedIds.has(item.id);
    const selected = ms.selectedLeft === item.id;
    return `<button class="option match-btn ${matched?'correct':''} ${selected?'selected-match':''}" data-side="left" data-id="${item.id}" ${matched?'disabled':''}>${escapeHtml(item.text)}</button>`;
  }).join('');
  const rightHtml = ms.rightItems.map(item=>{
    const matched = ms.matchedIds.has(item.id);
    const selected = ms.selectedRight === item.id;
    return `<button class="option match-btn ${matched?'correct':''} ${selected?'selected-match':''}" data-side="right" data-id="${item.id}" ${matched?'disabled':''}>${escapeHtml(item.text)}</button>`;
  }).join('');
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.day}단계 · 짝짓기 (${s.matchGroupIndex+1}/${totalGroups}그룹)</div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">${leftHtml}</div>
      <div style="flex:1;">${rightHtml}</div>
    </div>
  `;
  c.querySelectorAll('.match-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const side = btn.dataset.side;
      const id = btn.dataset.id;
      if(side==='left') ms.selectedLeft = (ms.selectedLeft===id ? null : id);
      else ms.selectedRight = (ms.selectedRight===id ? null : id);
      if(ms.selectedLeft && ms.selectedRight){
        if(ms.selectedLeft === ms.selectedRight){
          const matchedId = ms.selectedLeft;
          ms.matchedIds.add(matchedId);
          ms.selectedLeft = null;
          ms.selectedRight = null;
          recordVocabCorrect(matchedId);
          sfxCorrect();
          toast(theme.emoji + ' 짝짜꿍! ' + randomPraise());
          render();
          if(ms.matchedIds.size === s.matchGroups[s.matchGroupIndex].length){
            setTimeout(()=>{
              sfxNext();
              if(s.matchGroupIndex < s.matchGroups.length-1){
                s.matchGroupIndex++;
                setupMatchRound();
                render();
              }else{
                startChoicePhase('choice1');
              }
            }, 500);
          }
        }else{
          recordVocabWrong(ms.selectedLeft);
          sfxWrong();
          toast('🤔 다시 시도해보세요');
          ms.selectedLeft = null;
          ms.selectedRight = null;
          render();
        }
      }else{
        render();
      }
    };
  });
}

function buildChoiceQuestion(id, isKo2En, labelSuffix){
  const word = VOCAB_WORDS.find(w=>w.id===id);
  const pool = VOCAB_WORDS.filter(w=>w.id!==id);
  shuffle(pool);
  const distractors = pool.slice(0,3);
  let options, correctText, promptText, promptLabel;
  if(isKo2En){
    options = shuffle([word, ...distractors].map(w=>w.en));
    correctText = word.en; promptText = word.ko; promptLabel = '이 뜻에 맞는 영단어는?' + (labelSuffix||'');
  }else{
    options = shuffle([word, ...distractors].map(w=>w.ko));
    correctText = word.ko; promptText = word.en; promptLabel = '이 단어의 뜻은?' + (labelSuffix||'');
  }
  return {wordId:id, options, correctText, promptText, promptLabel, answered:false, promptIsEnglish: !isKo2En};
}

function startChoicePhase(type){
  const s = vocabSession;
  s.phase = type;
  s.queue = shuffle([...s.wordIds]);
  nextChoiceQuestion();
  render();
}

function nextChoiceQuestion(){
  const s = vocabSession;
  if(s.queue.length === 0){
    if(s.phase === 'choice1'){ startChoicePhase('choice2'); }
    else{ startRetryPhase(); }
    return;
  }
  const id = s.queue.shift();
  s.currentQ = buildChoiceQuestion(id, s.phase === 'choice1');
}

function startRetryPhase(){
  const s = vocabSession;
  const wrongIds = [...s.wrongThisSession];
  if(wrongIds.length === 0){
    finishVocabSession();
    return;
  }
  s.phase = 'retry';
  s.queue = shuffle(wrongIds);
  s.retryStillWrong = new Set();
  nextRetryQuestion();
  render();
}

function nextRetryQuestion(){
  const s = vocabSession;
  if(s.queue.length === 0){
    if(s.retryStillWrong.size > 0){
      s.queue = shuffle([...s.retryStillWrong]);
      s.retryStillWrong = new Set();
      nextRetryQuestion();
      return;
    }else{
      finishVocabSession();
      return;
    }
  }
  const id = s.queue.shift();
  s.currentQ = buildChoiceQuestion(id, Math.random() < 0.5, ' (재확인)');
}

function renderVocabChoice(c){
  const s = vocabSession;
  const q = s.currentQ;
  const qWord = VOCAB_WORDS.find(w=>w.id===q.wordId);
  const theme = dayTheme(s.day); activeReactionEmoji = theme.emoji;
  const phaseLabel = s.phase==='choice1' ? '뜻→영단어 확인' : s.phase==='choice2' ? '영단어→뜻 확인' : '재확인 문제';
  const remaining = s.queue.length + (s.phase==='retry' && s.retryStillWrong ? s.retryStillWrong.size : 0) + 1;
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.day}단계 · ${phaseLabel} · 남은 ${remaining}개</div>
    <div class="quiz-q" style="border:2px solid ${theme.color}22;">
      <div class="quiz-q-label">${q.promptLabel}</div>
      <div class="quiz-q-word">${escapeHtml(q.promptText)}</div>
      ${posTag(qWord)}
      ${q.promptIsEnglish ? `<div style="margin-top:10px;"><button class="speak-btn" id="vocabChoiceSpeak" aria-label="발음 듣기">🔊</button></div>` : ''}
    </div>
    <div id="vocabOptions"></div>
  `;
  if(q.promptIsEnglish){
    document.getElementById('vocabChoiceSpeak').onclick = ()=>speak(q.promptText);
  }
  const wrap = document.getElementById('vocabOptions');
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>{
      if(q.answered) return;
      q.answered = true;
      const correct = opt === q.correctText;
      if(correct){
        b.classList.add('correct');
        recordVocabCorrect(q.wordId);
        sfxCorrect();
        toast(theme.emoji + ' ' + randomPraise());
      }else{
        b.classList.add('wrong');
        [...wrap.children].forEach(ch=>{ if(ch.textContent===q.correctText) ch.classList.add('correct'); });
        recordVocabWrong(q.wordId);
        sfxWrong();
        toast('🤔 다음엔 맞힐 수 있어요');
        if(s.phase === 'retry') s.retryStillWrong.add(q.wordId);
      }
      [...wrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        sfxNext();
        if(s.phase === 'retry') nextRetryQuestion();
        else nextChoiceQuestion();
        render();
      }, 700);
    };
    wrap.appendChild(b);
  });
}

function finishVocabSession(){
  const s = vocabSession;
  const wrongList = [...s.wrongThisSession].map(id=>VOCAB_WORDS.find(w=>w.id===id));
  if(!vocabCompletedDays.includes(s.day)){
    vocabCompletedDays.push(s.day);
    saveVocabDays();
  }
  s.phase = 'done';
  s.finalWrongList = wrongList;
  render();
}

  if(!member){ c.innerHTML='<div class="empty">가족을 먼저 선택해 주세요.</div>'; return; }
  const back='<button class="btn btn-ghost" id="settingsBack" style="width:100%;margin-bottom:18px">← 내 기록으로 돌아가기</button>';
  const characterCard=characterSettingsHtml(member);
  if(member.role!=='admin'){
    c.innerHTML=back+`<div class="section-title">내 설정</div>`+characterCard+`<div class="security-card"><div class="stat-name">${escapeHtml(member.name)} · 학습자</div><div class="sync-note">학습 기록은 같은 가족 학습장의 다른 기기와 자동으로 이어집니다.<br>단어장 편집·구성원 삭제 같은 중요한 설정은 관리자만 할 수 있어요.</div></div>`;
    bindCharacterSettings(member);
    document.getElementById('settingsBack').onclick=()=>activateTab('stats');
    return;
  }
  if(adminUnlocked) return renderManage(c);
  if(!memberHasPin(member)){
    c.innerHTML=back+characterCard+`<div class="section-title">관리자 PIN 만들기</div><div class="security-card"><div class="stat-name">처음 한 번만 설정해 주세요</div><div class="sync-note">단어 삭제·전체 초기화·가족 구성원 삭제 같은 중요한 기능을 보호합니다. PIN은 원문이 아닌 변환된 값으로 저장됩니다.</div><div class="form-row" style="margin-top:14px"><label>4자리 숫자 PIN</label><input id="newAdminPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn btn-primary" id="saveAdminPin" style="width:100%">PIN 설정하고 관리자 모드 열기</button></div>`;
    bindCharacterSettings(member);
    document.getElementById('settingsBack').onclick=()=>activateTab('stats');
    document.getElementById('saveAdminPin').onclick=async()=>{const pin=document.getElementById('newAdminPin').value;if(!/^\d{4}$/.test(pin)){toast('PIN은 4자리 숫자로 입력해 주세요');return;}await setMemberPin(member,pin);await saveMembers();adminUnlocked=true;renderPassengers();render();};
    return;
  }
  c.innerHTML=back+characterCard+`<div class="section-title">관리자 모드</div><div class="security-card"><div class="stat-name">${escapeHtml(member.name)} 관리자 확인</div><div class="sync-note">중요한 설정을 열려면 PIN을 입력해 주세요.</div><div class="form-row" style="margin-top:14px"><label>4자리 PIN</label><input id="adminPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn btn-primary" id="unlockAdmin" style="width:100%">관리자 모드 열기</button></div>`;
  bindCharacterSettings(member);
  document.getElementById('settingsBack').onclick=()=>activateTab('stats');
  const unlock=async()=>{const input=document.getElementById('adminPin');if(await verifyMemberPin(member,input.value)){adminUnlocked=true;renderPassengers();render();}else{toast('PIN이 일치하지 않아요');input.value='';input.focus();}};
  document.getElementById('unlockAdmin').onclick=unlock;
  document.getElementById('adminPin').onkeydown=e=>{if(e.key==='Enter')unlock();};
}

// ===== 문법 탭 렌더링 =====
function renderGrammar(c){
  if(grammarView === 'wrongnote'){
    return renderGrammarWrongNote(c);
  }
  if(!grammarSession){
    return renderGrammarLevels(c);
  }
  if(grammarSession.phase === 'concept') return renderGrammarConcept(c);
  if(grammarSession.phase === 'practice' || grammarSession.phase === 'retry') return renderGrammarPractice(c);
  if(grammarSession.phase === 'done') return renderGrammarDone(c);
}

function renderGrammarWrongNote(c){
  const wrongPoints = getWrongGrammarPoints().sort((a,b)=>(grammarProgress[b.id].wrong||0)-(grammarProgress[a.id].wrong||0));
  c.innerHTML = `
    <div class="section-title">오답노트</div>
    ${wrongPoints.length===0 ? '<div class="empty">아직 틀린 문법 포인트가 없어요!</div>' : '<div id="grammarWrongList"></div>'}
    <button class="btn btn-ghost" id="grammarBackFromWrongNote" style="width:100%;margin-top:16px;">문법 목록으로</button>
  `;
  if(wrongPoints.length){
    const list = document.getElementById('grammarWrongList');
    wrongPoints.forEach(g=>{
      const p = grammarProgress[g.id];
      const row = document.createElement('div');
      row.className = 'stat-card';
      row.innerHTML = `<div><div class="stat-name">${escapeHtml(g.title)}</div><div class="stat-detail">${escapeHtml(g.explain)} · ${g.level}단계</div></div><div><span class="stat-num good">${p.correct||0}</span> / <span class="stat-num bad">${p.wrong||0}</span></div>`;

function nextUnlockedGrammarLevel(){
  for(let lv=1; lv<=10; lv++){
    if(!grammarCompletedLevels.includes(lv)) return lv;
  }
  return 10; // 전부 완료했으면 마지막 단계 반복
}

function startGrammarSession(level){
  if(level > 1 && !grammarCompletedLevels.includes(level-1)){
    toast(`먼저 ${level-1}단계를 완료해야 열려요`);
    return;
  }
  const points = GRAMMAR_POINTS.filter(g=>g.level===level);
  grammarSession = {
    level,
    pointIds: points.map(g=>g.id),
    phase: 'concept',
    conceptIndex: 0,
    queue: [],
    wrongThisSession: new Set(),
    retryStillWrong: null,
    currentQ: null,
    finalWrongList: [],
  };
  familyBarExpanded = false; renderPassengers();
  render();
}

  `;

function buildGrammarQuestion(pointId, practiceIndex){
  const point = GRAMMAR_POINTS.find(g=>g.id===pointId);
  const pr = point.practice[practiceIndex % point.practice.length];
  return {pointId, promptTitle: point.title, q: pr.q, options: shuffle([...pr.options]), answer: pr.answer, answered:false};
}

function startGrammarPractice(){
  const s = grammarSession;
  s.phase = 'practice';
  const items = [];
  s.pointIds.forEach(id=>{
    const point = GRAMMAR_POINTS.find(g=>g.id===id);
    point.practice.forEach((pr,i)=>items.push({pointId:id, practiceIndex:i}));
  });
  s.queue = shuffle(items);
  nextGrammarPracticeQuestion();
  render();
}

function nextGrammarPracticeQuestion(){
  const s = grammarSession;
  if(s.queue.length === 0){
    startGrammarRetry();
    return;
  }
  const item = s.queue.shift();
  s.currentQ = buildGrammarQuestion(item.pointId, item.practiceIndex);
}

function startGrammarRetry(){
  const s = grammarSession;
  const wrongIds = [...s.wrongThisSession];
  if(wrongIds.length === 0){
    finishGrammarSession();
    return;
  }
  s.phase = 'retry';
  s.queue = shuffle(wrongIds);
  s.retryStillWrong = new Set();
  nextGrammarRetryQuestion();
  render();
}

function nextGrammarRetryQuestion(){
  const s = grammarSession;
  if(s.queue.length === 0){
    if(s.retryStillWrong.size > 0){
      s.queue = shuffle([...s.retryStillWrong]);
      s.retryStillWrong = new Set();
      nextGrammarRetryQuestion();
      return;
    }else{
      finishGrammarSession();
      return;
    }
  }
  const id = s.queue.shift();
  const point = GRAMMAR_POINTS.find(g=>g.id===id);
  const practiceIndex = Math.floor(Math.random()*point.practice.length);
  s.currentQ = buildGrammarQuestion(id, practiceIndex);
}

function renderGrammarPractice(c){
  const s = grammarSession;
  const theme = dayTheme(s.level); activeReactionEmoji = theme.emoji;
  const q = s.currentQ;
  const phaseLabel = s.phase==='practice' ? '연습문제' : '재확인 문제';
  const remaining = s.queue.length + (s.phase==='retry' && s.retryStillWrong ? s.retryStillWrong.size : 0) + 1;
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.level}단계 · ${phaseLabel} · 남은 ${remaining}개</div>
    <div class="quiz-q" style="border:2px solid ${theme.color}22;">
      <div class="quiz-q-label">${escapeHtml(q.promptTitle)}</div>
      <div class="quiz-q-word" style="font-size:calc(19px * var(--s)); line-height:1.6;">${escapeHtml(q.q)}</div>
    </div>
    <div id="grammarOptions"></div>
  `;
  const wrap = document.getElementById('grammarOptions');
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>{
      if(q.answered) return;
      q.answered = true;
      const correct = opt === q.answer;
      if(correct){
        b.classList.add('correct');
        recordGrammarCorrect(q.pointId);
        sfxCorrect();
        toast(theme.emoji + ' ' + randomPraise());
      }else{
        b.classList.add('wrong');
        [...wrap.children].forEach(ch=>{ if(ch.textContent===q.answer) ch.classList.add('correct'); });
        recordGrammarWrong(q.pointId);
        sfxWrong();
        toast('🤔 다음엔 맞힐 수 있어요');
        if(s.phase === 'retry') s.retryStillWrong.add(q.pointId);
      }
      [...wrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        sfxNext();
        if(s.phase === 'retry') nextGrammarRetryQuestion();
        else nextGrammarPracticeQuestion();
        render();
      }, 900);
    };
    wrap.appendChild(b);
  });
}

function finishGrammarSession(){
  const s = grammarSession;
  const wrongList = [...s.wrongThisSession].map(id=>GRAMMAR_POINTS.find(g=>g.id===id));
  if(!grammarCompletedLevels.includes(s.level)){
    grammarCompletedLevels.push(s.level);
    saveGrammarLevels();
  }
  s.phase = 'done';
  s.finalWrongList = wrongList;
  render();
}

  const s = grammarSession;
  const theme = dayTheme(s.level); activeReactionEmoji = theme.emoji;
  const list = s.finalWrongList || [];
  if(!s.confettiShown){ s.confettiShown = true; spawnConfetti(list.length===0 ? 32 : 22); }
  c.innerHTML = `
    <div class="pass" style="cursor:default; background:${theme.bg};">
      <div class="pass-top" style="background:${theme.color};"><span>🎉 ${s.level}단계 완료</span><span>10/10</span></div>

        <div class="pass-hint">${list.length ? '🎉🎊 헷갈렸던 포인트 ' + list.length + '개는 오답노트에 저장됐어요' : '🌟 한 번도 틀리지 않았어요, 완벽해요!'}</div>

  document.getElementById('grammarBackToLevels').onclick = ()=>{
    grammarSession = null;
    grammarView = 'levels';
    render();
  };
}

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '삭제';
      del.onclick = async ()=>{
        if(!confirm(`${m.name}님을 가족 목록에서 삭제할까요?\n학습 기록은 지워지지 않고 남아있어요.`)) return;
        members = members.filter(x=>x.name !== m.name);
        await saveMembers([m.name]);
        toast(`${m.name}님을 삭제했어요`);
        renderPassengers();
        render();
      };
      row.appendChild(del);
    }
    memberList.appendChild(row);
  });
  document.getElementById('btnNextBatch').onclick = async ()=>{
    if(confirm(`${currentBatch}회차에서 ${currentBatch+1}회차로 넘어갈까요?\n기존 단어와 학습 기록은 그대로 남고, 앞으로 추가하는 단어는 새 회차로 분류돼요.`)){
      currentBatch += 1;
      await saveBatch();
      toast(`${currentBatch}회차를 시작해요!`);
      render();
    }
  };
  document.getElementById('btnMergeNew').onclick = async ()=>{
    const existing = new Set(words.map(w=>w.en.trim().toLowerCase()));
    const fresh = defaultWords().filter(w=>!existing.has(w.en.trim().toLowerCase()));
    if(fresh.length===0){
      toast('이미 모든 기본 문장이 들어있어요');
      return;
    }
    if(!confirm(`기본 문장 중 아직 없는 ${fresh.length}개를 현재 회차(${currentBatch}회차)로 추가할까요?\n기존 단어와 학습 기록은 그대로 유지돼요.`)) return;
    fresh.forEach(w=>{ w.batch = currentBatch; });
    words = [...words, ...fresh];
    await saveWords();
    toast(`${fresh.length}개의 새 문장이 추가됐어요!`);
    render();
  };
  document.getElementById('btnReset').onclick = async ()=>{
    if(confirm('회화 단어장과 회차만 기본값으로 되돌릴까요? 가족별 학습 기록은 유지됩니다.')){
      words = defaultWords();
      currentBatch = 1;
      await saveWords();
      await saveBatch();
      toast('기본 대화 표현으로 초기화되었어요');
      render();
    }
  };
  document.getElementById('btnAdd').onclick = async ()=>{
    const en = document.getElementById('inEn').value.trim();
    const ko = document.getElementById('inKo').value.trim();
    const ex = document.getElementById('inEx').value.trim();
    const category = document.getElementById('inCategory').value;
    const difficulty = document.getElementById('inDifficulty').value;
    if(!en || !ko){ toast('영어와 한글 뜻을 모두 입력해 주세요'); return; }
    words.push({id:uid(),en,ko,example:ex,batch:currentBatch,category,difficulty});
    await saveWords();
    toast('단어가 추가되었어요');
    render();
  };
  const list = document.getElementById('wordList');
  if(words.length===0){
    list.innerHTML = '<div class="empty">등록된 단어가 없어요.</div>';
  }
  words.slice().reverse().forEach(w=>{
    const item = document.createElement('div');
    item.className = 'word-item';
    const wb = w.batch || 1;
    const batchTagStyle = wb === currentBatch
      ? 'color:var(--teal-deep); font-weight:700;'
      : 'color:var(--ink); opacity:0.45;';
    const ci=courseInfo(w.category);
    item.innerHTML = `<div class="word-item-text"><span class="word-item-en">${escapeHtml(w.en)}</span><span class="word-item-ko">${escapeHtml(w.ko)}</span><div style="font-family:'Gaegu', sans-serif; font-size:calc(11px * var(--s)); margin-top:4px; ${batchTagStyle}">${wb}회차 · ${ci.emoji} ${ci.name} · ${DIFFICULTY_LABELS[w.difficulty]||'일상'}</div></div>`;
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '삭제';
    del.onclick = async ()=>{
      words = words.filter(x=>x.id!==w.id);
      await saveWords();
      render();
    };
    item.appendChild(del);
    list.appendChild(item);
  });
}

      btn.style.cursor = 'pointer';

          if(credits < item.price){ toast('크레딧이 부족해요!'); return; }

          equipItem(cat.id, item.id);
          await saveCredits(); await saveOwnedItems();
          toast(`🎉 ${item.name} 구매 완료!`);
          spawnConfetti(14);
          renderShop(c);
        };
      }else{
        btn.textContent = equipped ? '적용중' : '적용하기';
        btn.disabled = equipped && cat.id!=='furniture';
        btn.style.background = equipped ? 'var(--paper-2)' : 'var(--teal)';

          renderShop(c);

      row.appendChild(btn);

}

function renderStats(c){
  const vocabCorrect = Object.values(vocabProgress).reduce((s,x)=>s+(x.correct||0),0);
  const vocabWrong = Object.values(vocabProgress).reduce((s,x)=>s+(x.wrong||0),0);
  const convCorrect = Object.values(progress).reduce((s,x)=>s+(x.correct||0),0);
  const convWrong = Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0);
  const totalScore = Number(learningMeta.points) || (vocabCorrect + convCorrect);
  const level = vocabCompletedDays.length ? Math.max(...vocabCompletedDays) : 0;
  const learnedCount = Object.values(vocabProgress).filter(p=>p && (p.correct||p.wrong)).length;
  const masteredCount = Object.values(vocabProgress).filter(p=>(p.stage||0)>=4).length;
  const masteryRate = learnedCount ? Math.round(masteredCount/learnedCount*100) : 0;
  const dates=weekDates();
  const week=summarizeHistory(dailyHistory,dates);
  const previousDates=dates.map(d=>{const x=new Date(d);x.setDate(x.getDate()-7);return x;});
  const previousWeek=summarizeHistory(dailyHistory,previousDates);
  const month=summarizeHistory(dailyHistory,monthlyDates());
  const streak=computeStreak(dailyHistory);
  const growth=growthProfile(totalScore);
  const badges=learningBadges();
  const earnedBadges=badges.filter(x=>x.earned).length;
  const insight=weakLearningInsight();
  const shadowingCount=Object.values(progress).reduce((s,p)=>s+(p.shadowing||0),0);
  const weekChange=week.correct-previousWeek.correct;
  const weekMax=Math.max(1,...dates.map(d=>dayActivity(dailyHistory[dateKey(d)])));
  const calendar=dates.map((d,i)=>{const key=dateKey(d);const activity=dayActivity(dailyHistory[key]);return `<div class="week-day">${['월','화','수','목','금','토','일'][i]}<div class="day-mark ${activity?'done':''} ${key===todayKey()?'today':''}">${activity?'✓':'·'}</div></div>`;}).join('');
  const trends=dates.map((d,i)=>{const x=dailyHistory[dateKey(d)]||{};const count=dayActivity(x);return `<div class="trend-row"><span>${['월','화','수','목','금','토','일'][i]}요일</span><div class="trend-bar"><span style="width:${Math.round(count/weekMax*100)}%"></span></div><strong>${count}문제</strong></div>`;}).join('');

  c.innerHTML = `

    <div class="growth-hero"><div class="growth-avatar">${growthCharacter(currentMember(),totalScore)}</div><div><div class="mini-label">${characterInfo(currentMember()?.character).name} · 성장 ${growth.index}단계</div><div class="growth-title">${growth.current.title}</div><div class="growth-track"><span style="width:${growth.pct}%"></span></div><div class="sync-note" style="margin:0">${growth.next?`다음 성장까지 ${growth.remaining}점`:'최고 단계에 도달했어요!'}</div></div></div>
    <div class="stat-card" style="background:var(--teal-deep); border:none;">
      <div>
        <div class="stat-name" style="color:var(--white);">🏆 ${level}단계 클리어 · ⭐ ${totalScore}점</div>
        <div class="stat-detail" style="color:var(--white); opacity:0.85;">단어 숙련도 ${masteryRate}% · 회화 정답 ${convCorrect}</div>
      </div>
    </div>
    <div class="home-grid">
      <div class="mini-card"><div class="mini-label">연속 학습</div><div class="mini-value">🔥 ${streak}일</div></div>
      <div class="mini-card"><div class="mini-label">이번 주</div><div class="mini-value">✅ ${week.correct}개</div></div>
    </div>
    <div class="week-strip">${calendar}</div>
    <div class="today-card" style="box-shadow:none;margin-bottom:14px"><div class="today-head"><div class="today-title">이번 주 학습량</div><div class="today-time">약 ${week.minutes}분</div></div>${trends}</div>
    <div class="section-title">주간·월간 리포트</div>
    <div class="today-card" style="box-shadow:none;margin-bottom:16px"><div class="report-grid"><div class="report-metric"><span class="mini-label">이번 주 정답</span><strong>${week.correct}개</strong></div><div class="report-metric"><span class="mini-label">지난주 대비</span><strong>${weekChange>0?'+':''}${weekChange}개</strong></div><div class="report-metric"><span class="mini-label">이번 달 학습</span><strong>${month.correct+month.wrong}문제</strong></div><div class="report-metric"><span class="mini-label">쉐도잉 누적</span><strong>${shadowingCount}회</strong></div></div><div class="sync-note">이번 달 예상 학습 시간은 약 ${month.minutes}분이에요. ${weekChange>0?'지난주보다 학습량이 늘었어요!':'부담 없이 오늘 학습부터 이어가 보세요.'}</div></div>

  document.getElementById('goMyRoom').onclick = ()=>{ personalView='room'; render(); };

  words.forEach(w=>{
    const p = progress[w.id] || {correct:0, wrong:0};
    if((p.correct||0)===0 && (p.wrong||0)===0) return;
    const wb = w.batch || 1;
    const row = document.createElement('div');
    row.className = 'stat-card';
    row.innerHTML = `<div><div class="stat-name">${escapeHtml(w.en)}</div><div class="stat-detail">${escapeHtml(w.ko)} · ${wb}회차</div></div><div><span class="stat-num good">${p.correct||0}</span> / <span class="stat-num bad">${p.wrong||0}</span></div>`;
    list.appendChild(row);
  });
}

async function shareStats(name, stats){
  const text =
`🦊 가족 영어 학습장 - ${name}님의 기록

⭐ 총점: ${stats.totalScore}점
${stats.growthTitle?'🌿 성장 단계: '+stats.growthTitle+'\n':''}🏆 클리어한 단어 단계: ${stats.level}단계 / 10단계
🔥 연속 학습: ${stats.streak||0}일
📅 이번 주 정답: ${stats.weekCorrect||0}개
🗓️ 이번 달 학습: ${stats.monthProblems||0}문제
🎖️ 획득 배지: ${stats.earnedBadges||0}/${stats.totalBadges||9}
🔤 단어 학습: 정답 ${stats.vocabCorrect} · 오답 ${stats.vocabWrong}
📖 회화 학습: 정답 ${stats.convCorrect} · 오답 ${stats.convWrong}`;

  try{
    if(navigator.share){
      await navigator.share({ title: '가족 영어 학습장 기록', text });
      return;
    }
  }catch(e){
    // 공유 취소 등은 조용히 무시하고 아래 복사 방식으로 넘어가지 않음
    if(e && e.name === 'AbortError') return;
  }
  try{
    await navigator.clipboard.writeText(text);
    toast('기록이 복사됐어요! 원하는 곳에 붙여넣어 보세요');
  }catch(e){
    toast('공유에 실패했어요. 다시 시도해 주세요');
  }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
// ===== 효과음 (Web Audio API - 외부 파일 불필요) =====
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(freq, duration, type, delay, vol){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime + (delay||0);
    gain.gain.setValueAtTime(vol||0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }catch(e){}
}

let comboHideTimer = null;

  3: '🔥 3연속 정답! 좋아요!',
  5: '🔥🔥 5연속! 물오르고 있어요!',

function playCharacterReaction(correct){
  const widget = document.getElementById('comboWidget');
  const charEl = document.getElementById('comboChar');
  const countEl = document.getElementById('comboCount');
  if(!widget || !charEl || !countEl) return;
  charEl.textContent = activeReactionEmoji;
  if(correct && comboStreak >= 2){
    countEl.textContent = 'x' + comboStreak;
    countEl.style.display = 'inline';
    countEl.style.color = comboStreak >= 10 ? '#D4B106' : comboStreak >= 5 ? 'var(--teal-deep)' : 'var(--coral)';
  }else{
    countEl.style.display = 'none';
  }
  widget.classList.remove('bounce','wobble');
  void widget.offsetWidth;
  widget.classList.add('show', correct ? 'bounce' : 'wobble');
  clearTimeout(comboHideTimer);
  comboHideTimer = setTimeout(()=>{ widget.classList.remove('show'); }, correct ? 1300 : 900);
}

function speak(text, rate=0.95){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
const POS_COLOR = {'동사':'#5A6FD8','형용사':'#D24E9C','명사':'#2F9E8F','부사':'#E8A23D'};
function posTag(word){
  if(!word || !word.pos) return '';
  const color = POS_COLOR[word.pos] || 'var(--ink)';
  return `<span class="pos-tag" style="background:${color}22; color:${color};">${word.pos}</span>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
