<style>
  :root{
    --ink:#4A3728;
    --paper:#F6EFDD;
    --paper-2:#EDE0BE;
    --teal:#6FAE5C;
    --teal-deep:#4C7A3E;
    --amber:#F4C766;
    --coral:#E8836B;
    --green:#5B9C4C;
    --line: rgba(74,55,40,0.16);
    --white:#FFFBF2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .bg-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.16;
    z-index:-1;
    user-select:none;
    line-height:1;
  }

  /* 동물의 숲 스타일 헤더 */
  .board{
    background:linear-gradient(160deg, var(--teal-deep) 0%, var(--teal) 100%);
    color:var(--white);
    padding:24px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
  }
  .board::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:16px;
    background:
      radial-gradient(circle at 10px 0, transparent 10px, var(--paper) 11px) 0 0/20px 16px repeat-x;
  }
  .board-title{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
    margin:0 0 2px;
  }
  .board-sub{
    font-family:'Gaegu', sans-serif;
    font-size:13px;
    color:var(--amber);
    margin:0;
  }

  .passenger-row{
    display:flex;
    gap:8px;
    padding:14px 16px 6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .passenger-label{
    font-family:'Gaegu', sans-serif;
    font-size:11px;
    color:var(--ink);
    opacity:0.6;
    width:100%;
    margin-bottom:2px;
  }
  .chip{
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:7px 13px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    cursor:pointer;
    color:var(--ink);
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chip:active{ transform:scale(0.9); }
  .chip.active{
    background:var(--teal);
    color:var(--white);
    border-color:var(--teal);
  }
  .chip.add{
    border-style:dashed;
    color:var(--teal-deep);
  }

  /* Tabs styled like ticket stubs */
  .tabs{
    display:flex;
    padding:10px 16px 0;
    gap:6px;
    border-bottom:1.5px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px 12px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    opacity:0.55;
    cursor:pointer;
    border-bottom:3px solid transparent;
    background:none;
    border-left:none;border-right:none;border-top:none;
    font-family:'Gowun Dodum', sans-serif;
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }
  .tab:active{ transform:scale(0.92); }
  .tab.active{
    opacity:1;
    border-bottom:3px solid var(--amber);
    font-weight:700;
  }

  .content{
    flex:1;
    padding:20px 18px 40px;
  }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink);
    opacity:0.6;
    font-size:14px;
    line-height:1.7;
  }

  /* Boarding pass flashcard */
  .pass{
    background:var(--white);
    border-radius:14px;
    box-shadow:0 10px 24px rgba(74,55,40,0.14);
    overflow:hidden;
    position:relative;
    min-height:260px;
    cursor:pointer;
    user-select:none;
  }
  .pass-top{
    background:var(--teal);
    color:var(--white);
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Gaegu', sans-serif;
    font-size:11px;
    letter-spacing:0.5px;
  }
  .pass-body{
    padding:36px 22px 30px;
    text-align:center;
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
  .pass-word{
    font-family:'Gaegu', sans-serif;
    font-size:32px;
    font-weight:700;
    line-height:1.25;
  }
  .pass-hint{
    font-size:13px;
    color:var(--ink);
    opacity:0.5;
  }
  .pass-example{
    font-size:14px;
    color:var(--ink);
    opacity:0.75;
    margin-top:6px;
    line-height:1.6;
  }
  .perforation{
    position:relative;
    height:0;
    border-top:2px dashed var(--line);
    margin:0 18px;
  }
  .perforation::before, .perforation::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px; height:18px;
    background:var(--paper);
    border-radius:50%;
  }
  .perforation::before{ left:-27px; }
  .perforation::after{ right:-27px; }

  .pass-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:13px 10px;
    border-radius:10px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:'Gowun Dodum', sans-serif;
    transition:transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }
  .btn-know{ background:var(--green); color:var(--white); }
  .btn-again{ background:var(--coral); color:var(--white); }
  .btn-primary{ background:var(--teal-deep); color:var(--white); }
  .btn-ghost{ background:var(--white); color:var(--ink); border:1.5px solid var(--line); }
  .btn:active{ opacity:0.9; transform:scale(0.9); }
  .btn.listening{ animation: micPulse 1.2s infinite; }
  @keyframes micPulse{
    0%{ box-shadow:0 0 0 0 rgba(232,131,107,0.5); }
    70%{ box-shadow:0 0 0 14px rgba(232,131,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(232,131,107,0); }
  }

  .progress-line{
    font-family:'Gaegu', sans-serif;
    font-size:12px;
    opacity:0.55;
    text-align:center;
    margin-top:14px;
  }

  /* Quiz */
  .quiz-q{
    background:var(--white);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 8px 18px rgba(74,55,40,0.10);
    text-align:center;
    margin-bottom:16px;
  }
  .quiz-q-label{
    font-family:'Gaegu', sans-serif;
    font-size:11px;
    opacity:0.5;
    margin-bottom:8px;
  }
  .quiz-q-word{
    font-family:'Gaegu', sans-serif;
    font-size:26px;
    font-weight:700;
  }
  .quiz-q-ko{
    font-weight:700;
    font-size:17px;
    color:var(--coral);
    margin:8px 0 16px;
    line-height:1.5;
  }

const hasWidgetStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key, shared){
  if(hasWidgetStorage){
    try{ return await window.storage.get(key, shared); }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem('fea:' + key);
    return raw !== null ? {key, value: raw, shared} : null;
  }catch(e){ return null; }
}

async function storageSet(key, value, shared){
  if(hasWidgetStorage){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.setItem('fea:' + key, value);
    return {key, value, shared};
  }catch(e){ return null; }
}

  try{
    const p = await storageGet(vocabProgressKey(name), false);
    vocabProgress = p ? JSON.parse(p.value) : {};
  }catch(e){ vocabProgress = {}; }
  try{
    const d = await storageGet(vocabDaysKey(name), false);
    vocabCompletedDays = d ? JSON.parse(d.value) : [];
  }catch(e){ vocabCompletedDays = []; }
}
async function saveVocabProgress(){
  if(!currentUser) return;
  await storageSet(vocabProgressKey(currentUser), JSON.stringify(vocabProgress), false);
}
async function saveVocabDays(){
  if(!currentUser) return;
  await storageSet(vocabDaysKey(currentUser), JSON.stringify(vocabCompletedDays), false);
}
function recordVocabWrong(id){
  const p = vocabProgress[id] || {correct:0, wrong:0};
  p.wrong = (p.wrong||0)+1;
  vocabProgress[id] = p;
  if(vocabSession) vocabSession.wrongThisSession.add(id);
  saveVocabProgress();
}
function recordVocabCorrect(id){
  const p = vocabProgress[id] || {correct:0, wrong:0};
  p.correct = (p.correct||0)+1;
  vocabProgress[id] = p;
  saveVocabProgress();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function uid(){ return 'w_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

async function loadAll(){
  try{
    const w = await storageGet(STORAGE_WORDS, true);
    words = w ? JSON.parse(w.value) : defaultWords();
    if(!w){ await storageSet(STORAGE_WORDS, JSON.stringify(words), true); }
  }catch(e){
    words = defaultWords();
    try{ await storageSet(STORAGE_WORDS, JSON.stringify(words), true); }catch(e2){}
  }
  // 이전 버전 데이터(배치 정보 없음) 호환: 기본값 1세트로 취급
  words = words.map(w=> (w && w.batch == null) ? Object.assign({}, w, {batch:1}) : w);
  try{
    const m = await storageGet(memberKey(), true);
    const parsed = m ? JSON.parse(m.value) : [];
    // 이전 버전 데이터(이름 문자열만 저장) 호환: {name, pin:null} 형태로 변환
    members = parsed.map(x=> typeof x === 'string' ? {name:x, pin:null} : x);
  }catch(e){ members = []; }
  try{
    const b = await storageGet(batchKey(), true);
    currentBatch = b ? (parseInt(b.value, 10) || 1) : 1;
  }catch(e){ currentBatch = 1; }
  renderPassengers();
  render();
}

async function saveBatch(){
  await storageSet(batchKey(), String(currentBatch), true);
}

// 현재 세트에 속하거나, 이전 세트에서 아직 오답이 더 많은(복습이 덜 된) 단어를 "학습 활성" 상태로 취급
function isWordActive(w){
  if((w.batch || 1) === currentBatch) return true;
  const pr = progress[w.id];
  return !!(pr && (pr.wrong||0) > (pr.correct||0));
}
function getActiveWords(){
  return words.filter(isWordActive);
}

}

  }catch(e){ progress = {}; }
}

function switchToMember(name){
  currentUser = name;
  currentCardId = null;
  quizState = null;
  blankState = null;
  studyState = null;
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  speakState = null;
  vocabSession = null;
  vocabView = 'days';
  Promise.all([loadProgress(name), loadVocabState(name)]).then(()=>{ renderPassengers(); render(); });
}

function renderPassengers(){
  const row = document.getElementById('passengerRow');
  row.innerHTML = '<div class="passenger-label">탑승객 선택</div>';

  if(pinUnlockFor){
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.gap = '6px';
    wrap.style.alignItems = 'center';
    const label = document.createElement('span');
    label.textContent = pinUnlockFor + ' PIN';
    label.style.fontSize = '13px';
    const input = document.createElement('input');
    input.type = 'tel';
    input.inputMode = 'numeric';
    input.maxLength = 4;
    input.placeholder = '••••';
    input.style.padding = '7px 12px';
    input.style.borderRadius = '999px';
    input.style.border = '1.5px solid var(--line)';
    input.style.fontSize = '14px';
    input.style.width = '64px';
    input.style.letterSpacing = '3px';
    const tryUnlock = ()=>{
      const member = members.find(m=>m.name===pinUnlockFor);
      if(member && input.value === member.pin){
        const name = pinUnlockFor;
        pinUnlockFor = null;
        pinUnlockInput = '';
        switchToMember(name);
      }else{
        toast('PIN이 일치하지 않아요');
        input.value = '';
        input.focus();
      }
    };
    input.onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock(); };
    const okBtn = document.createElement('button');
    okBtn.className = 'chip';
    okBtn.textContent = '확인';
    okBtn.onclick = tryUnlock;
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'chip';
    cancelBtn.textContent = '취소';
    cancelBtn.onclick = ()=>{ pinUnlockFor = null; pinUnlockInput = ''; renderPassengers(); };
    wrap.appendChild(label);
    wrap.appendChild(input);
    wrap.appendChild(okBtn);
    wrap.appendChild(cancelBtn);
    row.appendChild(wrap);
    setTimeout(()=>input.focus(), 0);
    return;
  }

  members.forEach(member=>{
    const b = document.createElement('button');
    b.className = 'chip' + (currentUser===member.name ? ' active' : '');
    b.textContent = member.name + (member.pin ? ' 🔒' : '');
    b.onclick = ()=>{
      if(member.pin && currentUser !== member.name){
        pinUnlockFor = member.name;
        pinUnlockInput = '';
        renderPassengers();
      }else{
        switchToMember(member.name);
      }
    };
    row.appendChild(b);
  });

  if(addingMember){
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.gap = '6px';
    wrap.style.alignItems = 'center';
    wrap.style.flexWrap = 'wrap';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = '이름';
    nameInput.style.padding = '7px 12px';
    nameInput.style.borderRadius = '999px';
    nameInput.style.border = '1.5px solid var(--line)';
    nameInput.style.fontSize = '14px';
    nameInput.style.width = '90px';
    const pinInput = document.createElement('input');
    pinInput.type = 'tel';
    pinInput.inputMode = 'numeric';
    pinInput.maxLength = 4;
    pinInput.placeholder = 'PIN(선택)';
    pinInput.style.padding = '7px 12px';
    pinInput.style.borderRadius = '999px';
    pinInput.style.border = '1.5px solid var(--line)';
    pinInput.style.fontSize = '14px';
    pinInput.style.width = '80px';
    const confirmAdd = async ()=>{
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();
      if(!name){
        addingMember = false;
        renderPassengers();
        return;
      }
      if(pin && !/^\d{4}$/.test(pin)){
        toast('PIN은 4자리 숫자로 입력해 주세요');
        return;
      }
      const existing = members.find(m=>m.name===name);
      if(existing){
        if(existing.pin && existing.pin !== pin){
          addingMember = false;
          pinUnlockFor = name;
          pinUnlockInput = '';
          renderPassengers();
          return;
        }
        addingMember = false;
        switchToMember(name);
        return;
      }
      members.push({name, pin: pin || null});
      try{ await saveMembers(); }catch(e){}
      addingMember = false;
      progress = {};
      switchToMember(name);
    };
    nameInput.onkeydown = (e)=>{ if(e.key==='Enter') pinInput.focus(); };
    pinInput.onkeydown = (e)=>{ if(e.key==='Enter') confirmAdd(); };
    const okBtn = document.createElement('button');
    okBtn.className = 'chip';
    okBtn.textContent = '확인';
    okBtn.onclick = confirmAdd;
    wrap.appendChild(nameInput);
    wrap.appendChild(pinInput);
    wrap.appendChild(okBtn);
    row.appendChild(wrap);
    setTimeout(()=>nameInput.focus(), 0);
  }else{
    const add = document.createElement('button');
    add.className = 'chip add';
    add.textContent = '+ 가족 추가';
    add.onclick = ()=>{
      addingMember = true;
      renderPassengers();
    };
    row.appendChild(add);
  }
}

function pickNextWord(){
  if(words.length===0) return null;
  const pool = getActiveWords();
  const source = pool.length ? pool : words;
  // weight by wrong count and staleness
  const weighted = source.map(w=>{
    const p = progress[w.id] || {correct:0, wrong:0, lastSeen:0};
    const weight = 1 + p.wrong*2 - Math.min(p.correct,3)*0.3;
    return {w, weight: Math.max(weight, 0.2)};
  });
  const total = weighted.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(const x of weighted){
    r -= x.weight;
    if(r<=0) return x.w.id;
  }
  return weighted[0].w.id;
}

function render(){
  const c = document.getElementById('content');
  if(!currentUser){
    c.innerHTML = '<div class="empty">먼저 위에서 탑승객(가족 이름)을 선택하거나<br>추가해 주세요.</div>';
    return;
  }
  if(activeTab==='study') return renderStudy(c);
  if(activeTab==='vocab') return renderVocab(c);
  if(activeTab==='manage') return renderManage(c);
  if(activeTab==='stats') return renderStats(c);
}

function renderStudy(c){
  if(words.length < 4){
    c.innerHTML = '<div class="empty">학습을 진행하려면 단어/문장이 4개 이상 필요해요.<br>단어장에서 더 추가해 주세요.</div>';
    return;
  }
  if(!studyState){
    const activePool = getActiveWords();
    const source = activePool.length ? activePool : words;
    const questionWords = source.filter(w=>w.en.trim().endsWith('?'));
    const blankEligible = source.some(w=>tokenizeSentence(w.en).some(isBlankCandidate));
    const modes = ['quiz'];
    if(blankEligible) modes.push('blank');
    if(questionWords.length > 0) modes.push('speak');
    const mode = modes[Math.floor(Math.random()*modes.length)];
    if(mode === 'blank'){
      const bWord = pickBlankWord();
      const q = bWord ? buildBlankQuestion(bWord) : null;
      if(q){
        studyState = Object.assign({mode:'blank'}, q);
      }else{
        const wordId = pickNextWord();
        const qWord = words.find(w=>w.id===wordId);
        studyState = Object.assign({mode:'quiz'}, buildQuizQuestion(qWord));
      }
    }else if(mode === 'speak'){
      const weighted = questionWords.map(w=>{
        const pr = progress[w.id] || {correct:0, wrong:0};
        const weight = 1 + (pr.wrong||0)*2 - Math.min(pr.correct||0,3)*0.3;
        return {w, weight: Math.max(weight, 0.2)};
      });
      const total = weighted.reduce((s,x)=>s+x.weight,0);
      let r = Math.random()*total;
      let chosen = weighted[0].w;
      for(const x of weighted){ r -= x.weight; if(r<=0){ chosen = x.w; break; } }
      speakState = {wordId: chosen.id, transcript:'', listening:false, loading:false, result:null};
      studyState = {mode:'speak', wordId: chosen.id};
    }else{
      const wordId = pickNextWord();
      const word = words.find(w=>w.id===wordId);
      studyState = Object.assign({mode:'quiz'}, buildQuizQuestion(word));
    }
  }
  if(studyState.mode === 'speak'){
    return renderSpeak(c);
  }
  const word = words.find(w=>w.id===studyState.wordId);
  if(!word){ studyState = null; return renderStudy(c); }
  const p = progress[word.id] || {correct:0, wrong:0};
  const scoreHtml = `<div class="quiz-score">정답 ${Object.values(progress).reduce((s,x)=>s+(x.correct||0),0)} · 오답 ${Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0)}</div>`;
  const modeTag = `<div style="font-family:'Gaegu', sans-serif; font-size:11px; opacity:0.55; margin-bottom:8px;">STUDY · ${studyState.mode==='quiz' ? '4지선다' : '빈칸 채우기'}</div>`;

  if(studyState.mode === 'quiz'){
    c.innerHTML = `
      ${modeTag}${scoreHtml}
      <div class="quiz-q">
        <div class="quiz-q-label">이 뜻에 맞는 영어 표현은?</div>
        <div class="quiz-q-word">${escapeHtml(word.ko)}</div>
      </div>
      <div id="studyOptions"></div>
    `;
    const optWrap = document.getElementById('studyOptions');
    studyState.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt;
      b.onclick = async ()=>{
        if(studyState.answered) return;

        const correct = opt === word.en;
        if(correct){ p.correct = (p.correct||0)+1; b.classList.add('correct'); }
        else{
          p.wrong = (p.wrong||0)+1;
          b.classList.add('wrong');
          [...optWrap.children].forEach(ch=>{ if(ch.textContent===word.en) ch.classList.add('correct'); });
        }
        progress[word.id] = p;
        await saveProgress();
        [...optWrap.children].forEach(ch=>ch.disabled=true);
        setTimeout(()=>{ studyState = null; render(); }, 900);
      };
      optWrap.appendChild(b);
    });
  }else{
    const sentenceHtml = studyState.tokens.map((tok, i)=>{
      if(i===studyState.blankIndex) return '<span style="display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);text-align:center;">&nbsp;</span>';
      return escapeHtml(tok);
    }).join('');
    c.innerHTML = `
      ${modeTag}${scoreHtml}
      <div class="quiz-q">
        <div class="quiz-q-label">빈칸에 알맞은 단어는?</div>
        <div class="quiz-q-ko">${escapeHtml(word.ko)}</div>
        <div class="quiz-q-word" style="font-size:20px;line-height:1.6;">${sentenceHtml}</div>
      </div>
      <div id="studyOptions"></div>
    `;
    const optWrap = document.getElementById('studyOptions');
    studyState.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt;
      b.onclick = async ()=>{
        if(studyState.answered) return;
        studyState.answered = true;
        const correct = opt.toLowerCase() === studyState.answer.toLowerCase();
        if(correct){ p.correct = (p.correct||0)+1; b.classList.add('correct'); }
        else{
          p.wrong = (p.wrong||0)+1;
          b.classList.add('wrong');
          [...optWrap.children].forEach(ch=>{ if(ch.textContent.toLowerCase()===studyState.answer.toLowerCase()) ch.classList.add('correct'); });
        }
        progress[word.id] = p;
        await saveProgress();
        [...optWrap.children].forEach(ch=>ch.disabled=true);
        setTimeout(()=>{ studyState = null; render(); }, 900);
      };
      optWrap.appendChild(b);
    });
  }
}

function buildQuizQuestion(word){
  const pool = words.filter(w=>w.id!==word.id);
  shuffle(pool);
  const distractors = pool.slice(0,3).map(w=>w.en);
  const options = shuffle([word.en, ...distractors]);
  return {wordId: word.id, options, answered:false};
}

// ---- 빈칸 채우기 모드 ----
const BLANK_STOPWORDS = new Set(['a','an','the','is','are','am','was','were','be','been','being',
  'i','you','he','she','it','we','they','my','your','his','her','its','our','their',
  'this','that','these','those','to','of','in','on','at','for','with','from','as',
  'and','but','or','so','not','no','do','does','did','has','have','had','will','would',
  'can','could','should','if','than','then','too','very','just','me','him','us','them',
  'up','out','about','into','over','again','there','here','who','what','when','where','how']);

function tokenizeSentence(sentence){
  // 알파벳(작은따옴표 포함) 토큰과 그 외(공백/구두점) 토큰을 순서대로 분리
  return sentence.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
}

function isBlankCandidate(token){
  const t = token.toLowerCase();
  return /^[a-z']+$/.test(t) && t.length >= 3 && !BLANK_STOPWORDS.has(t);
}

function buildBlankQuestion(word){
  const tokens = tokenizeSentence(word.en);
  let candidateIdx = [];
  tokens.forEach((tok, i)=>{ if(isBlankCandidate(tok)) candidateIdx.push(i); });
  if(candidateIdx.length===0){
    // 완화된 조건으로 재시도 (길이 2 이상, 불용어 제외 없이)
    tokens.forEach((tok, i)=>{ if(/^[A-Za-z']+$/.test(tok) && tok.length>=2) candidateIdx.push(i); });
  }
  if(candidateIdx.length===0) return null;
  const blankIndex = candidateIdx[Math.floor(Math.random()*candidateIdx.length)];
  const answer = tokens[blankIndex];

  // 다른 문장들에서 오답 후보 수집
  const pool = new Map(); // lowercase -> original casing
  words.forEach(w=>{
    if(w.id===word.id) return;
    tokenizeSentence(w.en).forEach(tok=>{
      if(isBlankCandidate(tok) && tok.toLowerCase() !== answer.toLowerCase()){
        if(!pool.has(tok.toLowerCase())) pool.set(tok.toLowerCase(), tok);
      }
    });
  });
  let distractors = shuffle([...pool.values()]).slice(0,3);
  const fallbackBank = ['happy','quickly','dinner','station','weather','friend','morning','trip','money','store'];
  let fi = 0;
  while(distractors.length < 3 && fi < fallbackBank.length){
    const cand = fallbackBank[fi++];
    if(cand.toLowerCase() !== answer.toLowerCase() && !distractors.includes(cand)) distractors.push(cand);
  }
  const options = shuffle([answer, ...distractors]);
  return {wordId: word.id, tokens, blankIndex, answer, options, answered:false};
}

function pickBlankWord(){
  const activePool = getActiveWords();
  const source = activePool.length ? activePool : words;
  const candidates = source.filter(w=>{
    const tokens = tokenizeSentence(w.en);
    return tokens.some(isBlankCandidate);
  });
  if(candidates.length===0) return null;
  // 학습 진도가 낮은(오답이 많은) 문장이 더 자주 나오도록 가중치 적용
  const weighted = candidates.map(w=>{
    const p = progress[w.id] || {correct:0, wrong:0};
    const weight = 1 + (p.wrong||0)*2 - Math.min(p.correct||0,3)*0.3;
    return {w, weight: Math.max(weight, 0.2)};
  });
  const total = weighted.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(const x of weighted){
    r -= x.weight;
    if(r<=0) return x.w;
  }
  return weighted[0].w;
}

function renderBlank(c){
  const eligible = words.filter(w=>tokenizeSentence(w.en).some(isBlankCandidate));
  if(eligible.length < 4){
    c.innerHTML = '<div class="empty">빈칸 문제를 만들려면 3단어 이상인 문장이<br>4개 이상 있어야 해요. 단어장에서 문장을 추가해 주세요.</div>';
    return;
  }
  if(!blankState){
    let word = pickBlankWord();
    let q = word ? buildBlankQuestion(word) : null;
    let tries = 0;
    while(!q && tries < 5){
      word = pickBlankWord();
      q = word ? buildBlankQuestion(word) : null;
      tries++;
    }
    if(!q){
      c.innerHTML = '<div class="empty">빈칸 문제를 만들 수 있는 문장이 부족해요.</div>';
      return;
    }
    blankState = q;
  }
  const word = words.find(w=>w.id===blankState.wordId);
  const p = progress[word.id] || {correct:0, wrong:0};
  const sentenceHtml = blankState.tokens.map((tok, i)=>{
    if(i===blankState.blankIndex) return '<span style="display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);text-align:center;">&nbsp;</span>';
    return escapeHtml(tok);
  }).join('');
  c.innerHTML = `
    <div class="quiz-score">정답 ${Object.values(progress).reduce((s,x)=>s+(x.correct||0),0)} · 오답 ${Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0)}</div>
    <div class="quiz-q">
      <div class="quiz-q-label">빈칸에 알맞은 단어는? · ${escapeHtml(word.ko)}</div>
      <div class="quiz-q-word" style="font-size:20px;line-height:1.6;">${sentenceHtml}</div>
    </div>
    <div id="blankOptions"></div>
  `;
  const optWrap = document.getElementById('blankOptions');
  blankState.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = async ()=>{
      if(blankState.answered) return;
      blankState.answered = true;
      const correct = opt.toLowerCase() === blankState.answer.toLowerCase();
      if(correct){
        p.correct = (p.correct||0)+1;
        b.classList.add('correct');
      }else{
        p.wrong = (p.wrong||0)+1;
        b.classList.add('wrong');
        [...optWrap.children].forEach(ch=>{
          if(ch.textContent.toLowerCase()===blankState.answer.toLowerCase()) ch.classList.add('correct');
        });
      }
      progress[word.id] = p;
      await saveProgress();
      [...optWrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        blankState = null;
        render();
      }, 900);
    };
    optWrap.appendChild(b);
  });
}

// ---- 말하기 연습 모드 (음성 인식 + AI 판별) ----
function getSpeechRecognitionClass(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function startRecognition(){
  const SR = getSpeechRecognitionClass();
  if(!SR || !speakState) return;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.onresult = (e)=>{
    let text = '';
    for(let i=0;i<e.results.length;i++){
      text += e.results[i][0].transcript;
    }
    if(speakState) speakState.transcript = text;
    const el = document.getElementById('speakAnswer');
    if(el) el.value = text;
  };
  recognition.onerror = ()=>{
    if(speakState) speakState.listening = false;
    toast('마이크 인식에 문제가 있어요. 직접 입력해도 괜찮아요.');
    render();
  };
  recognition.onend = ()=>{
    if(speakState) speakState.listening = false;
    render();
  };
  speakState.listening = true;
  try{ recognition.start(); }
  catch(e){ speakState.listening = false; }
  render();
}

function stopRecognition(){
  if(recognition){
    try{ recognition.stop(); }catch(e){}
  }
}

async function gradeSpeakAnswer(word, answer, p){
  try{
    const ansLower = answer.toLowerCase();
    const bank = SPEAK_ANSWER_BANK[word.en];
    let appropriate, modelAnswer;
    if(bank){
      appropriate = bank.keywords.some(k=>ansLower.includes(k.toLowerCase()));
      modelAnswer = bank.modelAnswer;
    }else{
      // 정답 은행에 없는 문장(직접 추가한 질문 등)은 성실하게 영어로 답했는지만 확인
      const wc = ansLower.split(/\s+/).filter(Boolean).length;
      appropriate = wc >= 2 && /[a-z]/.test(ansLower);
      modelAnswer = word.example || word.en;
    }
    const feedback = appropriate
      ? '자연스러운 대답이에요!'
      : '조금 다른 대답이 필요해 보여요. 모범 답안을 확인해보세요.';
    if(!speakState) return;
    speakState.result = { appropriate, feedback, model_answer: modelAnswer };
    speakState.loading = false;
    if(appropriate){ p.correct = (p.correct||0)+1; }
    else{ p.wrong = (p.wrong||0)+1; }
    progress[word.id] = p;
    await saveProgress();
    render();
  }catch(e){
    if(!speakState) return;
    speakState.loading = false;
    speakState.result = { error:true };
    render();
  }
}

        <input type="text" id="speakAnswer" value="${escapeHtml(speakState.transcript)}" placeholder="영어로 답해보세요">
      </div>
      <button class="btn btn-primary" id="submitSpeak" style="width:100%;" ${speakState.loading ? 'disabled' : ''}>${speakState.loading ? '판별 중...' : '판별하기'}</button>
    `;
  }

  c.innerHTML = `
    <div class="pass" style="cursor:default;">
      <div class="pass-top"><span>🌿 말하기 연습</span><span>🍀 ${(p.correct||0)}개 성공</span></div>
      <div class="pass-body">
        <div class="pass-word" style="font-size:24px;">${escapeHtml(word.en)}</div>
        <div class="pass-hint">${escapeHtml(word.ko)}</div>
      </div>
    </div>
    <div style="margin-top:18px;">${bottomHtml}</div>
  `;

  if(!speakState.result){
    const answerInput = document.getElementById('speakAnswer');
    answerInput.oninput = ()=>{ speakState.transcript = answerInput.value; };
    if(SR){
      document.getElementById('micBtn').onclick = ()=>{
        if(speakState.listening){ stopRecognition(); }
        else{ startRecognition(); }
      };
    }
    document.getElementById('submitSpeak').onclick = async ()=>{
      const answer = document.getElementById('speakAnswer').value.trim();
      if(!answer){ toast('답변을 말하거나 입력해 주세요'); return; }
      if(speakState.listening) stopRecognition();
      speakState.loading = true;
      render();
      await gradeSpeakAnswer(word, answer, p);
    };
  }else if(!speakState.result.error){
    document.getElementById('nextSpeak').onclick = ()=>{
      speakState = null;
      studyState = null;
      render();
    };
  }else{
    document.getElementById('retrySpeak').onclick = ()=>{
      speakState.result = null;
      render();
    };
  }
}

// ===== 단어 탭 렌더링 =====
function renderVocab(c){
  if(vocabView === 'wrongnote'){
    return renderVocabWrongNote(c);
  }
  if(!vocabSession){
    return renderVocabDays(c);
  }
  if(vocabSession.phase === 'flash') return renderVocabFlash(c);
  if(vocabSession.phase === 'match') return renderVocabMatch(c);
  if(vocabSession.phase === 'choice1' || vocabSession.phase === 'choice2' || vocabSession.phase === 'retry') return renderVocabChoice(c);
  if(vocabSession.phase === 'done') return renderVocabDone(c);
}

        <div style="font-size:12px; opacity:0.65; margin-top:2px;">${(d-1)*20+1}~${d*20}번 단어</div>

function startVocabSession(day){
  const dayWords = VOCAB_WORDS.filter(w=>w.day===day);
  vocabSession = {
    day,
    wordIds: dayWords.map(w=>w.id),
    phase: 'flash',
    flashIndex: 0,
    flashFlipped: false,
    queue: [],
    wrongThisSession: new Set(),
    matchGroups: null,
    matchGroupIndex: 0,
    matchState: null,
    currentQ: null,
    retryStillWrong: null,
  };
  render();
}

function renderVocabFlash(c){
  const s = vocabSession;
  const theme = dayTheme(s.day);
  const word = VOCAB_WORDS.find(w=>w.id===s.wordIds[s.flashIndex]);
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.day}일차 · 플래시카드 ${s.flashIndex+1}/20</div>
    <div class="pass" id="vocabFlashCard" style="background:${theme.bg};">
      <div class="pass-top" style="background:${theme.color};"><span>${theme.emoji} ${theme.name}와 함께</span><span>${s.flashIndex+1}/20</span></div>
      <div class="pass-body">
        ${s.flashFlipped
          ? `<div class="pass-word" style="font-size:30px; color:${theme.color};">${escapeHtml(word.ko)}</div>`
          : `<div class="pass-word">${escapeHtml(word.en)}</div><div class="pass-hint">탭하면 뜻이 보여요</div>`
        }
      </div>
    </div>
    <button class="btn" id="vocabFlashNext" style="width:100%;margin-top:16px; background:${theme.color}; color:var(--white);">다음</button>
  `;
  document.getElementById('vocabFlashCard').onclick = ()=>{
    s.flashFlipped = !s.flashFlipped;
    render();
  };
  document.getElementById('vocabFlashNext').onclick = ()=>{
    if(s.flashIndex < s.wordIds.length-1){
      s.flashIndex++;
      s.flashFlipped = false;
      render();
    }else{
      startMatchPhase();
    }
  };
}

function startMatchPhase(){
  const s = vocabSession;
  s.phase = 'match';
  const shuffled = shuffle([...s.wordIds]);
  s.matchGroups = [];
  for(let i=0;i<shuffled.length;i+=5){
    s.matchGroups.push(shuffled.slice(i,i+5));
  }
  s.matchGroupIndex = 0;
  setupMatchRound();
  render();
}

function setupMatchRound(){
  const s = vocabSession;
  const ids = s.matchGroups[s.matchGroupIndex];
  const wordsInGroup = ids.map(id=>VOCAB_WORDS.find(w=>w.id===id));
  s.matchState = {
    leftItems: shuffle(wordsInGroup.map(w=>({id:w.id, text:w.en}))),
    rightItems: shuffle(wordsInGroup.map(w=>({id:w.id, text:w.ko}))),
    selectedLeft: null,
    selectedRight: null,
    matchedIds: new Set(),
  };
}

function renderVocabMatch(c){
  const s = vocabSession;
  const theme = dayTheme(s.day);
  const ms = s.matchState;
  const totalGroups = s.matchGroups.length;
  const leftHtml = ms.leftItems.map(item=>{
    const matched = ms.matchedIds.has(item.id);
    const selected = ms.selectedLeft === item.id;
    return `<button class="option match-btn ${matched?'correct':''} ${selected?'selected-match':''}" data-side="left" data-id="${item.id}" ${matched?'disabled':''}>${escapeHtml(item.text)}</button>`;
  }).join('');
  const rightHtml = ms.rightItems.map(item=>{
    const matched = ms.matchedIds.has(item.id);
    const selected = ms.selectedRight === item.id;
    return `<button class="option match-btn ${matched?'correct':''} ${selected?'selected-match':''}" data-side="right" data-id="${item.id}" ${matched?'disabled':''}>${escapeHtml(item.text)}</button>`;
  }).join('');
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.day}일차 · 짝짓기 (${s.matchGroupIndex+1}/${totalGroups}그룹)</div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">${leftHtml}</div>
      <div style="flex:1;">${rightHtml}</div>
    </div>
  `;
  c.querySelectorAll('.match-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const side = btn.dataset.side;
      const id = btn.dataset.id;
      if(side==='left') ms.selectedLeft = (ms.selectedLeft===id ? null : id);
      else ms.selectedRight = (ms.selectedRight===id ? null : id);
      if(ms.selectedLeft && ms.selectedRight){
        if(ms.selectedLeft === ms.selectedRight){
          const matchedId = ms.selectedLeft;
          ms.matchedIds.add(matchedId);
          ms.selectedLeft = null;
          ms.selectedRight = null;
          recordVocabCorrect(matchedId);
          toast(theme.emoji + ' 짝짜꿍! 정답이에요');
          render();
          if(ms.matchedIds.size === s.matchGroups[s.matchGroupIndex].length){
            setTimeout(()=>{
              if(s.matchGroupIndex < s.matchGroups.length-1){
                s.matchGroupIndex++;
                setupMatchRound();
                render();
              }else{
                startChoicePhase('choice1');
              }
            }, 500);
          }
        }else{
          recordVocabWrong(ms.selectedLeft);
          toast('🤔 다시 시도해보세요');
          ms.selectedLeft = null;
          ms.selectedRight = null;
          render();
        }
      }else{
        render();
      }
    };
  });
}

function buildChoiceQuestion(id, isKo2En, labelSuffix){
  const word = VOCAB_WORDS.find(w=>w.id===id);
  const pool = VOCAB_WORDS.filter(w=>w.id!==id);
  shuffle(pool);
  const distractors = pool.slice(0,3);
  let options, correctText, promptText, promptLabel;
  if(isKo2En){
    options = shuffle([word, ...distractors].map(w=>w.en));
    correctText = word.en; promptText = word.ko; promptLabel = '이 뜻에 맞는 영단어는?' + (labelSuffix||'');
  }else{
    options = shuffle([word, ...distractors].map(w=>w.ko));
    correctText = word.ko; promptText = word.en; promptLabel = '이 단어의 뜻은?' + (labelSuffix||'');
  }
  return {wordId:id, options, correctText, promptText, promptLabel, answered:false};
}

function startChoicePhase(type){
  const s = vocabSession;
  s.phase = type;
  s.queue = shuffle([...s.wordIds]);
  nextChoiceQuestion();
  render();
}

function nextChoiceQuestion(){
  const s = vocabSession;
  if(s.queue.length === 0){
    if(s.phase === 'choice1'){ startChoicePhase('choice2'); }
    else{ startRetryPhase(); }
    return;
  }
  const id = s.queue.shift();
  s.currentQ = buildChoiceQuestion(id, s.phase === 'choice1');
}

function startRetryPhase(){
  const s = vocabSession;
  const wrongIds = [...s.wrongThisSession];
  if(wrongIds.length === 0){
    finishVocabSession();
    return;
  }
  s.phase = 'retry';
  s.queue = shuffle(wrongIds);
  s.retryStillWrong = new Set();
  nextRetryQuestion();
  render();
}

function nextRetryQuestion(){
  const s = vocabSession;
  if(s.queue.length === 0){
    if(s.retryStillWrong.size > 0){
      s.queue = shuffle([...s.retryStillWrong]);
      s.retryStillWrong = new Set();
      nextRetryQuestion();
      return;
    }else{
      finishVocabSession();
      return;
    }
  }
  const id = s.queue.shift();
  s.currentQ = buildChoiceQuestion(id, Math.random() < 0.5, ' (재확인)');
}

function renderVocabChoice(c){
  const s = vocabSession;
  const q = s.currentQ;
  const theme = dayTheme(s.day);
  const phaseLabel = s.phase==='choice1' ? '뜻→영단어 확인' : s.phase==='choice2' ? '영단어→뜻 확인' : '재확인 문제';
  const remaining = s.queue.length + (s.phase==='retry' && s.retryStillWrong ? s.retryStillWrong.size : 0) + 1;
  c.innerHTML = `
    <div class="progress-line" style="margin-bottom:10px;">${theme.emoji} ${s.day}일차 · ${phaseLabel} · 남은 ${remaining}개</div>
    <div class="quiz-q" style="border:2px solid ${theme.color}22;">
      <div class="quiz-q-label">${q.promptLabel}</div>
      <div class="quiz-q-word">${escapeHtml(q.promptText)}</div>
    </div>
    <div id="vocabOptions"></div>
  `;
  const wrap = document.getElementById('vocabOptions');
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>{
      if(q.answered) return;
      q.answered = true;
      const correct = opt === q.correctText;
      if(correct){
        b.classList.add('correct');
        recordVocabCorrect(q.wordId);
        toast(theme.emoji + ' 정답이에요! 잘했어요');
      }else{
        b.classList.add('wrong');
        [...wrap.children].forEach(ch=>{ if(ch.textContent===q.correctText) ch.classList.add('correct'); });
        recordVocabWrong(q.wordId);
        toast('🤔 다음엔 맞힐 수 있어요');
        if(s.phase === 'retry') s.retryStillWrong.add(q.wordId);
      }
      [...wrap.children].forEach(ch=>ch.disabled=true);
      setTimeout(()=>{
        if(s.phase === 'retry') nextRetryQuestion();
        else nextChoiceQuestion();
        render();
      }, 700);
    };
    wrap.appendChild(b);
  });
}

function finishVocabSession(){
  const s = vocabSession;
  const wrongList = [...s.wrongThisSession].map(id=>VOCAB_WORDS.find(w=>w.id===id));
  if(!vocabCompletedDays.includes(s.day)){
    vocabCompletedDays.push(s.day);
    saveVocabDays();
  }
  s.phase = 'done';
  s.finalWrongList = wrongList;
  render();
}

        <div class="pass-hint">${list.length ? '🎉🎊 헷갈렸던 단어 ' + list.length + '개는 오답노트에 저장됐어요' : '🌟 한 번도 틀리지 않았어요, 완벽해요!'}</div>

function renderStats(c){
  c.innerHTML = `<div class="section-title">${escapeHtml(currentUser)}님의 학습 현황</div><div id="statList"></div>`;

  if(words.length===0){
    list.innerHTML = '<div class="empty">아직 학습한 단어가 없어요.</div>';
    return;
  }
  const totalCorrect = Object.values(progress).reduce((s,x)=>s+(x.correct||0),0);
  const totalWrong = Object.values(progress).reduce((s,x)=>s+(x.wrong||0),0);
  const summary = document.createElement('div');
  summary.className = 'stat-card';
  summary.innerHTML = `<div><div class="stat-name">전체 누적</div><div class="stat-detail">맞음 / 틀림</div></div><div><span class="stat-num good">${totalCorrect}</span> / <span class="stat-num bad">${totalWrong}</span></div>`;
  list.appendChild(summary);

  words.forEach(w=>{
    const p = progress[w.id] || {correct:0, wrong:0};
    if((p.correct||0)===0 && (p.wrong||0)===0) return;
    const wb = w.batch || 1;
    const row = document.createElement('div');
    row.className = 'stat-card';
    row.innerHTML = `<div><div class="stat-name">${escapeHtml(w.en)}</div><div class="stat-detail">${escapeHtml(w.ko)} · ${wb}회차</div></div><div><span class="stat-num good">${p.correct||0}</span> / <span class="stat-num bad">${p.wrong||0}</span></div>`;
    list.appendChild(row);
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadAll();
